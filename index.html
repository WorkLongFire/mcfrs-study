<style>
/* Layout: one phone-shaped column; full-bleed vertical clip feed under a floating topic switch, bottom tab bar. Single dark look by design (night shift). */
:root{
  --ink:#0b0d12; --panel:#151922; --panel-2:#1d2230; --line:#2a3042;
  --text:#f2f4f8; --muted:#9aa3b5;
  --emt:#3d8bff; --fire:#ff5a1f; --accent:var(--emt);
  --good:#2fd28a; --bad:#ff4d6a;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
:root[data-topic="fire"]{--accent:var(--fire)}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:60px}
#app{height:100%;max-width:520px;margin:0 auto;position:relative;display:flex;flex-direction:column;background:#000}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto}
.view.pad{padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:var(--ink)}

/* top switch */
.topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:4px;padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.topbar>*{pointer-events:auto}
.tswitch{display:flex;gap:18px;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.06em;text-transform:uppercase}
.tswitch button{color:rgba(255,255,255,.55);padding:4px 2px;position:relative;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.tswitch button[aria-pressed="true"]{color:#fff}
.tswitch button[aria-pressed="true"]::after{content:"";position:absolute;left:20%;right:20%;bottom:-3px;height:3px;border-radius:2px;background:var(--accent)}
.topbar .side{position:absolute;top:10px;display:flex;gap:6px}
.topbar .left{left:max(12px,env(safe-area-inset-left,0px));flex-direction:column;align-items:flex-start}
#focusPill{font-family:var(--f-body);font-weight:600;font-size:12px;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
input[type=range]{padding:0;accent-color:var(--accent)}
.focuschk{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--accent);border-radius:12px;padding:10px;background:color-mix(in srgb,var(--accent) 10%,transparent);font-size:14px;line-height:1.4;cursor:pointer}
.topbar .right{right:max(12px,env(safe-area-inset-right,0px))}
.pill{font-family:var(--f-mono);font-size:11px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 10px;backdrop-filter:blur(6px)}
.pill b{color:var(--accent)}

/* feed */
#feed{scroll-snap-type:y mandatory;background:#000;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.clip{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.clip .bg{position:absolute;inset:0}
.clip[data-topic="emt"] .bg{background:radial-gradient(120% 80% at 30% 20%,#13305f 0%,#0a1630 45%,#05070d 100%)}
.clip[data-topic="fire"] .bg{background:radial-gradient(120% 80% at 70% 90%,#6a1c06 0%,#2a0b05 45%,#070404 100%)}
.ecg{position:absolute;left:0;right:0;bottom:22%;height:80px;opacity:.35}
.ecg path{fill:none;stroke:var(--emt);stroke-width:2.5;stroke-dasharray:900;stroke-dashoffset:900;animation:ecg 2.4s linear infinite}
@keyframes ecg{to{stroke-dashoffset:0}}
.ember{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:#ffb347;box-shadow:0 0 8px #ff7a1f;opacity:0;animation:rise 4s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-90vh) translateX(30px);opacity:0}}
.stage{position:relative;z-index:2;width:100%;padding:0 84px 0 max(22px,env(safe-area-inset-left,0px));display:grid;gap:12px;margin-top:-40px}
.scene-emoji{font-size:84px;line-height:1;filter:drop-shadow(0 6px 20px rgba(0,0,0,.5))}
.scene-tag{font-family:var(--f-mono);font-size:11px;color:var(--accent);letter-spacing:.12em;text-transform:uppercase}
.scene-head{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,9vw,46px);line-height:.98;text-transform:uppercase;text-wrap:balance;margin:0}
.scene-head.long{font-size:clamp(26px,7vw,32px);line-height:1.04}
.scene-text{font-size:17px;line-height:1.45;color:#e6e9f0;max-width:34ch;margin:0}
.stage.anim>*{animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both}
.stage.anim>*:nth-child(2){animation-delay:.05s}.stage.anim>*:nth-child(3){animation-delay:.1s}.stage.anim>*:nth-child(4){animation-delay:.16s}
@keyframes pop{from{opacity:.0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.bars{position:absolute;top:56px;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;gap:4px;z-index:5}
.bars span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.bars i{display:block;height:100%;width:0;background:#fff}
.bars span.done i{width:100%}
.bars span.run i{animation:fill var(--dur,4s) linear forwards}
.clip.paused .bars span.run i{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.paused-badge{position:absolute;z-index:6;font-size:64px;opacity:0;transition:opacity .2s;pointer-events:none}
.clip.paused .paused-badge{opacity:.85}
.meta{position:absolute;z-index:5;left:max(16px,env(safe-area-inset-left,0px));right:84px;bottom:16px;display:grid;gap:6px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.meta .who{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center}
.meta .who .tag{font-family:var(--f-mono);font-size:10px;font-weight:500;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:1px 5px;text-shadow:none}
.meta .ttl{font-size:14px;line-height:1.35}
.meta .hs{font-size:13px;color:#cfd5e2;font-weight:600}
.rail{position:absolute;z-index:6;right:max(10px,env(safe-area-inset-right,0px));bottom:24px;display:grid;gap:16px;justify-items:center}
.rail button{display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.rail .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);font-size:22px}
.rail button.on .ic{background:var(--accent)}
.rail .avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;background:var(--accent);border:2px solid #fff}
.watched-chip{position:absolute;z-index:5;top:70px;right:max(14px,env(safe-area-inset-right,0px));font-family:var(--f-mono);font-size:10px;color:var(--good);border:1px solid var(--good);border-radius:4px;padding:2px 6px;background:rgba(0,0,0,.4)}

/* bottom nav */
nav.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:#000;border-top:1px solid #1c1f28;padding:6px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{display:grid;justify-items:center;gap:2px;font-size:11px;color:#8d94a6;padding:4px 0;position:relative}
nav.tabs button .i{font-size:20px;line-height:1.1}
nav.tabs button[aria-current="page"]{color:#fff}
nav.tabs .plus .i{width:46px;height:30px;border-radius:9px;display:grid;place-items:center;background:#fff;color:#000;font-weight:800;font-size:22px;box-shadow:-3px 0 0 var(--emt),3px 0 0 var(--fire)}
.badge{position:absolute;top:0;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* common panels */
h1.vh{font-family:var(--f-display);font-weight:800;font-size:34px;text-transform:uppercase;letter-spacing:.02em;margin:4px 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px;line-height:1.45}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.btn{background:var(--accent);color:#fff;font-weight:700;border-radius:12px;padding:12px 16px;text-align:center}
.btn.ghost{background:var(--panel-2);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:grid;gap:12px}
.lbl{font-size:11px;font-family:var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:6px}
.empty{text-align:center;padding:40px 16px;color:var(--muted);display:grid;gap:14px;justify-items:center}
.empty .big{font-size:48px}

/* search */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:14px}
.tile{aspect-ratio:9/14;max-width:100%;border-radius:12px;overflow:hidden;position:relative;text-align:left;padding:10px;display:flex;flex-direction:column;justify-content:space-between}
.tile[data-topic="emt"]{background:linear-gradient(160deg,#173a74,#070b16)}
.tile[data-topic="fire"]{background:linear-gradient(160deg,#7a2508,#120604)}
.tile .e{font-size:38px}
.tile .t{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1;text-transform:uppercase}
.tile .c{font-size:11px;color:#cdd3df;margin-top:4px}
.tile .w{position:absolute;top:8px;right:8px;font-size:10px;font-family:var(--f-mono);color:var(--good)}

/* quiz */
.qprog{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.qtext{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;text-wrap:balance;margin:0}
.choice{display:block;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;line-height:1.35}
.choice.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--panel-2))}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--panel-2))}
.explain{font-size:14px;line-height:1.5;color:#d8dce6;border-left:3px solid var(--accent);padding-left:10px}
.score{font-family:var(--f-display);font-weight:800;font-size:72px;line-height:1}
.from{font-size:12px;color:var(--muted)}

/* create */
.create-layout{display:grid;gap:16px}
.scene-row{display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:start}
.scene-row .emo{text-align:center;font-size:22px;padding:8px 4px}
.scene-row .fields{display:grid;gap:6px;min-width:0}
.preview{height:420px;border-radius:18px;overflow:hidden;position:relative;border:1px solid var(--line)}
.preview .clip{height:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:12px;color:var(--muted);line-height:1.45}

/* squad */
.msgs{display:grid;gap:10px}
.msg{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);font-size:16px;color:#fff;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.msg .body{min-width:0}
.msg .name{font-size:13px;font-weight:700}
.msg .name span{font-weight:400;color:var(--muted);font-size:11px;margin-left:6px}
.msg .txt{font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.mini{display:flex;gap:10px;align-items:center;margin-top:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;width:100%}
.mini .e{font-size:26px}
.mini .t{font-weight:700;font-size:13px}
.mini .s{font-size:11px;color:var(--muted)}
.composer{position:sticky;bottom:0;display:flex;gap:8px;padding-top:10px;background:var(--ink)}
.friends{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.friend{display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--muted);min-width:56px}
.friend .av{width:48px;height:48px;font-size:20px}
.board li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.board{list-style:none;margin:0;padding:0}
.board .pts{font-family:var(--f-mono);color:var(--accent)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:#fff}

/* sheet + toast */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end}
.sheet{background:var(--panel);width:100%;max-height:75%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0;font-family:var(--f-display);font-size:24px;text-transform:uppercase}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;background:#fff;color:#000;font-weight:600;font-size:13px;padding:10px 14px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:90%;text-align:center}
.disclaimer{font-size:11px;color:var(--muted);line-height:1.45;margin-top:18px}
.clip .vbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.clip.has-video .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.05) 35%,rgba(0,0,0,.75))}
.clip.has-video .stage{align-self:flex-end;margin:0 0 150px}
.clip.has-video .scene-emoji{font-size:44px}
.clip.has-video .scene-head,.clip.has-video .scene-text{text-shadow:0 2px 8px rgba(0,0,0,.9)}
.vis{font-size:12px;color:#ffe2a8;background:rgba(0,0,0,.45);border:1px dashed rgba(255,226,168,.5);border-radius:8px;padding:6px 8px;max-width:34ch}
#howTo summary{cursor:pointer}
.steps{margin:10px 0 0;padding-left:20px;display:grid;gap:6px;font-size:14px;line-height:1.45}
.cardlist{display:grid;gap:6px;max-height:220px;overflow-y:auto}
.cardlist>div{display:grid;gap:2px;background:var(--panel-2);border-radius:8px;padding:8px 10px;font-size:13px;min-width:0;overflow-wrap:anywhere}
.cardlist span{color:var(--muted)}
.scedit{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;transition:border-color .2s}
.scedit.live{border-color:var(--accent)}
.schead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.schead .chip{padding:4px 9px}
.schead .chip:disabled{opacity:.35}
.mini-l{font-size:11px;color:var(--muted)}
.fcard{display:grid;place-items:center;gap:10px;width:100%;min-height:260px;margin:12px 0;padding:24px;border-radius:18px;background:var(--panel);border:1px solid var(--line);text-align:center;transition:transform .25s}
.fcard.flipped{background:color-mix(in srgb,var(--accent) 16%,var(--panel));border-color:var(--accent)}
.fcard .side-l{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--accent)}
.fcard .fc-text{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.08;text-wrap:balance}
.fcard:active{transform:scale(.98)}
.clip[data-topic="custom"] .bg{background:radial-gradient(120% 80% at 50% 30%,#3b2370 0%,#170c2e 50%,#07050d 100%)}
.tile[data-topic="custom"]{background:linear-gradient(160deg,#4a2c86,#0d0816)}
.scene-img{max-height:150px;max-width:100%;border-radius:10px;border:2px solid rgba(255,255,255,.25);object-fit:cover}
.filterpill{position:absolute;top:68px;left:50%;transform:translateX(-50%);max-width:78%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-body);font-weight:600}
nav.tabs button{font-size:10.5px}
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.stepper span{font-size:11px;font-family:var(--f-mono);padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.stepper span.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stepper span.done{color:var(--good);border-color:var(--good)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.ph{position:relative}.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block}
.ph .chip{position:absolute;top:4px;right:4px;padding:2px 8px;background:rgba(0,0,0,.6)}
.ocr{display:flex;gap:10px;align-items:flex-start}.ocr img{width:72px;border-radius:8px;flex-shrink:0}
.ulc{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px}
.ulc.flag{border-color:#e0a53a;background:color-mix(in srgb,#e0a53a 7%,transparent)}
.ulc.off{opacity:.5}
.ulc-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ulc-top .chip{padding:3px 9px}
.ulflag{font-size:12.5px;line-height:1.45;color:#f3cf8b;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.okc{color:var(--good);font-weight:700}
.warn{color:#f3cf8b}
.bar3{height:6px;border-radius:3px;background:var(--panel-2);display:flex;overflow:hidden}

<script>
const EMT_VIDEOS = [{"id": "emt-01", "topic": "emt", "title": "Perfect CPR in 30 Seconds", "creator": "@compressionqueen_emt", "hashtags": ["#emt", "#cpr", "#aha", "#lifesaver"], "likes": 48210, "scenes": [{"emoji": "🫀", "heading": "Push Hard, Push Fast", "text": "Adult CPR rate is 100 to 120 compressions per minute. Think of the beat of 'Stayin' Alive'. Yes, really."}, {"emoji": "📏", "heading": "Depth Matters", "text": "Go at least 2 inches (5 cm) deep, but not past 2.4 inches (6 cm). Lower half of the sternum."}, {"emoji": "🔄", "heading": "Let It Recoil", "text": "Full chest recoil every push. No leaning! Leaning stops the heart from refilling."}, {"emoji": "⚡", "heading": "Ratio and Pauses", "text": "Without an advanced airway, 30 compressions to 2 breaths. Keep pauses under 10 seconds. Swap compressors every 2 minutes."}, {"emoji": "🧠", "heading": "Memory Hook", "text": "100-120, 2 inches, 30:2, swap at 2 minutes. 'Hard, fast, full recoil, few pauses.'"}], "quiz": [{"q": "What is the adult compression rate?", "choices": ["60-80/min", "100-120/min", "140-160/min", "Any fast rate"], "answer": 1, "explain": "AHA recommends 100 to 120 compressions per minute."}, {"q": "Adult compression depth should be?", "choices": ["1 inch", "At least 2 inches, not over 2.4", "3 inches", "Until ribs stop cracking"], "answer": 1, "explain": "At least 2 in (5 cm) and no more than 2.4 in (6 cm)."}]}, {"id": "emt-02", "topic": "emt", "title": "AED: Plug and Play", "creator": "@shockandawe", "hashtags": ["#emt", "#aed", "#cardiacarrest", "#nremt"], "likes": 31870, "scenes": [{"emoji": "🔌", "heading": "Power On First", "text": "Arrive, turn the AED on, and follow the voice prompts. It is literally built to coach you."}, {"emoji": "🩹", "heading": "Pads on Bare Chest", "text": "Dry the chest, remove medication patches, and place pads firmly on bare skin. Upper right, lower left."}, {"emoji": "🙌", "heading": "Everybody Clear", "text": "Stop CPR while it analyzes. Nobody touches the patient. Then shout clear and press shock if advised."}, {"emoji": "🔁", "heading": "Straight Back to CPR", "text": "Resume compressions immediately after the shock. Do not wait to check a pulse. Re-analyze after 2 minutes."}, {"emoji": "🧠", "heading": "Memory Hook", "text": "Power, Pads, Analyze, Clear, Shock, CPR. Say it: 'Please Put Another Charge, Stat, CPR.'"}], "quiz": [{"q": "What do you do right after delivering a shock?", "choices": ["Check pulse for 30 seconds", "Remove the pads", "Resume CPR immediately", "Wait for ALS"], "answer": 2, "explain": "Resume compressions right away and re-analyze after 2 minutes."}, {"q": "Where do adult pads go?", "choices": ["Both on the back", "Upper right chest and lower left side", "Over medication patches", "On clothing"], "answer": 1, "explain": "Place on bare skin, upper right chest and lower left side."}]}, {"id": "emt-03", "topic": "emt", "title": "OPA vs NPA Sizing Hack", "creator": "@airwayalex", "hashtags": ["#emt", "#airway", "#opa", "#npa"], "likes": 22540, "scenes": [{"emoji": "👄", "heading": "OPA: Unresponsive Only", "text": "Oral airway is for unresponsive patients with no gag reflex. Gagging means it is the wrong tool."}, {"emoji": "📐", "heading": "Measure the OPA", "text": "Hold it beside the face. Corner of the mouth to the earlobe, or the angle of the jaw."}, {"emoji": "👃", "heading": "NPA Is Gag-Friendly", "text": "Nasal airway works on responsive patients with a gag reflex. Lubricate it with water-soluble jelly."}, {"emoji": "📏", "heading": "Measure the NPA", "text": "Tip of the nose to the earlobe. Bevel toward the septum. Skip it with severe facial trauma or suspected skull fracture."}, {"emoji": "🧠", "heading": "Memory Hook", "text": "Oral = Out cold, mouth corner to ear. Nasal = gag is okay, nose tip to ear."}], "quiz": [{"q": "Which patient can receive an OPA?", "choices": ["Awake and gagging", "Unresponsive with no gag reflex", "Talking but anxious", "Any child"], "answer": 1, "explain": "OPAs are only for unresponsive patients without a gag reflex."}, {"q": "How do you size an NPA?", "choices": ["Chin to chest", "Mouth corner to earlobe", "Nose tip to earlobe", "Nose to navel"], "answer": 2, "explain": "Measure from the tip of the nose to the earlobe."}]}, {"id": "emt-04", "topic": "emt", "title": "Primary Assessment Speedrun", "creator": "@abcsandchill", "hashtags": ["#emt", "#primaryassessment", "#abc", "#avpu"], "likes": 27650, "scenes": [{"emoji": "🚧", "heading": "Scene Safety First", "text": "Dead heroes save nobody. Check hazards, use BSI, count patients, and call for more help early."}, {"emoji": "👀", "heading": "General Impression", "text": "Sick or not sick? Age, position, color, effort. Decide your priority in seconds."}, {"emoji": "🗣️", "heading": "AVPU Check", "text": "Alert, responds to Verbal, responds to Painful, Unresponsive. It is a fast level of consciousness read."}, {"emoji": "🫁", "heading": "Then ABCs", "text": "Airway, Breathing, Circulation. Fix life threats as you find them, including major bleeding and pulse quality."}, {"emoji": "🧠", "heading": "Memory Hook", "text": "Scene, Impression, AVPU, ABC, Priority. Treat what kills first, then decide: stay or go?"}], "quiz": [{"q": "What does the P in AVPU stand for?", "choices": ["Pulse", "Pain", "Pupils", "Position"], "answer": 1, "explain": "P means responds to painful stimuli."}, {"q": "What comes first in a call?", "choices": ["Scene safety", "Vital signs", "SAMPLE history", "Transport"], "answer": 0, "explain": "Scene size-up and safety come before patient care."}]}, {"id": "emt-05", "topic": "emt", "title": "Vitals Norms Cheat Sheet", "creator": "@pulsecheckpaige", "hashtags": ["#emt", "#vitals", "#nremt", "#studytok"], "likes": 19320, "scenes": [{"emoji": "💓", "heading": "Adult Pulse", "text": "Normal adult heart rate is 60 to 100 beats per minute. Check rate, rhythm, and quality."}, {"emoji": "🌬️", "heading": "Adult Breathing", "text": "Normal adult respiratory rate is 12 to 20 breaths per minute. Under 12 or over 20 deserves attention."}, {"emoji": "🩺", "heading": "Blood Pressure", "text": "Around 120/80 is a typical adult reading. Below about 90 systolic in a sick patient is a red flag."}, {"emoji": "🫧", "heading": "SpO2 and Skin", "text": "SpO2 of 95 percent or higher is typical. Also note skin color, temperature, and moisture."}, {"emoji": "🧠", "heading": "Memory Hook", "text": "60-100 pulse, 12-20 breathing, 120/80 pressure, 95-plus oxygen. 'Sixty, twelve, one-twenty, ninety-five.'"}], "quiz": [{"q": "Normal adult respiratory rate?", "choices": ["8-10", "12-20", "24-30", "30-40"], "answer": 1, "explain": "Adults typically breathe 12 to 20 times per minute."}, {"q": "Typical normal SpO2 is?", "choices": ["95% or higher", "80%", "88%", "70%"], "answer": 0, "explain": "A healthy SpO2 is usually 95 percent or above."}]}, {"id": "emt-06", "topic": "emt", "title": "BE-FAST Stroke Check", "creator": "@strokesquadsam", "hashtags": ["#emt", "#stroke", "#befast", "#timeisbrain"], "likes": 41200, "scenes": [{"emoji": "⚖️", "heading": "B and E", "text": "Balance: sudden loss of balance or dizziness. Eyes: sudden vision loss or double vision."}, {"emoji": "🙂", "heading": "Face Droop", "text": "Ask them to smile. One side sagging is a classic stroke sign."}, {"emoji": "💪", "heading": "Arm Drift", "text": "Eyes closed, arms out. One arm drifting down or weak? Suspect stroke."}, {"emoji": "🗣️", "heading": "Speech and Time", "text": "Slurred or strange speech. Note the last known well time and call it in. Time is brain."}, {"emoji": "🧠", "heading": "Memory Hook", "text": "BE-FAST: Balance, Eyes, Face, Arm, Speech, Time. Check glucose too, since low sugar can mimic stroke."}], "quiz": [{"q": "What does the T in BE-FAST stand for?", "choices": ["Temperature", "Time to call, note last known well", "Tremor", "Trauma"], "answer": 1, "explain": "T is Time: note last known well and activate EMS and the stroke center."}, {"q": "Which condition can mimic a stroke?", "choices": ["Hypoglycemia", "Sunburn", "Sprained ankle", "Blisters"], "answer": 0, "explain": "Low blood sugar can cause stroke-like signs, so check glucose."}]}, {"id": "emt-07", "topic": "emt", "title": "Chest Pain: Aspirin and Nitro", "creator": "@heartbeatharry", "hashtags": ["#emt", "#mi", "#aspirin", "#nitro"], "likes": 36780, "scenes": [{"emoji": "🫀", "heading": "Suspect an MI", "text": "Chest pressure, sweating, nausea, arm or jaw pain. Get oxygen only if SpO2 is low, and keep them calm and resting."}, {"emoji": "💊", "heading": "Aspirin Time", "text": "If no allergy or active bleeding, give aspirin to chew. Typical adult dose is 162 to 325 mg. Follow local protocol."}, {"emoji": "🧪", "heading": "Nitro Assist", "text": "Help with the patient's own prescribed nitroglycerin under medical direction. Systolic BP must be above 90 to 100, per protocol."}, {"emoji": "🚫", "heading": "Nitro Red Flags", "text": "Hold it with low BP, recent erectile dysfunction meds, or if medical control says no. Reassess vitals after each dose."}, {"emoji": "🧠", "heading": "Memory Hook", "text": "Chew the aspirin, check the pressure, patient's own nitro only. 'Chew, check, own.'"}], "quiz": [{"q": "How is aspirin given for suspected MI?", "choices": ["Swallowed whole with water only", "Chewed", "Injected", "Rubbed on skin"], "answer": 1, "explain": "Chewed aspirin absorbs faster, which is why it is given that way."}, {"q": "Before assisting with nitro, check that?", "choices": ["Pupils are equal", "Systolic BP meets protocol minimum", "Temperature is normal", "Patient is lying flat only"], "answer": 1, "explain": "Nitro can drop blood pressure, so confirm systolic is above your protocol minimum, commonly 90 to 100."}]}, {"id": "emt-08", "topic": "emt", "title": "Anaphylaxis: Epi Fast", "creator": "@epipenelope", "hashtags": ["#emt", "#anaphylaxis", "#epi", "#allergy"], "likes": 52490, "scenes": [{"emoji": "🐝", "heading": "Know the Signs", "text": "Hives, swelling of face or tongue, wheezing, trouble breathing, vomiting, low blood pressure after an exposure."}, {"emoji": "💉", "heading": "Epi Auto-Injector", "text": "EMTs can use the epinephrine auto-injector. Typical doses are 0.3 mg for adults and 0.15 mg for small children."}, {"emoji": "📍", "heading": "Where to Inject", "text": "Outer middle thigh, through clothing if needed. Hold in place for the time on the device label."}, {"emoji": "🔁", "heading": "After the Shot", "text": "Give oxygen, keep them supine if hypotensive, monitor airway, and call ALS. Symptoms can return."}, {"emoji": "🧠", "heading": "Memory Hook", "text": "Epi in the Eh-thigh. 'Hives plus hard breathing equals epi, don't delay.'"}], "quiz": [{"q": "Where is an epi auto-injector given?", "choices": ["Upper arm fat", "Outer mid-thigh", "Abdomen", "Buttock"], "answer": 1, "explain": "The lateral mid-thigh is the standard injection site."}, {"q": "Typical adult auto-injector dose?", "choices": ["0.03 mg", "0.15 mg", "0.3 mg", "3 mg"], "answer": 2, "explain": "Adult auto-injectors deliver 0.3 mg; children's deliver 0.15 mg."}]}, {"id": "emt-09", "topic": "emt", "title": "Low Sugar Rescue", "creator": "@glucosegoblin", "hashtags": ["#emt", "#diabetes", "#hypoglycemia", "#glucose"], "likes": 17450, "scenes": [{"emoji": "🍬", "heading": "Spot Hypoglycemia", "text": "Confused, sweaty, shaky, pale, or acting drunk in a diabetic patient. Check blood glucose if your protocol allows."}, {"emoji": "✅", "heading": "Oral Glucose Rules", "text": "Give oral glucose only if the patient is awake, can swallow, and can protect their own airway."}, {"emoji": "🚫", "heading": "When Not To", "text": "Unresponsive, seizing, or unable to swallow means no oral glucose. Support the airway and call ALS."}, {"emoji": "🔍", "heading": "Reassess", "text": "Recheck mental status and glucose. Always transport, since insulin can outlast the sugar you gave."}, {"emoji": "🧠", "heading": "Memory Hook", "text": "Awake and Able to swallow gets glucose. 'If they can't chew, don't do.'"}], "quiz": [{"q": "When is oral glucose appropriate?", "choices": ["Unresponsive patient", "Seizing patient", "Awake patient who can swallow", "Vomiting and choking"], "answer": 2, "explain": "Only give it to patients who are alert enough to swallow and protect the airway."}, {"q": "Which sign suggests hypoglycemia?", "choices": ["Pink warm dry skin", "Sweating and confusion", "Slow regular pulse", "Itchy rash"], "answer": 1, "explain": "Sweaty, shaky, confused patients may have low blood sugar."}]}, {"id": "emt-10", "topic": "emt", "title": "Stop the Bleed + Shock", "creator": "@tourniquettina", "hashtags": ["#emt", "#trauma", "#tourniquet", "#shock"], "likes": 63340, "scenes": [{"emoji": "🩸", "heading": "Direct Pressure", "text": "Life-threatening bleeding first. Apply firm, direct pressure with a dressing, then a pressure bandage."}, {"emoji": "🎗️", "heading": "Tourniquet Time", "text": "Pressure failing on a limb? Tourniquet 2 to 3 inches above the wound, never on a joint. Tighten until bleeding stops."}, {"emoji": "⏱️", "heading": "Write the Time", "text": "Mark the time applied. Do not loosen it in the field. Expect it to hurt, that is normal."}, {"emoji": "😰", "heading": "Shock Signs", "text": "Fast pulse, pale cool clammy skin, anxiety, fast breathing, altered mental status. Low blood pressure comes late."}, {"emoji": "🧠", "heading": "Memory Hook", "text": "Press, Tourniquet, Time it. Treat shock: lay flat, keep warm, oxygen if needed, rapid transport."}], "quiz": [{"q": "Where does a limb tourniquet go?", "choices": ["On the joint", "2-3 inches above the wound", "Below the wound", "Over the clothing wrinkle at the foot"], "answer": 1, "explain": "Place it about 2 to 3 inches above the wound, not over a joint."}, {"q": "Which is a LATE sign of shock?", "choices": ["Low blood pressure", "Fast pulse", "Pale skin", "Anxiety"], "answer": 0, "explain": "Hypotension appears late, after the body's compensation fails."}]}, {"id": "emt-11", "topic": "emt", "title": "START Triage in 60 Seconds", "creator": "@triagetony", "hashtags": ["#emt", "#triage", "#start", "#mci"], "likes": 25910, "scenes": [{"emoji": "🚶", "heading": "Walkers Are Green", "text": "Shout for everyone who can walk to move. Those patients are minor, green. Now assess the rest."}, {"emoji": "🫁", "heading": "Check Breathing", "text": "Not breathing? Reposition the airway once. Still apneic means black. Breathing after repositioning is red. Over 30 per minute is red."}, {"emoji": "🩸", "heading": "Perfusion Check", "text": "No radial pulse or capillary refill over 2 seconds means red. Control major bleeding as you go."}, {"emoji": "🧩", "heading": "Mental Status", "text": "Cannot follow simple commands means red. Otherwise, the patient is yellow, delayed."}, {"emoji": "🧠", "heading": "Memory Hook", "text": "30, 2, Can do: breaths under 30, refill under 2, can follow commands. Any fail means red."}], "quiz": [{"q": "Respiratory rate that makes a START patient red?", "choices": ["Over 30", "Over 20", "Under 12", "Exactly 24"], "answer": 0, "explain": "More than 30 breaths per minute is immediate (red)."}, {"q": "What color are walking wounded?", "choices": ["Red", "Yellow", "Green", "Black"], "answer": 2, "explain": "Patients who can walk are minor, tagged green."}]}, {"id": "emt-12", "topic": "emt", "title": "Baby Time: Birth, Burns, Histories", "creator": "@stork_and_stretcher", "hashtags": ["#emt", "#childbirth", "#apgar", "#burns", "#sample"], "likes": 38760, "scenes": [{"emoji": "👶", "heading": "Crowning? Prep!", "text": "Head crowning means delivery is imminent. Gently support the head, check for cord around the neck, then dry and warm the newborn."}, {"emoji": "📊", "heading": "APGAR Score", "text": "At 1 and 5 minutes score Appearance, Pulse, Grimace, Activity, Respiration, 0 to 2 each. Seven to 10 is reassuring."}, {"emoji": "🔥", "heading": "Rule of Nines", "text": "Adult: head 9, each arm 9, chest 18, back 18, each leg 18, groin 1. Kids have a bigger head, smaller legs."}, {"emoji": "📝", "heading": "SAMPLE and OPQRST", "text": "SAMPLE: Signs, Allergies, Medications, Past history, Last oral intake, Events. OPQRST: Onset, Provocation, Quality, Radiation, Severity, Time."}, {"emoji": "🧠", "heading": "Memory Hook", "text": "APGAR is Appearance, Pulse, Grimace, Activity, Respiration. Nines: head 9, arms 9 and 9, front 18, back 18, legs 18 and 18, groin 1."}], "quiz": [{"q": "In an adult, each leg (front and back) is about what percent BSA?", "choices": ["9%", "18%", "27%", "36%"], "answer": 1, "explain": "Each adult leg is 18 percent in the rule of nines."}, {"q": "What does the G in APGAR stand for?", "choices": ["Glucose", "Grimace", "Gestation", "Grip"], "answer": 1, "explain": "G is Grimace, the reflex irritability response."}]}];
const NREMT_DECKS = [{"name": "NREMT · Airway Anatomy & Assessment", "domain": "Airway", "cards": [{"front": "Upper vs lower airway divider", "back": "Upper: nose/mouth to larynx (vocal cords). Lower: below the larynx - trachea, bronchi, bronchioles, alveoli."}, {"front": "Function of the epiglottis", "back": "Leaf-shaped flap that covers the glottis during swallowing to keep food and fluid out of the trachea."}, {"front": "Cricoid cartilage", "back": "Firm ring at the lower larynx; the only complete cartilage ring of the airway. Site of cricoid pressure (Sellick), which is no longer routinely recommended."}, {"front": "Thyroid cartilage", "back": "Adam's apple; shield-shaped, largest laryngeal cartilage, protects the vocal cords."}, {"front": "Carina", "back": "Point where the trachea divides into the right and left mainstem bronchi."}, {"front": "Why is the right mainstem bronchus more prone to foreign bodies/intubation errors?", "back": "It is shorter, wider and straighter (less angled) than the left."}, {"front": "Alveoli", "back": "Tiny air sacs where O2 and CO2 are exchanged with pulmonary capillary blood by diffusion."}, {"front": "Diaphragm", "back": "Main muscle of inspiration. Contracts and flattens, increasing chest volume and lowering pressure so air flows in."}, {"front": "Inhalation vs exhalation mechanics", "back": "Inhalation is active: diaphragm and intercostals contract. Exhalation is passive: muscles relax, chest recoils."}, {"front": "Normal room air O2 and CO2 composition", "back": "About 21% oxygen, 78% nitrogen, ~0.04% CO2. Exhaled air is ~16% oxygen (enough for rescue breaths)."}, {"front": "Primary stimulus to breathe in healthy people", "back": "Rising CO2 in the blood/CSF (hypercarbia), sensed by chemoreceptors in the medulla. Low O2 (hypoxic drive) is the backup stimulus."}, {"front": "Hypoxic drive", "back": "In chronic CO2 retainers (some COPD), low O2 becomes the breathing stimulus. Never withhold O2 from a hypoxic patient."}, {"front": "Ventilation vs respiration", "back": "Ventilation: movement of air in and out of the lungs. Respiration: gas exchange (O2/CO2) at alveoli and cells."}, {"front": "Tidal volume (adult approx)", "back": "Volume of one normal breath, about 500 mL (5-7 mL/kg)."}, {"front": "Minute volume", "back": "Tidal volume x respiratory rate; air moved per minute."}, {"front": "Dead space", "back": "Airway volume not involved in gas exchange (~150 mL in adults): trachea, bronchi, mouth, nose."}, {"front": "Normal adult respiratory rate", "back": "12-20 breaths/min."}, {"front": "Normal child respiratory rates by age (approx)", "back": "Toddler 24-40; preschool 22-34; school-age 18-30; adolescent 12-20 breaths/min. Ranges vary slightly by textbook."}, {"front": "Normal infant respiratory rate", "back": "About 30-60 breaths/min (newborn 40-60; slows toward 30-50 by 1 year)."}, {"front": "Normal SpO2", "back": "About 95-100% on room air. Below 94% suggests hypoxia; treat the patient, not the number alone."}, {"front": "Pulse oximetry limitations", "back": "Falsely high with carbon monoxide (reads COHb as oxyHb); unreliable with poor perfusion, cold extremities, nail polish, motion."}, {"front": "Adequate breathing signs", "back": "Rate within normal range, regular rhythm, equal chest rise, clear equal breath sounds, good skin color, normal effort."}, {"front": "Inadequate breathing signs", "back": "Abnormal rate/rhythm, shallow or unequal rise, cyanosis, retractions, nasal flaring, accessory muscle use, tripod, altered mentation."}, {"front": "Signs of respiratory distress (early)", "back": "Anxiety, restlessness, tachypnea, tripod, accessory muscle use, ability to speak only in short phrases."}, {"front": "Signs of respiratory failure/arrest", "back": "Slow or irregular rate, fatigue, decreased LOC, weak cry, cyanosis, bradycardia in children. Needs assisted ventilation."}, {"front": "Retractions", "back": "Skin pulling in at the ribs, above clavicles or sternum during inhalation; sign of increased work of breathing (esp. children)."}, {"front": "Cyanosis", "back": "Blue-gray skin/mucous membranes from low O2 in blood; late sign of hypoxia."}, {"front": "Nasal flaring and head bobbing", "back": "Signs of respiratory distress in infants and children; seesaw breathing (abdominal) is also seen."}, {"front": "Tripod position", "back": "Sitting upright leaning forward on hands; sign of significant respiratory distress."}, {"front": "Capnography normal ETCO2", "back": "35-45 mmHg. Waveform also shows bronchospasm (shark fin) and CPR quality. Monitoring use at EMT level is per local protocol."}]}, {"name": "NREMT · Breath Sounds & Breathing Patterns", "domain": "Airway", "cards": [{"front": "Wheezing", "back": "High-pitched whistling, usually on exhalation; narrowed lower airways (asthma, COPD, anaphylaxis)."}, {"front": "Stridor", "back": "Harsh, high-pitched crowing sound on inhalation; upper airway obstruction (croup, epiglottitis, foreign body, swelling)."}, {"front": "Rhonchi", "back": "Low-pitched, rattling/snoring sounds; secretions in larger airways (bronchitis, pneumonia)."}, {"front": "Rales / crackles", "back": "Fine bubbling or crackling on inspiration; fluid in alveoli (CHF/pulmonary edema, pneumonia)."}, {"front": "Gurgling", "back": "Fluid (blood, vomit, secretions) in the upper airway. Suction immediately."}, {"front": "Snoring", "back": "Partial obstruction by tongue or soft tissue in an unresponsive patient. Open the airway, consider an adjunct."}, {"front": "Diminished or absent breath sounds", "back": "Collapsed lung, pneumothorax, hemothorax, severe asthma 'silent chest', airway obstruction."}, {"front": "Where to auscultate (adult)", "back": "Both sides, comparing left to right: apices (below clavicles, midclavicular), midaxillary, and bases (posterior lower back)."}, {"front": "Cheyne-Stokes respirations", "back": "Gradual increase then decrease in rate/depth with periods of apnea; seen with brain injury, stroke, CHF, end of life."}, {"front": "Kussmaul respirations", "back": "Deep, rapid, labored breathing; blowing off CO2 to compensate for metabolic acidosis (DKA)."}, {"front": "Biot (ataxic) respirations", "back": "Irregular pattern with unpredictable pauses; sign of increased ICP / brainstem damage."}, {"front": "Agonal respirations", "back": "Occasional gasping, slow and ineffective breaths near death; NOT adequate breathing. Treat as arrest and start CPR."}, {"front": "Central neurogenic hyperventilation", "back": "Deep, rapid, regular breathing from brainstem injury."}, {"front": "Apneustic breathing", "back": "Prolonged inspiratory gasp with pause; brainstem (pons) damage."}, {"front": "Tachypnea / bradypnea / apnea", "back": "Fast rate / slow rate / absent breathing."}, {"front": "Hyperventilation vs hypoventilation", "back": "Rate/depth too much, blowing off CO2 / too little, retaining CO2. Hypoventilation needs ventilation assistance."}, {"front": "Fruity breath odor suggests", "back": "Ketones: diabetic ketoacidosis (often with Kussmaul breathing)."}, {"front": "Paradoxical movement", "back": "Chest segment moves opposite to the rest of the chest; flail chest (2+ adjacent ribs broken in 2+ places)."}, {"front": "Hypoxia", "back": "Insufficient oxygen at the tissue level. Signs: restlessness, tachycardia, cyanosis, altered mental status."}, {"front": "Hypercapnia", "back": "Too much CO2 in the blood; drowsiness, headache, flushed skin, from hypoventilation."}, {"front": "Early vs late signs of hypoxia", "back": "Early: anxiety, restlessness, tachycardia, tachypnea. Late: cyanosis, confusion, decreased LOC, bradycardia (especially in children)."}, {"front": "Subcutaneous emphysema", "back": "Air under the skin that crackles like bubble wrap; suggests pneumothorax/airway or chest injury."}, {"front": "Jugular vein distention and tracheal deviation", "back": "Tension pneumothorax: JVD and tracheal deviation (a late, often absent sign) with hypotension and absent breath sounds on the affected side."}, {"front": "Pulsus paradoxus", "back": "Drop in systolic BP >10 mmHg during inhalation; seen in severe asthma, tamponade."}, {"front": "AVPU and airway risk", "back": "Alert, Verbal, Painful, Unresponsive; level of consciousness guides airway risk. Opening airways often needed at P or U."}, {"front": "Agonal gasps or brief seizure-like activity in a collapsed patient", "back": "May be the onset of cardiac arrest. Check pulse and breathing together for no more than 10 sec; if no pulse or unsure, start CPR."}]}, {"name": "NREMT · Airway Management & Devices", "domain": "Airway", "cards": [{"front": "Head-tilt chin-lift", "back": "Opens the airway when no spinal injury is suspected: tilt the head back and lift the chin to move the tongue off the posterior pharynx."}, {"front": "Jaw-thrust (without head tilt)", "back": "Airway maneuver for suspected spinal injury; push mandible forward from the angles of the jaw."}, {"front": "Modified jaw thrust when it fails", "back": "If the jaw thrust fails to open the airway in trauma, use head-tilt chin-lift; airway takes priority over spine."}, {"front": "OPA (oropharyngeal airway) indications", "back": "Unresponsive patient with no gag reflex. Keeps the tongue from obstructing the airway; still requires proper head position."}, {"front": "OPA contraindication", "back": "Responsive patient or any patient with a gag reflex; may cause vomiting or laryngospasm."}, {"front": "OPA sizing", "back": "Measure from the corner of the mouth to the earlobe or angle of the jaw (some texts: center of mouth to angle of jaw)."}, {"front": "OPA insertion (adult)", "back": "Insert upside down and rotate 180 degrees at the soft palate, or use a tongue depressor and insert right-side up. Children: tongue depressor, no 180 rotation."}, {"front": "NPA (nasopharyngeal airway) indications", "back": "Semiconscious or unresponsive patients who have a gag reflex or clenched jaw and cannot keep their own airway (e.g., seizure, AMS)."}, {"front": "NPA contraindications", "back": "Suspected basilar skull fracture or severe facial/nasal trauma, or nasal obstruction. Stop if resistance is met. Per local protocol."}, {"front": "NPA sizing", "back": "Measure from the tip of the nose to the earlobe; diameter about the size of the patient's little finger or nostril."}, {"front": "NPA insertion technique", "back": "Lubricate (water-soluble), bevel toward the septum, advance along the floor of the nose, usually right nostril; if resistance, try the other side."}, {"front": "Recovery position (lateral)", "back": "For unresponsive patients breathing adequately with a pulse and no suspected spinal injury; lets fluids drain to limit aspiration."}, {"front": "Suction unit vacuum requirement (adult)", "back": "Unit should generate at least 300 mmHg of vacuum with the tubing clamped. Limit each adult suction attempt to about 15 sec (10 sec per some protocols)."}, {"front": "Suction time limits", "back": "Adult up to 15 sec, child up to 10 sec, infant up to 5 sec per attempt (some protocols: 10 sec for all). Oxygenate/ventilate before and after."}, {"front": "Suction pressure - child/infant", "back": "Use lower vacuum than adults: commonly about 80-120 mmHg for children and under 100 mmHg for infants. Exact figures per local protocol."}, {"front": "Rigid (Yankauer/tonsil tip) suction", "back": "Used for mouth and pharynx to remove large particles, blood, vomit; insert only as far as can be seen."}, {"front": "Soft (French/catheter) suction", "back": "Flexible catheter for the nose, a stoma/tracheostomy tube, or liquid secretions when a rigid tip won't fit; measure nose tip to earlobe."}, {"front": "Vomiting patient with suspected spinal injury", "back": "Log roll the patient as a unit onto the side while maintaining spinal alignment, then suction the airway."}, {"front": "Foreign body airway obstruction (FBAO) - mild", "back": "Good air exchange, able to cough forcefully and speak. Encourage coughing, do not interfere, and monitor for worsening."}, {"front": "FBAO - severe adult/child", "back": "Cannot speak, cough or breathe. 2025 AHA: cycles of 5 back blows then 5 abdominal thrusts until cleared. If unresponsive, start CPR."}, {"front": "FBAO - infant", "back": "2025 AHA: cycles of 5 back blows then 5 chest thrusts (heel of one hand), head lower than body. No abdominal thrusts. If unresponsive, start CPR."}, {"front": "Pregnant or obese choking patient", "back": "Use chest thrusts instead of abdominal thrusts (late pregnancy, or when you cannot encircle the abdomen)."}, {"front": "Sniffing position", "back": "Slight neck flexion with head extension to align the airway in adults and older children. Infants: neutral position (pad under shoulders)."}, {"front": "Stoma (laryngectomy) ventilation", "back": "Ventilate through the stoma using an infant/child mask sealed around it; no head tilt needed. If air leaks from mouth/nose, seal them. Suction as needed."}, {"front": "Tracheostomy patient with distress", "back": "Suction the tube first. If still obstructed, follow protocol (e.g., remove/clean inner cannula); ventilate via the tube or stoma with a BVM."}, {"front": "Supraglottic airway (i-gel/King) role", "back": "Not in the national EMT scope of practice (AEMT and above). Some states/agencies allow EMTs to insert them with extra training per local protocol."}, {"front": "Cervical collar and airway", "back": "A collar must not impair breathing or airway access; keep manual stabilization and use jaw thrust if the airway needs opening."}, {"front": "Foreign body removal in unresponsive patient", "back": "Start CPR. Each time you open the airway to ventilate, look in the mouth and remove an object only if visible. No blind finger sweeps."}]}, {"name": "NREMT · Oxygen, BVM, CPAP & Respiratory Conditions", "domain": "Airway", "cards": [{"front": "Nonrebreather mask flow rate and FiO2", "back": "10-15 L/min, enough to keep the reservoir inflated; delivers up to about 90% oxygen (less in practice with a poor mask seal)."}, {"front": "Nasal cannula flow rate and FiO2", "back": "1-6 L/min; delivers about 24-44% oxygen (approx. 4% per liter)."}, {"front": "Simple face mask", "back": "6-10 L/min; approximately 35-60% oxygen. Never run below 6 L/min (CO2 rebreathing)."}, {"front": "Venturi mask", "back": "Delivers a fixed, precise FiO2 (about 24-50%) set by a color-coded adapter; useful when controlled oxygen is needed (e.g., COPD)."}, {"front": "Partial rebreather mask", "back": "6-10 L/min with reservoir, no one-way valves; about 35-60% oxygen. Rarely used in the field."}, {"front": "Blow-by oxygen", "back": "For infants/children who won't tolerate a mask: hold tubing, mask or cup near the face at 6 L/min or more (flow per local protocol)."}, {"front": "Oxygen cylinder duration formula", "back": "Minutes = (gauge psi - safe residual) x cylinder constant / flow in L/min. Constants: D 0.16, E 0.28, M 1.56, G 2.41, H/K 3.14."}, {"front": "Safe residual pressure", "back": "200 psi is the textbook value used in duration calculations; many services change tanks at 500 psi. Follow local policy."}, {"front": "Full pressure of an oxygen cylinder", "back": "About 2,000 psi (2,000-2,200 psi) when full."}, {"front": "Oxygen safety rules", "back": "Keep away from heat, flame, oil and grease; secure cylinders; open the valve slowly. Oxygen is a drug and supports combustion (it does not burn itself)."}, {"front": "Oxygen administration indications", "back": "Hypoxia (SpO2 <94%), respiratory distress, shock, CO poisoning, cardiac arrest. Chest pain/stroke: only if hypoxic or dyspneic. Titrate per protocol."}, {"front": "Oxygen contraindications", "back": "No absolute contraindication in a hypoxic patient. Avoid routine high-flow O2 when SpO2 is normal (e.g., uncomplicated MI or stroke)."}, {"front": "BVM ventilation rate - adult", "back": "Adult with a pulse but inadequate breathing: 1 breath every 6 seconds (10/min), each over about 1 sec, just enough for chest rise."}, {"front": "BVM ventilation rate - child and infant", "back": "With a pulse: 1 breath every 2-3 seconds (20-30/min) per AHA (2020 and 2025). Older texts/some protocols list 12-20/min."}, {"front": "BVM volume goal", "back": "Just enough to produce visible chest rise (about 500-600 mL in adults). Avoid excessive rate/volume: gastric distention, reduced cardiac output."}, {"front": "BVM two-person technique", "back": "One rescuer holds the mask seal with two hands and opens the airway; the other squeezes the bag. Preferred over one-person BVM."}, {"front": "E-C clamp", "back": "Thumb and index finger form a C on the mask; remaining 3 fingers form an E along the jaw."}, {"front": "BVM O2 delivery", "back": "With a reservoir and 15 L/min oxygen: about 90-100%. With oxygen but no reservoir: about 40-60%. Room air only: 21%."}, {"front": "Gastric distention", "back": "Air in the stomach from too much volume, force or rate; causes vomiting and limits lung expansion. Reposition airway; give slow, gentle breaths."}, {"front": "CPAP indications", "back": "Awake patient able to follow commands with moderate-severe respiratory distress (pulmonary edema/CHF, COPD, asthma per protocol) and adequate BP."}, {"front": "CPAP contraindications", "back": "Apnea/agonal breathing, unresponsive or unable to protect airway, vomiting/GI bleed, hypotension (SBP <90), pneumothorax or chest trauma, facial trauma."}, {"front": "CPAP mechanism", "back": "Continuous positive airway pressure keeps alveoli open, pushes fluid out of lungs, increases oxygenation and reduces work of breathing."}, {"front": "Asthma: definition and EMT treatment", "back": "Reversible bronchospasm, swelling and mucus with wheezing. Oxygen if hypoxic, position of comfort, assist prescribed inhaler/albuterol per protocol."}, {"front": "COPD (chronic bronchitis/emphysema)", "back": "Chronic airflow limitation; wheezes/rhonchi, barrel chest, pursed lips. Titrate O2 (commonly SpO2 88-92% per protocol); never withhold if hypoxic."}, {"front": "Pursed-lip breathing", "back": "Exhaling slowly through pursed lips creates back-pressure that keeps small airways open (self-made PEEP); common in COPD/emphysema."}, {"front": "Albuterol (MDI/nebulizer) assist", "back": "Beta-2 agonist bronchodilator. EMTs assist with the patient's prescribed inhaler or give it per protocol. Side effects: tachycardia, tremor, nervousness."}, {"front": "MDI use steps", "back": "Check right drug/expiration, shake, exhale, seal lips (use spacer if available), press while inhaling slowly and deeply, hold breath about 10 sec."}, {"front": "Pneumonia", "back": "Lung infection: fever, productive cough, crackles/rhonchi, pleuritic pain. O2 if hypoxic, position of comfort, monitor, transport."}, {"front": "Pulmonary embolism (PE)", "back": "Clot blocks a pulmonary artery: sudden dyspnea, pleuritic chest pain, tachycardia. Risks: immobility, surgery, estrogen. O2, rapid transport."}, {"front": "Spontaneous pneumothorax", "back": "Air in the pleural space without trauma (classically tall, thin young males, smokers, COPD); sudden sharp pain, dyspnea, decreased sounds one side."}, {"front": "Tension pneumothorax", "back": "Trapped pleural air collapses the lung and shifts the mediastinum: severe distress, absent sounds, hypotension, JVD. Needs ALS decompression; rapid transport."}, {"front": "Open chest wound (sucking)", "back": "Seal with a vented chest seal or occlusive dressing (3-sided taping per local protocol). If tension signs develop, lift/burp the dressing."}, {"front": "Pulmonary edema", "back": "Fluid in alveoli (usually left heart failure): crackles, pink frothy sputum, orthopnea. Sit upright, O2, CPAP if indicated per protocol."}, {"front": "Croup and epiglottitis", "back": "Croup: viral, barking cough, stridor, age ~6 mo-3 yr. Epiglottitis: high fever, drooling, tripod; keep calm, nothing in the mouth, no throat exam."}, {"front": "Anaphylaxis airway signs", "back": "Stridor, wheezing, hoarseness, swelling of lips/tongue/throat. Give epinephrine (auto-injector/IM) per protocol first; O2 and airway support."}, {"front": "Hyperventilation syndrome", "back": "Rapid breathing with tingling, carpopedal spasm, dizziness. Calm and coach; no paper bag. Assume a serious cause (PE, DKA, MI) until ruled out."}]}, {"name": "NREMT · Pediatric Airway Differences", "domain": "Airway", "cards": [{"front": "Pediatric tongue size", "back": "Relatively larger tongue in a smaller mouth; more likely to block the airway."}, {"front": "Pediatric airway diameter", "back": "Narrower and more easily blocked by swelling, mucus, or blood; small edema causes large resistance."}, {"front": "Pediatric trachea", "back": "Softer, shorter and more flexible; hyperextension or flexion can kink it. Keep infants neutral and children in a slight sniffing position."}, {"front": "Cricoid in children", "back": "Classically taught as the narrowest part of the airway in children under about 8-10 years (in adults it is the glottis/vocal cords)."}, {"front": "Infant obligate nose breathers", "back": "Young infants (first months of life) breathe mainly through the nose; nasal secretions can cause distress. Clear nostrils with a bulb syringe."}, {"front": "Occiput size effect", "back": "Large occiput flexes the neck when supine; place a folded towel under the shoulders of an infant/young child to keep the airway neutral."}, {"front": "Pediatric chest wall", "back": "Soft and pliable; children rely on the diaphragm (belly breathing). Retractions and seesaw breathing signal increased work of breathing."}, {"front": "Pediatric oxygen reserve", "back": "Higher metabolic rate and smaller reserves, so they desaturate quickly. Respiratory failure/hypoxia is the most common cause of pediatric arrest."}, {"front": "Pediatric hypoxia sign: bradycardia", "back": "Bradycardia in a hypoxic child signals impending arrest. Ventilate with O2; if HR stays <60 with poor perfusion, start compressions."}, {"front": "Pediatric OPA sizing and insertion", "back": "Size corner of mouth to earlobe/angle of jaw. Insert right side up using a tongue depressor; do not rotate 180 degrees (palate injury)."}, {"front": "Pediatric NPA caution", "back": "Size carefully (nose tip to earlobe, smaller than the nostril). Small passages bleed and block easily; rarely used in infants. Per local protocol."}, {"front": "Pediatric normal heart rate - infant", "back": "About 100-160 bpm (newborns may reach 180). Ranges vary slightly by textbook."}, {"front": "Pediatric normal heart rate - child", "back": "Approx: toddler 90-150, preschool 80-140, school age 70-120, adolescent 60-100 bpm. Ranges vary by source."}, {"front": "Pediatric hypotension: lowest acceptable systolic BP", "back": "Ages 1-10: below 70 + (2 x age in years) mmHg is hypotension. Over 10 years: <90. Infants 1-12 mo: <70; newborns: <60."}, {"front": "Pediatric Assessment Triangle", "back": "Appearance, Work of breathing, Circulation to skin. Quick general impression."}, {"front": "Pediatric respiratory arrest vs cardiac arrest", "back": "Most pediatric arrests are respiratory in origin; prioritize airway and ventilation."}, {"front": "Pediatric foreign body obstruction", "back": "Severe, responsive: child gets 5 back blows then 5 abdominal thrusts (2025 AHA); infant gets 5 back blows then 5 chest thrusts. Unresponsive: CPR."}, {"front": "Pediatric suction durations", "back": "Child up to 10 sec, infant up to 5 sec per attempt, with lower vacuum; avoid deep or prolonged suction (vagal bradycardia, hypoxia)."}, {"front": "Pediatric BVM masks", "back": "Mask should cover from the bridge of the nose to the chin cleft without pressing on the eyes; don't compress soft tissue under the chin."}, {"front": "CPR age definitions (infant, child, adult)", "back": "Infant: under 1 year. Child: 1 year to puberty. Adult: puberty and older (breast development in females; chest/underarm hair in males)."}, {"front": "Gastric distention in children", "back": "Common with excessive force, volume or rate; it pushes up the diaphragm. Give gentle breaths over 1 sec, just enough for chest rise."}, {"front": "Febrile child with drooling and tripod", "back": "Suspect epiglottitis: keep calm, position of comfort, nothing in the mouth, no throat exam, blow-by O2 if tolerated, rapid quiet transport."}, {"front": "Bronchiolitis (RSV)", "back": "Viral infection of small airways in infants/toddlers: wheezing, nasal flaring, retractions. Suction the nose, give oxygen as needed."}, {"front": "Pediatric asthma emphasis", "back": "Wheezing, retractions, and tiring child; silent chest is critical. Assist with prescribed inhaler per protocol."}, {"front": "Altered mental status in a child: what to check", "back": "Hypoxia first (airway/breathing), then blood glucose; hypoglycemia is common in sick children and causes lethargy or seizures."}, {"front": "Infant airway position", "back": "Neutral position; flexion or hyperextension can kink the soft airway. A thin pad under the shoulders offsets the large occiput."}, {"front": "SIDS vs BRUE", "back": "SIDS: sudden unexplained death of an infant <1 yr. BRUE: brief (<1 min), now-resolved episode of color, breathing, tone or responsiveness change; transport."}]}, {"name": "NREMT · CPR, AED & Resuscitation", "domain": "Cardiology", "cards": [{"front": "Chain of survival (2025 AHA)", "back": "One unified 6-link chain for all ages/settings: recognition and emergency activation, high-quality CPR, defibrillation, advanced resuscitation, post-arrest care, recovery and survivorship."}, {"front": "Adult compression rate", "back": "100-120 per minute."}, {"front": "Adult compression depth", "back": "At least 2 inches (5 cm), no more than 2.4 inches (6 cm)."}, {"front": "Child compression depth (1 yr to puberty)", "back": "At least 1/3 the AP chest depth, about 2 inches (5 cm). One or two hands."}, {"front": "Infant compression depth", "back": "At least 1/3 the AP chest depth, about 1.5 inches (4 cm)."}, {"front": "Compression-to-ventilation ratio: adult", "back": "30:2 for 1 or 2 rescuers (no advanced airway)."}, {"front": "Child and infant ratio, 1 rescuer", "back": "30:2."}, {"front": "Child and infant ratio, 2 rescuers", "back": "15:2."}, {"front": "Infant compression technique, 1 rescuer", "back": "2025 AHA: two thumbs (encircling hands) or heel of one hand on the lower half of the sternum. The 2-finger technique is no longer recommended."}, {"front": "Infant compression technique, 2 rescuers", "back": "Two thumb-encircling hands technique on the lower half of the sternum (preferred); heel of one hand if hands cannot encircle the chest."}, {"front": "Adult compression hand position", "back": "Heel of one hand on the lower half of the sternum (center of chest), other hand on top, arms straight, shoulders over hands."}, {"front": "Full chest recoil", "back": "Allow complete recoil between compressions; do not lean. Leaning reduces venous return."}, {"front": "Compression fraction goal", "back": "Minimize interruptions; keep pauses under 10 seconds; chest compression fraction at least 60% (ideally higher)."}, {"front": "Rescuer switch interval", "back": "Switch compressors about every 2 minutes (5 cycles of 30:2) or sooner if fatigued; make the switch in under 5 sec."}, {"front": "Pulse check time", "back": "At least 5 but no more than 10 seconds. Carotid in adults; carotid or femoral in children; brachial in infants."}, {"front": "Rescue breathing rate - adult with pulse", "back": "1 breath every 6 seconds (about 10/min), each over 1 sec."}, {"front": "Rescue breathing - child/infant with pulse", "back": "1 breath every 2-3 seconds (20-30/min). If heart rate is <60 with poor perfusion despite oxygen and ventilation, start CPR."}, {"front": "Ventilation with advanced airway during CPR", "back": "Continuous compressions without pausing for breaths. Adult: 1 breath every 6 sec (10/min). Infant/child: 1 every 2-3 sec (20-30/min)."}, {"front": "Where to place patient for CPR", "back": "Supine on a firm, flat surface; expose the chest."}, {"front": "Hands-only CPR", "back": "For untrained lay rescuers of adults: call 911, push hard and fast in the center of the chest at 100-120/min. Children need breaths too."}, {"front": "Cardiac arrest recognition", "back": "Unresponsive, no normal breathing (absent or only gasping), and no definite pulse felt within 10 seconds."}, {"front": "AED steps (4)", "back": "1) Power on 2) Attach pads 3) Analyze (everyone clear, no touching) 4) Shock if advised, then resume CPR immediately."}, {"front": "AED pad placement - adult", "back": "Anterolateral: right upper chest below the clavicle and left side below the armpit (lateral to the nipple). Alternative: anterior-posterior."}, {"front": "AED pad placement - child/infant", "back": "Under 8 yr (about <25 kg): pediatric pads/attenuator if available; if not, use adult pads. Pads must not touch; use front-back if needed."}, {"front": "Shockable rhythms", "back": "Ventricular fibrillation (VF) and pulseless ventricular tachycardia (pVT)."}, {"front": "Non-shockable rhythms", "back": "Asystole and PEA (pulseless electrical activity). AED says no shock advised: resume CPR immediately; ALS for further care."}, {"front": "AED safety", "back": "Everyone clear before analysis and shock; move free-flowing oxygen away from the chest; dry the chest; remove medication patches and wipe."}, {"front": "AED: implanted pacemaker/ICD", "back": "Do not place a pad directly over the device (place it to the side, about 1 inch away); do not delay the shock."}, {"front": "AED: wet patient", "back": "Remove from standing water and quickly wipe the chest dry; do not delay the shock. AED use is OK on snow or a wet surface."}, {"front": "After AED shock", "back": "Resume CPR immediately, starting with compressions, for about 2 minutes (5 cycles) before the AED re-analyzes. No pulse check right after the shock."}, {"front": "When to stop CPR", "back": "ROSC, care transferred to ALS/equal or higher level, rescuer exhaustion, unsafe scene, valid DNR/POLST presented, or termination order from medical direction."}, {"front": "Obvious death criteria", "back": "Injuries incompatible with life (decapitation, transection, incineration), rigor mortis, dependent lividity, decomposition. Withhold CPR per local protocol."}, {"front": "ROSC", "back": "Return of spontaneous circulation: a palpable pulse returns (breathing may not). Support ventilation, recheck often, transport."}, {"front": "Post-ROSC care for EMT", "back": "Support airway/ventilation at normal rate (no hyperventilation); titrate O2 once SpO2 is reliable (2025 AHA 90-98%, per protocol); vitals, transport."}, {"front": "Special: opioid overdose cardiac arrest", "back": "No pulse: standard CPR with ventilations and AED take priority; give naloxone per protocol without delaying CPR. Pulse but not breathing: ventilate + naloxone."}, {"front": "Drowning cardiac arrest priority", "back": "Hypoxic arrest: ventilation matters. AHA: open the airway, give 2 rescue breaths, then CPR 30:2 with oxygen; attach AED when available."}, {"front": "Hypothermic arrest", "back": "Pulse may be slow and weak: check longer than usual (30-60 sec per local protocol). No pulse: CPR and AED, prevent heat loss, transport; shock limits per protocol."}, {"front": "Cardiac arrest in pregnancy", "back": "High-quality CPR with continuous manual left uterine displacement if the uterus is at/above the umbilicus; early ALS and rapid transport."}]}, {"name": "NREMT · Cardiac Conditions & Medications", "domain": "Cardiology", "cards": [{"front": "Heart chambers and flow", "back": "Right atrium > tricuspid > right ventricle > pulmonic valve > lungs > left atrium > mitral > left ventricle > aortic valve > body."}, {"front": "Coronary arteries", "back": "Supply the heart muscle; fill during diastole. Blockage causes ischemia/infarct."}, {"front": "Normal adult heart rate", "back": "60-100 bpm."}, {"front": "Tachycardia and bradycardia (adult)", "back": "Tachycardia >100 bpm; bradycardia <60 bpm."}, {"front": "Normal adult BP", "back": "Normal is below 120/80 mmHg; hypotension in adults is generally systolic <90 mmHg."}, {"front": "Stroke volume, cardiac output", "back": "Stroke volume: blood per beat. CO = HR x SV. BP = CO x peripheral resistance."}, {"front": "Preload / afterload", "back": "Preload: volume returning to the heart (filling). Afterload: resistance the ventricle pumps against."}, {"front": "Angina pectoris", "back": "Chest pain from temporary myocardial ischemia, usually on exertion; typically lasts under 15 min and is relieved by rest or nitroglycerin."}, {"front": "Stable vs unstable angina", "back": "Stable: predictable on exertion, relieved by rest. Unstable: at rest, increasing, lasts longer; treat as possible MI."}, {"front": "Acute myocardial infarction (AMI)", "back": "Death of heart muscle from a blocked coronary artery. Pain often lasts >15-30 min and is not relieved by rest or nitroglycerin."}, {"front": "ACS (acute coronary syndrome)", "back": "Umbrella term: unstable angina, NSTEMI, STEMI."}, {"front": "Classic AMI signs", "back": "Crushing pressure/tightness, radiating to arm/jaw/back, diaphoresis, nausea, dyspnea, anxiety, pale/ashen."}, {"front": "Atypical MI presentation", "back": "Women, elderly, diabetics: fatigue, indigestion, shortness of breath, nausea, weakness with little pain."}, {"front": "OPQRST", "back": "Onset, Provocation, Quality, Radiation, Severity, Time - pain assessment."}, {"front": "SAMPLE history", "back": "Signs/symptoms, Allergies, Medications, Past history, Last oral intake, Events leading up."}, {"front": "EMT care for chest pain", "back": "Primary assessment, O2 only if hypoxic/dyspneic, position of comfort, vitals, aspirin, assist nitro per protocol, 12-lead acquisition if allowed, early transport."}, {"front": "Aspirin indication (ACS)", "back": "Suspected ACS/cardiac chest pain. Antiplatelet: keeps platelets from clumping so the clot does not grow."}, {"front": "Aspirin dose", "back": "162-324 mg non-enteric-coated, chewed (2-4 x 81 mg chewable tablets), per local protocol."}, {"front": "Aspirin contraindications", "back": "Aspirin/NSAID allergy, active GI bleeding or ulcer, bleeding disorder, aspirin-sensitive asthma; full dose already taken. Per local protocol."}, {"front": "Nitroglycerin indication", "back": "Cardiac-type chest pain in a patient with their own prescribed nitro (and protocol/medical direction). Vasodilator: lowers preload and heart workload."}, {"front": "Nitroglycerin dose", "back": "0.4 mg sublingual tablet or spray; may repeat every 3-5 min if pain persists and BP allows, max 3 doses total (including doses already taken)."}, {"front": "Nitroglycerin contraindications", "back": "SBP <100 (<90 in some protocols); PDE5 inhibitor use (sildenafil/vardenafil within 24 h, tadalafil within 48 h); head injury; 3 doses already taken."}, {"front": "Nitroglycerin side effects", "back": "Headache, hypotension, dizziness, flushing, burning under the tongue. Recheck BP within 5 min after each dose."}, {"front": "Nitroglycerin storage and use", "back": "Tablets lose potency with light, heat, air and age (keep in original dark glass bottle); check expiration. Give with patient seated or lying."}, {"front": "Checks before assisting with nitroglycerin", "back": "Right patient (their own prescription), right drug/dose/route, not expired, SBP above protocol minimum, no PDE5 use, medical direction as required."}, {"front": "Congestive heart failure (CHF)", "back": "Heart cannot pump effectively. Left-sided: pulmonary edema (crackles, dyspnea, orthopnea). Right-sided: JVD, peripheral edema, ascites."}, {"front": "Orthopnea / PND", "back": "Difficulty breathing lying flat; paroxysmal nocturnal dyspnea wakes patient at night; signs of CHF."}, {"front": "Pedal edema and JVD", "back": "Signs of right-sided heart failure: swollen feet/ankles (dependent edema) and distended neck veins."}, {"front": "Cardiogenic shock", "back": "Pump failure (often after MI): hypotension, cool clammy skin, weak rapid pulse, possible pulmonary edema. O2, position of comfort, rapid transport/ALS."}, {"front": "Cardiac tamponade (Beck's triad)", "back": "Beck's triad: hypotension (narrowing pulse pressure), JVD, muffled heart sounds, from blood/fluid in the pericardial sac."}, {"front": "Hypertensive emergency", "back": "Severely high BP (often >180/120) with organ signs: headache, vision change, chest pain, AMS. Supportive care; do not try to lower BP; transport."}, {"front": "Aortic aneurysm", "back": "Weakened aortic wall bulges. Rupture: sudden severe abdominal/back pain, pulsating mass, shock. Do not palpate repeatedly; rapid transport."}, {"front": "Aortic dissection", "back": "Sudden tearing/ripping chest or back pain, unequal pulses or BP between arms; time critical, rapid transport."}, {"front": "Arrhythmias an EMT should know", "back": "Tachycardia, bradycardia, VF and pulseless VT (shockable), asystole/PEA (not shockable). EMTs do not interpret ECGs; use AED, call ALS."}, {"front": "STEMI", "back": "ST-elevation MI: usually complete blockage of a coronary artery. Time critical: early hospital notification, transport to PCI-capable center per protocol."}, {"front": "Troponin (hospital test, not EMT skill)", "back": "Protein released by injured heart muscle; rises hours after an MI. Measured by hospital lab to confirm MI."}, {"front": "Syncope", "back": "Brief loss of consciousness from reduced brain perfusion with spontaneous recovery. Cardiac causes are serious; assess vitals, glucose; consider ALS."}, {"front": "Atherosclerosis", "back": "Plaque build-up in arteries narrowing the lumen; leading cause of MI/stroke."}, {"front": "Risk factors for heart disease", "back": "Non-modifiable: age, male sex, family history. Modifiable: smoking, hypertension, diabetes, high cholesterol, obesity, inactivity."}]}, {"name": "NREMT · Trauma Assessment, Bleeding & Shock", "domain": "Trauma", "cards": [{"front": "MOI", "back": "Mechanism of injury: the forces and way an injury occurred (e.g., rollover, fall height, penetrating object). Guides index of suspicion and trauma center decisions."}, {"front": "Kinematics", "back": "Study of how motion and energy transfer cause injury. Kinetic energy = 1/2 x mass x velocity squared, so speed matters more than mass."}, {"front": "Golden Period / Golden Hour", "back": "Goal of definitive surgical care within about 60 minutes of injury. Platinum 10 minutes: limit scene time for critical trauma to 10 min or less."}, {"front": "Newton's first law in trauma", "back": "Body in motion stays in motion until acted on by an outside force (e.g., a stopped car, then the occupant hits the dash)."}, {"front": "Three collisions in a vehicle crash", "back": "1) Vehicle hits object. 2) Occupant hits the vehicle interior. 3) Internal organs hit the body wall/skeleton."}, {"front": "Index of suspicion", "back": "Your anticipation of possible injuries based on MOI, even without obvious signs."}, {"front": "Penetrating trauma: low vs high energy", "back": "Knife = low energy (damage along path). Handgun = medium. Rifle = high energy with cavitation and wide tissue damage."}, {"front": "Trauma primary assessment order", "back": "Scene size-up, spinal motion restriction as needed, general impression, then control life-threatening hemorrhage first, then airway, breathing, circulation, disability, expose."}, {"front": "Rapid trauma assessment (head-to-toe) looks for", "back": "DCAP-BTLS: Deformities, Contusions, Abrasions, Punctures/Penetrations, Burns, Tenderness, Lacerations, Swelling."}, {"front": "Which trauma patients get a rapid trauma assessment?", "back": "Significant MOI or unresponsive/altered patients get a full-body rapid exam. Isolated injury with minor MOI gets a focused exam."}, {"front": "Adult blood volume", "back": "About 5 to 6 liters (approx. 70 mL/kg). Child about 80 mL/kg; infants lose volume quickly, so small losses matter."}, {"front": "Order of bleeding control", "back": "Direct pressure, then pressure dressing, then tourniquet (or hemostatic gauze packing) for life-threatening limb bleeding not controlled. Per local protocol."}, {"front": "Tourniquet placement rules", "back": "Place 2-3 inches above the wound (proximal), not over a joint. Tighten until bleeding stops and distal pulse is gone. Write time applied. Do not loosen."}, {"front": "Hemostatic gauze use", "back": "Pack firmly into wound (junctional areas such as groin/axilla/neck) and hold direct pressure at least 3 minutes (follow product directions)."}, {"front": "Epistaxis care", "back": "Sit patient leaning forward, pinch the soft part of the nose 10 minutes. Suspect head injury if after trauma; avoid pinching with skull fracture/CSF."}, {"front": "Hypoperfusion / shock", "back": "Inadequate delivery of oxygen and nutrients to tissues because of poor perfusion. Cells shift to anaerobic metabolism."}, {"front": "Three components of perfusion", "back": "Pump (heart), fluid (blood volume), and container (blood vessels)."}, {"front": "Hypovolemic shock", "back": "Loss of blood or fluid volume (hemorrhage, burns, dehydration, vomiting/diarrhea). Most common shock in trauma."}, {"front": "Distributive shock types", "back": "Neurogenic, septic, anaphylactic: dilated vessels make the container too big."}, {"front": "Obstructive shock causes", "back": "Tension pneumothorax, cardiac tamponade, pulmonary embolism: blood flow physically blocked."}, {"front": "Neurogenic shock signs", "back": "Spinal cord injury with loss of sympathetic tone: low BP, bradycardia, warm dry skin (below injury), and priapism possible."}, {"front": "Compensated shock signs", "back": "Anxiety/restlessness, tachycardia, pale cool clammy skin, delayed cap refill, normal BP, tachypnea."}, {"front": "Decompensated shock signs", "back": "Falling blood pressure, altered mental status, weak/absent peripheral pulses, labored breathing, cyanosis, ashen skin."}, {"front": "Irreversible shock", "back": "Organ damage is permanent and death follows even if BP is restored."}, {"front": "Early sign of shock in children", "back": "Tachycardia, delayed capillary refill, and altered mental status. Hypotension is a LATE sign (they compensate well, then crash)."}, {"front": "Shock care basics", "back": "Control bleeding, high-flow oxygen if hypoxic (maintain SpO2 94% or above), keep warm, supine, rapid transport. Avoid food/drink."}, {"front": "Hemorrhage classification by vessel", "back": "Arterial: bright red, spurting. Venous: dark red, steady flow. Capillary: slow oozing."}, {"front": "Serious blood loss amounts", "back": "Adult about 1 liter, child about 500 mL, infant about 100-200 mL."}]}, {"name": "NREMT · Head, Spine, Chest & Abdomen", "domain": "Trauma", "cards": [{"front": "Cushing's triad", "back": "Signs of rising intracranial pressure: HYPERtension (widening pulse pressure), BRADYcardia, irregular respirations."}, {"front": "Battle's sign", "back": "Bruising behind the ear over the mastoid; indicates basilar skull fracture (late sign)."}, {"front": "Raccoon eyes", "back": "Periorbital ecchymosis; indicates basilar skull fracture (can appear hours later)."}, {"front": "CSF leak sign", "back": "Clear or pink fluid from ears or nose after head trauma; suggests skull fracture. Do not stop the flow; cover loosely."}, {"front": "GCS: eye opening scores", "back": "4 spontaneous, 3 to voice, 2 to pain, 1 none."}, {"front": "GCS: verbal scores", "back": "5 oriented, 4 confused, 3 inappropriate words, 2 incomprehensible sounds, 1 none."}, {"front": "GCS: motor scores", "back": "6 obeys commands, 5 localizes pain, 4 withdraws from pain, 3 flexion (decorticate), 2 extension (decerebrate), 1 none."}, {"front": "GCS range and severity", "back": "Range 3-15. Severe 8 or less, moderate 9-12, mild 13-15. 15 is normal. GCS 8 or less: airway at risk; BLS airway/BVM and request ALS (advanced airway is not EMT scope)."}, {"front"
