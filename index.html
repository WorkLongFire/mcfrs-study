: "Decorticate vs decerebrate posturing", "back": "Decorticate: arms flexed toward core. Decerebrate: arms and legs extended (worse prognosis)."}, {"front": "Signs of increased ICP", "back": "Declining mental status, vomiting, headache, unequal or sluggish pupils, posturing, Cushing's triad."}, {"front": "Head injury care", "back": "Maintain airway, oxygen to avoid hypoxia, avoid hyperventilation unless herniation signs (per local protocol), SMR, rapid transport."}, {"front": "Concussion", "back": "Temporary altered brain function after a blow; may include confusion, amnesia, headache. No structural damage on CT."}, {"front": "When to use spinal motion restriction", "back": "MOI with altered mental status, neuro deficit, spine pain/tenderness, distracting injury or intoxication, per local protocol/selective criteria."}, {"front": "Cervical collar sizing/purpose", "back": "Collar limits neck movement; measure per manufacturer. Does not replace manual in-line stabilization until patient is secured."}, {"front": "Airway-opening maneuver for a patient with suspected spinal injury", "back": "Jaw-thrust maneuver without head tilt. If it does not open the airway, use head tilt-chin lift: a patent airway takes priority."}, {"front": "Flail chest", "back": "2 or more adjacent ribs fractured in 2 or more places, creating a free-floating segment."}, {"front": "Paradoxical motion", "back": "Flail segment moves in on inhalation and out on exhalation. Give oxygen; assist with BVM if breathing is inadequate. Bulky-dressing stabilization only per local protocol."}, {"front": "Open (sucking) chest wound care", "back": "Seal with occlusive dressing taped on 3 sides (or vented chest seal); watch for tension pneumothorax and burp dressing if worsening."}, {"front": "Simple pneumothorax signs", "back": "Pleuritic chest pain, dyspnea, diminished or absent breath sounds on the affected side."}, {"front": "Tension pneumothorax signs", "back": "Severe dyspnea, absent breath sounds, JVD, tracheal deviation (late), hypotension. Needle decompression is beyond EMT scope; rapid transport/ALS."}, {"front": "Hemothorax", "back": "Blood in the pleural space; dull percussion, shock signs, decreased breath sounds. Rapid transport."}, {"front": "Cardiac tamponade", "back": "Blood in the pericardial sac compressing the heart; usually from penetrating trauma."}, {"front": "Beck's triad", "back": "Hypotension, JVD, muffled (distant) heart tones. Signs of cardiac tamponade."}, {"front": "Traumatic asphyxia", "back": "Severe chest compression: head/neck cyanosis, JVD, bulging eyes, petechiae. Treat ABCs, rapid transport."}, {"front": "Pulmonary contusion", "back": "Bruised lung tissue; delayed respiratory distress, hemoptysis."}, {"front": "Evisceration care", "back": "Do not push organs back; cover with moist sterile saline dressing then occlusive covering. Keep warm, legs flexed if no contraindication."}, {"front": "Abdominal organs: solid vs hollow", "back": "Solid (liver, spleen, kidneys) bleed heavily. Hollow (stomach, intestines) leak contents causing peritonitis."}, {"front": "Signs of internal abdominal bleeding", "back": "Rigid or distended abdomen, guarding, tenderness, Kehr's sign (left shoulder pain from spleen), bruising (Cullen/Grey Turner late)."}, {"front": "Impaled object care", "back": "Do not remove (except in cheek obstructing airway or interfering with CPR); stabilize with bulky dressings."}, {"front": "Pelvic fracture care", "back": "Suspect with MOI and pelvic pain; do not rock pelvis or compress repeatedly. Bind with pelvic binder/sheet per protocol; treat for shock."}]}, {"name": "NREMT · Musculoskeletal, Burns & Triage", "domain": "Trauma", "cards": [{"front": "PMS check", "back": "Pulse, Motor function, Sensation: check distal to injury before AND after splinting."}, {"front": "Splinting rule: joints", "back": "Immobilize the joint above and below a long bone injury; the bone above and below a joint injury."}, {"front": "Why splint", "back": "Reduce pain, prevent further tissue/vessel/nerve damage, limit bleeding."}, {"front": "Realign a deformed limb when", "back": "Pulseless extremity or severely angulated; one gentle attempt, stop if resistance or pain increases (per local protocol). Do not realign joints."}, {"front": "Traction splint indication", "back": "Isolated mid-shaft femur fracture without pelvis, hip, knee, ankle injury (pain relief, bleeding control)."}, {"front": "Open vs closed fracture", "back": "Open: bone ends or wound through skin; control bleeding, sterile dressing. Closed: skin intact."}, {"front": "Dislocation vs sprain vs strain", "back": "Dislocation: bone out of joint. Sprain: ligament injury. Strain: muscle/tendon injury."}, {"front": "Compartment syndrome signs", "back": "Pain out of proportion, tense swelling, pain with passive stretch, paresthesia, late: pulselessness (the 6 P's)."}, {"front": "RICE for soft tissue injury", "back": "Rest, Ice, Compression, Elevation. Wrap the cold pack in cloth; apply up to about 20 minutes at a time."}, {"front": "Amputation care", "back": "Control bleeding (tourniquet if needed); wrap part in moist sterile gauze, place in plastic bag, keep cool on ice; do not freeze or soak in water."}, {"front": "Superficial (1st degree) burn", "back": "Epidermis only: red, dry, painful (sunburn). No blisters."}, {"front": "Partial-thickness (2nd degree) burn", "back": "Epidermis + dermis: blisters, moist, red, very painful. Do not break blisters."}, {"front": "Full-thickness (3rd degree) burn", "back": "All skin layers: white, brown or charred, leathery, painless (nerve damage)."}, {"front": "Rule of nines: adult", "back": "Head 9, each arm 9, chest 9 + abdomen 9 (front trunk 18), back 18, each leg 18, groin 1."}, {"front": "Rule of nines: infant/child", "back": "Infant: head 18, front trunk 18, back 18, each arm 9, each leg 13.5 (often rounded to 14), groin 1. Older child: head about 12, each leg about 16.5. Charts vary by text."}, {"front": "Rule of palms", "back": "Patient's palm with fingers is about 1% of body surface area. Use for scattered/small burns."}, {"front": "Critical (severe) burn criteria: adult", "back": "Full-thickness over 10% or partial over 30% BSA (typical text); burns of face/airway, hands, feet, genitalia; circumferential; inhalation, electrical; with trauma; under 5 or over 55."}, {"front": "Signs of inhalation injury", "back": "Singed nasal hair, soot in mouth/nose, hoarseness, stridor, burns of face, carbonaceous sputum. Consider early airway support."}, {"front": "Thermal burn care", "back": "Stop the burning, remove jewelry/clothing not stuck, cool briefly with room-temp water (not ice), cover dry sterile, prevent hypothermia."}, {"front": "Chemical burn care", "back": "Brush off dry powder first, then flush with copious water at least 20 min. Protect yourself (PPE). Remove contaminated clothing."}, {"front": "Electrical burn caution", "back": "Ensure power is off/scene safe; entrance and exit wounds; internal damage is worse than it looks; expect dysrhythmias/cardiac arrest, so have the AED ready. ECG monitoring is ALS."}, {"front": "Carbon monoxide poisoning", "back": "Headache, dizziness, nausea, confusion; SpO2 may read falsely normal. Treat with 100% oxygen."}, {"front": "ACS field triage 2021: Red criteria, mental status and vitals", "back": "Motor GCS under 6 (can't follow commands); RR under 10 or over 29; SpO2 under 90%; SBP under 90 or HR over SBP (age 10-64); SBP under 110 (65+); SBP under 70 + 2 x age (0-9)."}, {"front": "ACS field triage 2021: Red criteria, injury patterns", "back": "Penetrating head/neck/torso/proximal limb; skull deformity; spine injury with new deficit; flail chest; pelvic fx; 2+ proximal long-bone fx; mangled/pulseless limb; tourniquet-needed bleed."}, {"front": "ACS field triage 2021: Yellow criteria, mechanism of injury", "back": "Ejection; intrusion over 12 in at occupant site or 18 in anywhere; death in same compartment; unrestrained child 0-9; fall over 10 ft (all ages); pedestrian/cyclist/rider thrown or run over."}, {"front": "ACS field triage 2021: Yellow criteria, EMS judgment", "back": "Low-level fall with head impact (age 5 or under, or 65+); anticoagulant use; suspected child abuse; pregnancy over 20 weeks; burns with trauma; special needs. Follow local destination plan."}, {"front": "START triage colors", "back": "Red immediate, yellow delayed, green minor (walking wounded), black deceased/expectant."}, {"front": "START triage cutoffs (adult)", "back": "RR over 30 = red. Radial pulse absent or cap refill over 2 s = red. Cannot follow simple commands = red. Not breathing after opening the airway = black."}, {"front": "JumpSTART pediatric triage (ages about 1-8)", "back": "Apneic after airway opened: pulse present = 5 rescue breaths (still apneic = black, breathing = red); no pulse = black. RR under 15 or over 45, no pulse, or P/U on AVPU = red."}]}, {"name": "NREMT · Environmental Emergencies", "domain": "Trauma", "cards": [{"front": "Heat cramps", "back": "Painful muscle spasms after exertion in heat; skin moist. Treat: rest in cool, oral fluids/electrolytes if alert."}, {"front": "Heat exhaustion", "back": "Heavy sweating, pale cool clammy skin, weakness, dizziness, nausea, normal or slightly high temp. Cool, fluids if alert, may need IV by ALS."}, {"front": "Heat stroke", "back": "Core temp over 104 F (40 C), hot skin (may be dry or sweaty), altered mental status or seizures. Life threat: rapid cooling, transport."}, {"front": "Heat stroke vs exhaustion key difference", "back": "Altered mental status and very high temperature = heat stroke. Cool aggressively (ice packs groin/axilla/neck, cold water immersion if possible)."}, {"front": "Mild hypothermia", "back": "Core 90-95 F (32-35 C): shivering, cold skin, pale, goosebumps, some confusion."}, {"front": "Moderate hypothermia", "back": "Core 82-90 F (28-32 C): shivering stops, confusion, slow pulse and respirations, stumbling, slurred speech."}, {"front": "Severe hypothermia", "back": "Core under 82 F (28 C): unresponsive, rigid, very slow pulse; may appear dead. Check pulse longer than usual: 30-60 s in many texts (per local protocol). Not dead until warm and dead."}, {"front": "Hypothermia handling", "back": "Handle gently (VF risk), remove wet clothes, insulate, passive warming, active warming per protocol, avoid rubbing limbs, no alcohol."}, {"front": "Frostbite superficial vs deep", "back": "Superficial: white waxy skin, numbness, soft. Deep: hard, cold, blotchy white/gray/blue, blisters."}, {"front": "Frostbite care", "back": "Remove wet clothing and jewelry, loosely cover with dry dressings, do not rub or break blisters, do not rewarm if refreezing is possible."}, {"front": "Immersion foot (trench foot)", "back": "Cold, wet, nonfreezing exposure; swollen, pale, painful. Dry and rewarm gently."}, {"front": "Drowning: priority", "back": "Hypoxia is the problem: open airway and give rescue breaths first once safe, then CPR with ventilations if no pulse. Spinal precautions only if diving/trauma is suspected."}, {"front": "Cold-water immersion factor", "back": "Cold water may preserve survival; continue resuscitation per protocol."}, {"front": "Drowning aftermath", "back": "Transport even if the patient seems fine: lung problems (pulmonary edema, hypoxia) can develop hours later. 'Secondary' and 'dry' drowning are outdated terms."}, {"front": "Snake bite care (pit viper)", "back": "Keep calm and still, limb about heart level (per local protocol), remove rings, mark swelling edge and time, rapid transport. No tourniquet, ice, cutting or suction."}, {"front": "Pit viper signs", "back": "Fang marks, pain, swelling, ecchymosis, weakness, metallic taste, bleeding."}, {"front": "Coral snake", "back": "Neurotoxin: minimal local signs; delayed weakness, drooping eyelids, respiratory failure. Remember 'red on yellow kills a fellow'."}, {"front": "Bee sting care", "back": "Scrape out stinger (don't squeeze venom sac), wash, cold pack. Watch for anaphylaxis."}, {"front": "Black widow spider", "back": "Muscle cramps/rigidity (abdominal), severe pain, sweating. Antivenom at hospital."}, {"front": "Brown recluse spider", "back": "Painless bite then necrotic ulcer over hours/days; fever, chills."}, {"front": "Tick-borne illness", "back": "Remove with tweezers close to skin; Lyme disease: bull's-eye rash, fever. Rocky Mountain spotted fever: rash wrists/ankles."}, {"front": "Dive emergencies: AGE", "back": "Arterial gas embolism: rapid ascent with breath-holding; sudden stroke-like signs, chest pain within minutes. Recompression needed."}, {"front": "Decompression sickness (the bends)", "back": "Nitrogen bubbles after rapid ascent: joint pain, rash, fatigue, onset hours later. Transport to hyperbaric chamber."}, {"front": "Dive patient care", "back": "High-concentration oxygen, position supine (left-side/head-down is no longer routine; per local protocol), keep warm, transport toward hyperbaric care. If flown: low cabin altitude."}, {"front": "Altitude illness (AMS)", "back": "Headache, nausea, fatigue above 8,000 ft; severe forms HAPE (lungs) and HACE (brain). Descend, oxygen."}, {"front": "Lightning strike care", "back": "Make scene safe, triage reverse: treat those in apparent arrest first. Look for burns, cardiac arrest, spinal and eardrum injury."}, {"front": "Heat stroke: field cooling methods and when to stop", "back": "Remove clothing; cold-water immersion is fastest if available. Otherwise wet the skin and fan, with ice packs at neck, armpits, groin. Stop near 102 F (39 C), per local protocol."}, {"front": "Mechanisms of body heat loss", "back": "Conduction (direct contact), convection (moving air/water), radiation, evaporation (sweat/wet skin), and respiration."}, {"front": "Risk groups for temperature illness", "back": "Infants, elderly, chronic illness, alcohol/drug use, medications, prolonged exposure."}]}, {"name": "NREMT · Neuro, Endocrine, Allergy & Toxicology", "domain": "Medical", "cards": [{"front": "BE-FAST stroke screen", "back": "Balance, Eyes (vision loss), Face droop, Arm drift, Speech difficulty, Time to call 911."}, {"front": "Cincinnati Prehospital Stroke Scale", "back": "Facial droop, arm drift, abnormal speech. One abnormal finding = high stroke probability."}, {"front": "Ischemic vs hemorrhagic stroke", "back": "Ischemic: clot blocks vessel (about 87%). Hemorrhagic: vessel bursts, bleed. Both need rapid transport to stroke center."}, {"front": "Stroke priority actions", "back": "Last known well time, glucose check (rule out hypoglycemia), oxygen if hypoxic, pre-alert stroke center."}, {"front": "TIA", "back": "Transient ischemic attack: stroke symptoms resolving within minutes to 24 hours. Warning sign; still transport."}, {"front": "Tonic-clonic (grand mal) seizure", "back": "Phases: aura, tonic (stiff), clonic (jerking), postictal state. Lasts few minutes."}, {"front": "Postictal state", "back": "Period after seizure: confusion, drowsiness, headache, can last 5-30 minutes or longer."}, {"front": "Status epilepticus", "back": "Seizure lasting 5 minutes or longer, or repeated seizures without regaining consciousness. Life threat: support airway, rapid transport."}, {"front": "Seizure care", "back": "Protect from injury, nothing in the mouth, do not restrain, suction/airway after, oxygen, check glucose, note duration."}, {"front": "Febrile seizure", "back": "Seizure with fever in child about 6 months to 5 years; usually brief and generalized. Transport; cool without ice."}, {"front": "Common seizure causes", "back": "Epilepsy, hypoglycemia, head trauma, fever, drugs/alcohol withdrawal, stroke, eclampsia, hypoxia."}, {"front": "Altered mental status mnemonic", "back": "AEIOU-TIPS: Alcohol, Epilepsy/Electrolytes, Insulin, Overdose/Oxygen, Uremia, Trauma, Infection, Psychosis, Stroke."}, {"front": "Hypoglycemia signs", "back": "Rapid onset: anxious, diaphoretic, pale cool skin, tremors, tachycardia, hunger, confusion, seizures. Glucose under about 70 mg/dL."}, {"front": "Hyperglycemia / DKA signs", "back": "Slow onset: warm dry skin, polyuria, polydipsia, fruity (acetone) breath, Kussmaul respirations, nausea, abdominal pain, dehydration."}, {"front": "Which glucose level is hypoglycemia", "back": "Commonly under 70 mg/dL with symptoms (protocols vary, about 60-70). Give oral glucose only if the patient is awake and can swallow; otherwise airway support and ALS."}, {"front": "Oral glucose administration", "back": "Only if awake, able to swallow and protect the airway. Typical dose 15 g (one tube) between cheek and gum; repeat per local protocol. Contraindicated if unresponsive."}, {"front": "Diabetic: 'cold and clammy' vs 'hot and dry'", "back": "Cold and clammy = give sugar (hypoglycemia). Hot and dry = hyperglycemia; transport and treat per protocol."}, {"front": "Anaphylaxis definition", "back": "Severe life-threatening allergic reaction with airway/breathing/circulatory involvement."}, {"front": "Anaphylaxis signs", "back": "Hives, swelling of face/lips/tongue, wheezing, stridor, hypotension, vomiting, tachycardia."}, {"front": "Epinephrine auto-injector dose: adult", "back": "0.3 mg for patients over about 30 kg (66 lb)."}, {"front": "Epinephrine auto-injector dose: child", "back": "0.15 mg for children about 15-30 kg (33-66 lb). A 0.1 mg device exists for infants 7.5-15 kg; under 15 kg follow medical direction/local protocol."}, {"front": "Epinephrine injection site", "back": "Lateral mid-thigh (vastus lateralis), through clothing if needed; hold 3 seconds (follow device). Record time; may repeat per protocol."}, {"front": "Epinephrine side effects", "back": "Tachycardia, palpitations, anxiety, tremor, pallor, headache, hypertension."}, {"front": "Bronchodilator MDI/nebulizer", "back": "Albuterol relieves wheezing in asthma/COPD; check expiration, shake, spacer, patient's own prescription with medical direction."}, {"front": "Asthma vs COPD", "back": "Asthma: reversible wheezing, younger, triggers. COPD: chronic, smoking, barrel chest, productive cough. Both: oxygen, bronchodilator."}, {"front": "CPAP indication", "back": "Acute pulmonary edema/CHF or COPD with respiratory distress; contraindicated if unresponsive, vomiting, or hypotensive."}, {"front": "Nitroglycerin: EMT assistance rules", "back": "Patient's own prescription, medical direction, SBP above local minimum (commonly 100; some use 90), no ED drugs in 24-48 h. 1 SL dose every 5 min, max 3; recheck BP each time."}, {"front": "Aspirin for chest pain", "back": "162-324 mg chewed (2-4 baby aspirin of 81 mg) for suspected ACS if no allergy, active GI bleeding or other contraindication; per local protocol."}, {"front": "Poison routes of exposure", "back": "Ingestion, inhalation, absorption (skin), injection."}, {"front": "Activated charcoal", "back": "Binds ingested toxins; use only per medical direction. Not for acids/alkalis/alcohol; patient must be alert."}, {"front": "Opioid toxidrome", "back": "Pinpoint pupils, decreased mental status, slow respirations (respiratory depression). Treat with ventilation and naloxone."}, {"front": "Naloxone (Narcan)", "back": "Opioid antagonist; intranasal commonly 2-4 mg (per local protocol), may repeat in 2-3 min. Support ventilations first."}, {"front": "Stimulant toxidrome", "back": "Dilated pupils, agitation, tachycardia, hypertension, hyperthermia, diaphoresis (cocaine, amphetamines)."}, {"front": "Sedative-hypnotic overdose", "back": "Decreased mental status and respirations, slurred speech (alcohol, benzodiazepines, barbiturates)."}, {"front": "Cholinergic (organophosphate) toxidrome", "back": "SLUDGE/DUMBELS: salivation, lacrimation, urination, defecation, GI upset, emesis; pinpoint pupils. Decontaminate; ALS atropine."}, {"front": "Anticholinergic toxidrome", "back": "'Hot as a hare, dry as a bone, red as a beet, blind as a bat, mad as a hatter': fever, dry skin, dilated pupils, delirium."}]}, {"name": "NREMT · Abdominal, Behavioral, Cardiac & Geriatrics", "domain": "Medical", "cards": [{"front": "Appendicitis presentation", "back": "Periumbilical pain moving to right lower quadrant (McBurney's point), nausea, fever, guarding."}, {"front": "Peritonitis signs", "back": "Rigid board-like abdomen, rebound tenderness, patient lies still with knees flexed."}, {"front": "Abdominal aortic aneurysm (AAA)", "back": "Tearing abdominal/back pain, pulsatile mass, hypotension, syncope; older male smoker. Rapid transport, gentle palpation."}, {"front": "Referred pain: gallbladder", "back": "Right upper quadrant to right shoulder/scapula."}, {"front": "Referred pain: spleen", "back": "Left upper quadrant to left shoulder (Kehr's sign)."}, {"front": "Referred pain: pancreatitis", "back": "Epigastric pain radiating to back, nausea; often after alcohol or gallstones."}, {"front": "Referred pain: kidney stone", "back": "Flank pain radiating to groin, restless patient, hematuria."}, {"front": "GI bleed signs", "back": "Hematemesis, coffee-ground emesis, melena (black tarry stool), hematochezia. Treat for shock."}, {"front": "Visceral vs parietal pain", "back": "Visceral: dull, poorly localized, crampy. Parietal: sharp, constant, localized (peritoneal irritation)."}, {"front": "Acute MI classic signs", "back": "Chest pressure/pain radiating to arm/jaw, dyspnea, diaphoresis, nausea. Women/diabetics/elderly may have atypical symptoms."}, {"front": "Angina vs MI", "back": "Angina: relieved by rest/nitro in about 5-15 minutes. MI: lasts over 15-20 minutes, not relieved by rest/nitro."}, {"front": "Heart failure signs", "back": "Left: crackles, dyspnea, orthopnea, frothy sputum. Right: JVD, peripheral edema, ascites."}, {"front": "AED use steps", "back": "Power on, attach pads, analyze, clear, shock if advised; resume CPR immediately for 2 minutes."}, {"front": "Adult CPR rates/depths", "back": "Compressions 100-120/min, depth at least 2 inches (5 cm), full recoil, minimal interruptions. Ratio 30:2 (1 or 2 rescuers)."}, {"front": "Behavioral emergency definition", "back": "Behavior unacceptable to patient, family, or community; can be due to medical cause: always rule out hypoglycemia, hypoxia, head injury, drugs."}, {"front": "Hyperactive delirium with severe agitation (formerly 'excited delirium')", "back": "Extreme agitation, hyperthermia, sweating, tachycardia, pain tolerance, paranoia. Sudden death risk: avoid prone restraint, monitor airway/breathing, request ALS and police."}, {"front": "Restraint principles", "back": "Reasonable force, adequate help (4-5), supine or lateral, never prone/hobble, reassess airway and circulation, document, follow protocol."}, {"front": "Suicide risk questions", "back": "Ask directly about thoughts and plan; secure scene; never leave patient alone; transport all."}, {"front": "Talking to behavioral patient", "back": "Calm, honest, nonjudgmental, keep distance, avoid sudden moves, don't argue or lie."}, {"front": "Geriatric vital sign tip", "back": "Older adults may have blunted responses: normal-looking BP may be abnormal for them; beta-blockers hide tachycardia."}, {"front": "Geriatric: atypical presentations", "back": "MI/infection may present as weakness, confusion or falls rather than classic pain."}, {"front": "Geriatric falls", "back": "Consider syncope, medications, infection, poor vision; high risk for hip fracture and head bleeds (anticoagulants)."}, {"front": "Delirium vs dementia", "back": "Delirium: acute onset, fluctuating, medical cause. Dementia: gradual, chronic memory decline."}, {"front": "Polypharmacy", "back": "Many medications raise risks for interactions, falls, and toxicity; bring/collect med list."}, {"front": "Elder abuse signs", "back": "Unexplained injuries, poor hygiene, malnutrition, fearful caregiver interaction. Mandatory reporting per local law."}, {"front": "Sepsis signs", "back": "Infection plus fever/hypothermia, tachycardia, tachypnea, altered mental status, hypotension, warm or mottled skin. Early recognition and pre-alert."}, {"front": "Pulmonary embolism signs", "back": "Sudden dyspnea, pleuritic chest pain, tachycardia, hypoxia; risk: immobilization, surgery, clotting, pregnancy."}, {"front": "Dialysis patient", "back": "Fluid overload/hyperkalemia risk; do not take BP or IV in fistula arm."}]}, {"name": "NREMT · OB/GYN & Childbirth", "domain": "OB/Peds", "cards": [{"front": "Stages of labor", "back": "Stage 1: dilation (onset to full cervical dilation). Stage 2: expulsion (full dilation to birth). Stage 3: placental delivery."}, {"front": "Signs of imminent delivery", "back": "Crowning, urge to push/bear down, contractions 2 minutes or less apart, bloody show, rupture of membranes."}, {"front": "Crowning", "back": "Baby's head visible at vaginal opening during contraction. Prepare for delivery; do not delay delivery to transport."}, {"front": "Contraction timing", "back": "Frequency: start of one to start of next. Duration: start to end of one. Active labor: 2-3 minutes apart, 45-60 s each."}, {"front": "Questions to ask in labor", "back": "Due date, first baby?, prior births/C-section, contractions timing, water broke, urge to push, bleeding, multiples, prenatal care."}, {"front": "Gravida vs para", "back": "Gravida: number of pregnancies. Para: number of births (viable deliveries)."}, {"front": "Delivery steps", "back": "Support the head, check for cord around neck, suction mouth then nose only if airway is obstructed, guide head down for upper shoulder then up for lower; support the slippery newborn."}, {"front": "Cord around neck", "back": "Gently slip over head or shoulder; if too tight, clamp in two places and cut between."}, {"front": "Cord clamping: timing and placement", "back": "Vigorous newborn: wait at least 60 s (AHA 2025). First clamp about 6 in from baby (texts vary, 4-10 in), second 2-3 in from the first; cut between. Follow local protocol."}, {"front": "Placenta delivery", "back": "Usually within 30 minutes; do not pull on cord. Transport placenta in bag with mother."}, {"front": "Postpartum hemorrhage care", "back": "Massage uterus (fundus) firmly, place newborn to breast, treat shock, rapid transport."}, {"front": "Normal blood loss at delivery", "back": "About 500 mL is normal; more than that is excessive."}, {"front": "Breech presentation", "back": "Buttocks or feet first; high risk. Do not pull; support and rapid transport; if head stuck, make airway space with fingers (V-shape)."}, {"front": "Prolapsed umbilical cord", "back": "Cord appears in vagina before baby. Mother knee-chest or Trendelenburg, gloved hand lifts presenting part off cord, keep cord moist, rapid transport."}, {"front": "Limb presentation", "back": "Arm or leg first; cannot be delivered in field; rapid transport, knee-chest."}, {"front": "Multiple births", "back": "Expect more babies; call ALS; keep each baby warm; second delivery usually quick; increased bleeding risk."}, {"front": "Placenta previa", "back": "Placenta covers cervix: painless bright red vaginal bleeding in third trimester."}, {"front": "Abruptio placentae", "back": "Placenta separates early: painful bleeding (may be hidden), rigid tender uterus, fetal distress; trauma/hypertension risk."}, {"front": "Previa vs abruption", "back": "Previa = painless, bright red. Abruption = painful, dark, rigid uterus."}, {"front": "Ectopic pregnancy", "back": "Implantation outside uterus (usually tube): lower abdominal pain, vaginal bleeding, shock, missed period; life-threatening."}, {"front": "Preeclampsia signs", "back": "After 20 weeks: hypertension, headache, visual changes, edema, upper abdominal pain."}, {"front": "Eclampsia", "back": "Seizures in pregnancy/preeclampsia. Care: left lateral, airway, oxygen, dim lights, rapid transport, ALS (magnesium)."}, {"front": "Supine hypotensive syndrome", "back": "Uterus compresses inferior vena cava when lying flat after about 20 weeks; place mother on left side or tilt uterus left."}, {"front": "Trauma in pregnancy", "back": "Treat the mother first; high-flow oxygen, left lateral tilt on backboard, fetal loss risk from placental abruption."}, {"front": "Spontaneous abortion (miscarriage)", "back": "Loss before 20 weeks: cramping, bleeding, tissue. Care: pads (no packing), keep tissue, emotional support."}, {"front": "Normal changes in pregnancy", "back": "Increased heart rate and blood volume, decreased BP in 2nd trimester, increased respiratory rate."}, {"front": "Vaginal bleeding care", "back": "Pads, not packing; save clots/tissue; treat shock; ask about pregnancy."}, {"front": "Sexual assault care", "back": "Preserve evidence (do not wash, change, or clean), be nonjudgmental, privacy, same-gender provider if possible, notify law enforcement per protocol."}, {"front": "Pelvic inflammatory disease (PID)", "back": "Infection of female organs: lower abdominal pain, fever, discharge."}]}, {"name": "NREMT · Newborn & Pediatrics", "domain": "OB/Peds", "cards": [{"front": "APGAR: five parts", "back": "Appearance (color), Pulse, Grimace (reflex irritability), Activity (muscle tone), Respirations. Each scored 0-2."}, {"front": "APGAR: Appearance scores", "back": "0 blue/pale all over, 1 pink body with blue extremities, 2 completely pink."}, {"front": "APGAR: Pulse scores", "back": "0 absent, 1 under 100/min, 2 at 100/min or more."}, {"front": "APGAR: Grimace scores", "back": "0 no response, 1 grimace/weak cry, 2 cough, sneeze or strong cry."}, {"front": "APGAR: Activity scores", "back": "0 limp/flaccid, 1 some flexion of extremities, 2 active motion."}, {"front": "APGAR: Respirations scores", "back": "0 absent, 1 slow/irregular/weak cry, 2 good strong cry."}, {"front": "APGAR timing and interpretation", "back": "Scored at 1 and 5 minutes. 7-10 normal, 4-6 moderately depressed, 0-3 severely depressed. Do not delay resuscitation to score."}, {"front": "Newborn initial care", "back": "Dry, warm (wrap, cover head), position airway, suction mouth then nose only if secretions obstruct, stimulate by rubbing back/flicking feet."}, {"front": "Newborn resuscitation: when to ventilate", "back": "Apnea/gasping or heart rate under 100 after drying, warming and stimulating: BVM ventilations at 40-60 breaths/min with room air first. Recheck heart rate after 30 s."}, {"front": "Newborn compressions", "back": "Heart rate under 60 despite at least 30 s of effective ventilation: 3:1 ratio (90 compressions + 30 breaths per min), two thumbs on lower third of sternum, depth 1/3 of chest."}, {"front": "Normal newborn vitals", "back": "Heart rate about 120-160, respirations 40-60, temp maintained; acrocyanosis (blue hands/feet) is common."}, {"front": "Meconium in amniotic fluid", "back": "Green/brown fluid; if baby not vigorous suction and resuscitate per protocol; avoid routine deep suctioning."}, {"front": "Pediatric normal HR (awake)", "back": "Infant 100-160, toddler 90-150, preschool 80-140, school age 70-120, adolescent 60-100. Approximate: ranges vary by textbook."}, {"front": "Pediatric normal respirations", "back": "Infant 30-60, toddler 24-40, preschool 22-34, school age 18-30, adolescent 12-16. Approximate: ranges vary by textbook."}, {"front": "Pediatric normal systolic BP", "back": "Infant 70-95, toddler 80-100, preschool 80-100, school age 80-110, adolescent 110-130 (tables vary). Hypotension age 1-10: SBP under 70 + 2 x age in years."}, {"front": "Signs of respiratory distress in children", "back": "Nasal flaring, retractions (intercostal/supraclavicular), grunting, head bobbing, seesaw breathing, stridor."}, {"front": "Signs of pediatric respiratory failure (late/ominous)", "back": "Altered mental status, slowing or irregular respirations, poor tone, cyanosis. Bradycardia in a child is hypoxia until proven otherwise: ventilate with BVM."}, {"front": "Croup", "back": "Viral, gradual onset, barky seal-like cough, stridor on inspiration, low fever, 6 months to 3 years; humidified O2, calm child."}, {"front": "Epiglottitis", "back": "Bacterial; rapid onset, high fever, drooling, tripod position, muffled voice, no cough. Keep calm, do not examine throat, oxygen blow-by, rapid transport."}, {"front": "Croup vs epiglottitis summary", "back": "Croup: barky cough, no drooling, gradual. Epiglottitis: drooling, toxic ill, sudden, minimal cough."}, {"front": "Foreign body airway obstruction: infant vs child (AHA 2025)", "back": "Infant: 5 back blows then 5 chest thrusts. Child: 5 back blows alternating with 5 abdominal thrusts (2025 change; older texts say thrusts only). Unresponsive: start CPR."}, {"front": "Pediatric CPR ratios", "back": "1 rescuer 30:2; 2 rescuers 15:2; 100-120/min; depth 1/3 of chest (about 1.5 in infant, 2 in child). Infant: 2 thumbs-encircling or heel of 1 hand (AHA 2025: no 2-finger)."}, {"front": "Pediatric dosing/airway sizing tools", "back": "Length-based tape (Broselow) for equipment/doses. Oral airway: corner of mouth to earlobe/angle of jaw; in children insert tip-down with a tongue depressor, without rotating."}, {"front": "Pediatric airway differences", "back": "Larger tongue, narrower airway, floppy trachea, belly breathers; use padding under shoulders to neutral/sniffing position."}, {"front": "SIDS", "back": "Sudden unexplained death of infant under 1 year, usually during sleep, peak 2-4 months. Attempt resuscitation unless obvious death signs; support family."}, {"front": "Febrile seizure (peds)", "back": "Typically 6 months to 5 years with rapid temp rise; usually under 5 minutes. Protect airway, remove excess clothing (no ice or cold baths), transport."}, {"front": "Pediatric dehydration signs", "back": "Sunken fontanelle/eyes, no tears, dry mucosa, fewer diapers, lethargy, delayed cap refill."}, {"front": "Child abuse red flags", "back": "Injury inconsistent with story, delay seeking care, multiple bruises at different stages, patterned marks, shaken baby signs. Report per law."}, {"front": "Pediatric burns/falls caution", "back": "Use a pediatric burn chart (head is a larger % of BSA); large heavy head makes head injury likely in falls; pad under the torso to keep the spine neutral during SMR."}, {"front": "Pediatric hypoglycemia", "back": "Common in sick infants; check glucose; altered mental status or poor feeding."}, {"front": "Pediatric poisoning", "back": "Common household toxins; call poison control 1-800-222-1222 and get substance, amount, time."}]}, {"name": "NREMT · Medical Terminology", "domain": "Foundations", "cards": [{"front": "Prefix: hyper-", "back": "Above, excessive (hypertension)"}, {"front": "Prefix: hypo-", "back": "Below, deficient (hypoglycemia)"}, {"front": "Prefix: brady- / tachy-", "back": "Brady- = slow; tachy- = fast (bradycardia, tachypnea)"}, {"front": "Prefix: a- / an-", "back": "Without, absence of (apnea, anemia)"}, {"front": "Prefix: dys-", "back": "Difficult, painful, abnormal (dyspnea, dysuria)"}, {"front": "Prefix: poly- / oligo-", "back": "Poly- = many, much (polyuria); oligo- = few, scanty (oliguria)"}, {"front": "Prefix: hemi- / peri-", "back": "Hemi- = half (hemiplegia); peri- = around (pericardium)"}, {"front": "Prefix: endo- / epi- / sub-", "back": "Endo- = within; epi- = upon/above; sub- = below/under (subcutaneous)"}, {"front": "Prefix: inter- vs intra-", "back": "Inter- = between; intra- = within (intravenous)"}, {"front": "Suffix: -itis", "back": "Inflammation (appendicitis)"}, {"front": "Suffix: -ectomy / -otomy / -ostomy", "back": "-ectomy = surgical removal; -otomy = cutting into; -ostomy = creating an opening"}, {"front": "Suffix: -emia", "back": "Blood condition (hypoxemia, anemia)"}, {"front": "Suffix: -algia", "back": "Pain (neuralgia)"}, {"front": "Suffix: -pnea", "back": "Breathing (apnea, dyspnea, tachypnea)"}, {"front": "Suffix: -megaly / -oma", "back": "-megaly = enlargement (cardiomegaly); -oma = tumor/mass"}, {"front": "Suffix: -osis / -penia", "back": "-osis = abnormal condition (cyanosis); -penia = deficiency (leukopenia)"}, {"front": "Suffix: -rrhage / -rrhea", "back": "-rrhage = bursting forth/bleeding (hemorrhage); -rrhea = flow/discharge (diarrhea)"}, {"front": "Root: cardi/o, pulmon/o, hepat/o", "back": "Heart, lung, liver"}, {"front": "Root: nephr/o, gastr/o, cephal/o", "back": "Kidney, stomach, head"}, {"front": "Root: cyan/o, hem/o, derm/o", "back": "Blue, blood, skin"}, {"front": "Anterior vs posterior", "back": "Anterior (ventral) = front of body; posterior (dorsal) = back"}, {"front": "Superior vs inferior", "back": "Superior = toward the head (above); inferior = toward the feet (below)"}, {"front": "Medial vs lateral", "back": "Medial = toward the midline; lateral = away from the midline, toward the side"}, {"front": "Proximal vs distal", "back": "Proximal = closer to the trunk/point of attachment; distal = farther from it"}, {"front": "Ipsilateral vs contralateral", "back": "Ipsilateral = same side of the body; contralateral = opposite side"}, {"front": "Palmar vs plantar", "back": "Palmar = palm of the hand; plantar = sole of the foot"}, {"front": "Sagittal (midsagittal) plane", "back": "Vertical plane dividing body into right and left; midsagittal splits it into equal halves"}, {"front": "Frontal (coronal) plane", "back": "Vertical plane dividing body into anterior (front) and posterior (back) parts"}, {"front": "Transverse (axial) plane", "back": "Horizontal plane dividing body into superior (upper) and inferior (lower) parts"}, {"front": "Supine vs prone", "back": "Supine = lying face up on back; prone = lying face down"}, {"front": "Fowler's position", "back": "Sitting up, about 45-60 degrees (high Fowler's more upright); semi-Fowler's about 30-45"}, {"front": "Trendelenburg position", "back": "Supine on an incline with head lower than feet; modified = flat with legs raised. Rarely used for shock now; follow local protocol"}, {"front": "Recovery position", "back": "Lateral recumbent (on side) to protect the airway of an unresponsive, breathing patient without spinal injury"}]}, {"name": "NREMT · Anatomy & Physiology", "domain": "Foundations", "cards": [{"front": "Blood flow through the heart: right side", "back": "Vena cavae > right atrium > tricuspid valve > right ventricle > pulmonic valve > pulmonary artery > lungs"}, {"front": "Blood flow: left side", "back": "Lungs > pulmonary veins > left atrium > mitral (bicuspid) valve > left ventricle > aortic valve > aorta > body"}, {"front": "Arteries vs veins", "back": "Arteries carry blood away from the heart (usually oxygenated); veins return blood to the heart. Exception: pulmonary vessels"}, {"front": "Perfusion", "back": "Delivery of oxygen and nutrients to cells and removal of waste products; inadequate perfusion = shock"}, {"front": "Cardiac output formula", "back": "Cardiac output = heart rate x stroke volume"}, {"front": "Blood components", "back": "Red cells (carry O2), white cells (immunity), platelets (clotting), plasma (liquid portion)"}, {"front": "Skin layers", "back": "Epidermis (outer), dermis (middle: nerves, vessels, glands), subcutaneous tissue (fat, deepest)"}, {"front": "Upper airway path", "back": "Nose/mouth > pharynx > larynx (epiglottis, vocal cords) > trachea"}, {"front": "Lower airway path", "back": "Trachea > mainstem bronchi > bronchioles > alveoli (site of gas exchange)"}, {"front": "Mechanics of inhalation", "back": "Diaphragm contracts and flattens, ribs lift; chest volume rises, pressure falls, air flows in (active); exhalation is passive"}, {"front": "Oxygen in room air vs exhaled air", "back": "Room air about 21% O2; exhaled air about 16% O2 (enough for rescue breathing)"}, {"front": "Gas exchange", "back": "Oxygen and CO2 diffuse across the alveolar-capillary membrane by concentration gradient"}, {"front": "Aerobic vs anaerobic metabolism", "back": "Aerobic uses oxygen and yields much energy; anaerobic (no oxygen) yields little energy and produces lactic acid"}, {"front": "Spinal column regions", "back": "7 cervical, 12 thoracic, 5 lumbar, 5 sacral (fused), 4 coccyx (fused) = 33 vertebrae"}, {"front": "Three muscle types", "back": "Skeletal (voluntary), smooth (involuntary, in organs/vessels), cardiac (involuntary, heart only)"}, {"front": "Central vs peripheral nervous system", "back": "CNS = brain and spinal cord; PNS = nerves outside CNS (sensory and motor)"}, {"front": "Sympathetic vs parasympathetic", "back": "Sympathetic = fight or flight (raises HR, BP); parasympathetic = rest and digest (lowers HR)"}, {"front": "RUQ organs", "back": "Liver, gallbladder (also part of colon)"}, {"front": "LUQ organs", "back": "Stomach, spleen (also pancreas tail)"}, {"front": "RLQ organs", "back": "Appendix, cecum (right ovary/fallopian tube in females)"}, {"front": "Retroperitoneal organs", "back": "Kidneys, pancreas, aorta, vena cava; behind the peritoneal lining"}, {"front": "Hormone that lowers blood glucose", "back": "Insulin, made by beta cells of the pancreas; glucagon raises glucose"}, {"front": "Pulse points to know", "back": "Carotid, femoral, radial, brachial (infants), posterior tibial, dorsalis pedis"}, {"front": "Cardiac conduction origin", "back": "SA node in the right atrium is the natural pacemaker (60-100 bpm)"}, {"front": "Systole vs diastole", "back": "Systole = ventricular contraction (top BP number); diastole = ventricular relaxation/filling (bottom number)"}, {"front": "Glasgow Coma Scale components", "back": "Eye opening (1-4), verbal (1-5), motor (1-6); total 3-15, lower = worse"}, {"front": "Adequate vs inadequate breathing signs", "back": "Adequate: 12-20, regular, clear lungs, good chest rise. Inadequate: rate extremes, shallow, retractions, cyanosis, noisy"}, {"front": "Layers covering the brain", "back": "Meninges: dura mater, arachnoid, pia mater; cerebrospinal fluid cushions the brain"}]}, {"name": "NREMT · Patient Assessment", "domain": "Foundations", "cards": [{"front": "Order of patient assessment", "back": "Scene size-up, primary assessment, history taking, secondary assessment, reassessment"}, {"front": "Scene size-up components", "back": "Scene safety, PPE/BSI, mechanism of injury/nature of illness, number of patients, additional resources, spinal consideration"}, {"front": "Primary assessment steps", "back": "General impression, level of consciousness, airway, breathing, circulation (bleeding, pulse, skin), priority/transport decision"}, {"front": "Life threats addressed first in primary", "back": "Life-threatening bleeding, airway, breathing and circulation problems; treat as found"}, {"front": "AVPU", "back": "Alert, responds to Verbal stimuli, responds to Painful stimuli, Unresponsive"}, {"front": "SAMPLE", "back": "Signs/symptoms, Allergies, Medications, Pertinent past history, Last oral intake, Events leading up"}, {"front": "DCAP-BTLS", "back": "Deformities, Contusions, Abrasions, Punctures/Penetrations, Burns, Tenderness, Lacerations, Swelling"}, {"front": "Pertinent negative", "back": "A relevant sign/symptom the patient does not have (e.g., denies chest pain in dyspnea patient); document it"}, {"front": "Reassessment interval: unstable patient", "back": "Every 5 minutes (or more often)"}, {"front": "Reassessment interval: stable patient", "back": "Every 15 minutes"}, {"front": "Reassessment components", "back": "Repeat primary assessment, reassess vitals, recheck interventions, reconfirm transport priority, recheck chief complaint"}, {"front": "Significant MOI examples (trauma)", "back": "Ejection, death in same vehicle, intrusion >12 in at occupant site, fall >10 ft (all ages, ACS 2021), pedestrian/cyclist thrown or run over, motorcycle crash with significant impact"}, {"front": "Rapid trauma assessment", "back": "Quick head-to-toe exam for significant MOI/unresponsive trauma patient, looking for DCAP-BTLS"}, {"front": "Retractions / accessory muscle use", "back": "Signs of increased work of breathing; tripod positioning and nasal flaring also indicate respiratory distress"}, {"front": "Crackles (rales)", "back": "Bubbling/crackling lung sounds suggesting fluid in alveoli (pulmonary edema, pneumonia)"}, {"front": "Battle sign / raccoon eyes", "back": "Bruising behind the ear / around the eyes; signs of basilar skull fracture"}, {"front": "Jugular vein distention, tracheal deviation", "back": "Late signs of tension pneumothorax or other obstructive problems"}, {"front": "Responsive medical patient approach", "back": "Primary, history (SAMPLE, OPQRST), secondary focused on complaint, vitals, interventions, transport, reassess"}, {"front": "Unresponsive medical patient approach", "back": "Primary, rapid head-to-toe exam, vitals, SAMPLE from family/bystanders/records, then interventions and transport"}, {"front": "Chief complaint", "back": "Reason EMS was called, in the patient's own words"}, {"front": "Medical alert tag value", "back": "Gives conditions/medications/allergies when the patient cannot give history"}]}, {"name": "NREMT · Vital Signs & Normals", "domain": "Foundations", "cards": [{"front": "Normal adult blood pressure", "back": "Systolic about 90-140, diastolic about 60-90 (ranges vary by source); hypotension is usually systolic <90"}, {"front": "Pulse pressure", "back": "Systolic minus diastolic; narrows in shock, widens with rising intracranial pressure"}, {"front": "Normal adult temperature", "back": "About 98.6 F (37 C); roughly 97.8-99.1 F"}, {"front": "Normal blood glucose", "back": "About 70-120 mg/dL (ranges vary by source). Hypoglycemia treatment threshold is commonly <60-70 mg/dL with symptoms; per local protocol"}, {"front": "Infant normal vitals (1-12 mo)", "back": "HR about 100-160; RR about 25-50 (newborns 30-60); SBP about 70-100. Ranges vary by textbook; learn your course's table"}, {"front": "Toddler normal vitals (1-3 yr)", "back": "HR about 90-150; RR about 20-30 (some tables 24-40); SBP about 80-100. Ranges vary by source"}, {"front": "Preschool normal vitals (3-5 yr)", "back": "HR about 80-140; RR about 20-30 (some tables 22-34); SBP about 80-110. Ranges vary by source"}, {"front": "School-age normal vitals (6-12 yr)", "back": "HR about 70-120; RR about 15-25 (some tables 18-30); SBP about 80-120. Ranges vary by source"}, {"front": "Adolescent normal vitals (13-18 yr)", "back": "HR about 60-100; RR about 12-20; SBP about 90-130 (near adult values). Ranges vary by source"}, {"front": "Minimum pediatric systolic BP", "back": "70 + (2 x age in years) for ages 1-10; below this = hypotension. Infants under 1 yr: <70; over 10 yr: <90. A falling BP is a late sign in children"}, {"front": "Skin: cyanosis", "back": "Blue-gray skin or mucosa from poor oxygenation"}, {"front": "Skin: pallor", "back": "Pale skin from poor perfusion/blood loss"}, {"front": "Skin: jaundice", "back": "Yellow skin/sclera; liver problems"}, {"front": "Skin: flushed (red)", "back": "Fever, heat exposure, allergic reaction, CO poisoning (cherry red; rare)"}, {"front": "Skin: mottled", "back": "Blotchy discoloration; poor perfusion/late shock"}, {"front": "Normal skin condition", "back": "Warm, dry, pink (check mucosa/nail beds in dark skin); normal capillary refill is 2 seconds or less"}, {"front": "Capillary refill reliability", "back": "Most reliable in infants and children under 6; unreliable in cold or elderly adults"}, {"front": "Pupils: PERRL", "back": "Pupils Equal, Round, Reactive to Light"}, {"front": "Constricted (pinpoint) pupils", "back": "Opioids (narcotics); also organophosphate/nerve agent poisoning and some brainstem strokes"}, {"front": "Dilated pupils", "back": "Fear, drugs (stimulants), hypoxia, cardiac arrest, certain brain injury"}, {"front": "Unequal pupils", "back": "Possible head injury/stroke (also may be normal variation or prosthesis)"}, {"front": "Pulse quality terms", "back": "Rate, rhythm (regular/irregular), quality (strong/weak/thready/bounding)"}, {"front": "Respiratory quality terms", "back": "Rate, rhythm, quality (breath sounds, chest expansion), effort"}, {"front": "Pulse oximetry limitation", "back": "Unreliable with CO poisoning, cold extremities, shock, nail polish, motion; treat patient, not the number"}, {"front": "How to measure respiratory rate", "back": "Count breaths for 30 seconds and multiply by 2 (or 60 seconds if irregular); do it without telling patient"}, {"front": "Blood pressure by palpation", "back": "Systolic only; used when auscultation is not possible"}, {"front": "Tachycardia vs bradycardia (adult)", "back": "Tachycardia >100/min; bradycardia <60/min"}]}, {"name": "NREMT · Pharmacology", "domain": "Foundations", "cards": [{"front": "Six rights of medication administration", "back": "Right patient, medication, dose, route, time, documentation (many programs add right reason)"}, {"front": "Generic vs trade name", "back": "Generic = official nonproprietary name (e.g., albuterol), not capitalized; trade = manufacturer's brand name (e.g., Proventil)"}, {"front": "Indication / contraindication", "back": "Indication = reason to give; contraindication = reason NOT to give"}, {"front": "Medication forms", "back": "Tablet, capsule, solution, suspension (shake first), gel, inhaler, powder, gas, sublingual, injectable"}, {"front": "Enteral vs parenteral", "back": "Enteral = through the GI tract (oral); parenteral = outside the GI tract (injection)"}, {"front": "Medication routes: EMT vs beyond EMT scope", "back": "EMT: oral, sublingual, inhaled, intranasal, IM (auto-injector), per protocol. Know but beyond EMT scope in most states: IV, IO, subcutaneous, rectal"}, {"front": "Oxygen: indication/dose", "back": "Hypoxia (SpO2 <94%), respiratory distress, shock; titrate to 94-99%. NRB 10-15 L/min; nasal cannula 1-6 L/min. Chest pain alone with normal SpO2 does not require O2"}, {"front": "Oxygen: contraindication", "back": "None for a hypoxic or critically ill patient; avoid unnecessary high-flow if SpO2 normal (per protocol)"}, {"front": "Oral glucose: indication", "back": "Conscious patient with altered mental status and known/suspected hypoglycemia who can swallow"}, {"front": "Oral glucose: contraindication & dose", "back": "Unresponsive or unable to swallow/protect airway; one tube (about 15 g, varies by product) buccal/oral, repeat per protocol"}, {"front": "Aspirin: indication", "back": "Chest pain suggestive of heart attack (ACS)"}, {"front": "Aspirin: dose", "back": "162-324 mg chewed (2-4 low-dose 81 mg tablets; commonly 324 mg), non-enteric-coated, per protocol"}, {"front": "Aspirin: contraindications", "back": "Aspirin/NSAID allergy, active GI bleeding or ulcer, unable to swallow; not for children; per protocol, other bleeding disorders"}, {"front": "Nitroglycerin: indication & action", "back": "Chest pain of suspected cardiac origin in a patient with their own prescribed NTG; vasodilator that reduces heart workload"}, {"front": "Nitroglycerin: dose", "back": "0.4 mg sublingual (tablet or spray); may repeat every 5 min to a max of 3 doses (including doses the patient took) if BP stays adequate; per medical direction"}, {"front": "Nitroglycerin: contraindications", "back": "SBP below 90-100 (cutoff per local protocol); PDE5 inhibitor use: sildenafil/vardenafil within 24 h, tadalafil within 48 h; head injury; already took max dose"}, {"front": "Nitroglycerin: side effects", "back": "Headache, hypotension, dizziness, burning under tongue"}, {"front": "Epinephrine auto-injector: indication", "back": "Anaphylaxis / severe allergic reaction (respiratory distress or shock signs)"}, {"front": "Epinephrine auto-injector: dose", "back": "Adult 0.3 mg (about 30 kg and up); pediatric 0.15 mg (about 15-30 kg); infant 0.1 mg device where available; IM into anterolateral thigh; repeat per protocol"}, {"front": "Epinephrine: side effects", "back": "Tachycardia, anxiety, pallor, tremor, hypertension, palpitations"}, {"front": "Albuterol MDI: indication", "back": "Wheezing/bronchospasm in asthma or COPD (bronchodilator)"}, {"front": "Albuterol MDI: dose", "back": "90 mcg per puff, usually 1-2 puffs, per protocol (patient-prescribed MDI)"}, {"front": "Albuterol: side effects", "back": "Tachycardia, tremor, nervousness"}, {"front": "Naloxone: indication", "back": "Suspected opioid overdose with respiratory depression/altered mentation"}, {"front": "Naloxone: dose/route", "back": "Intranasal: 4 mg spray in one nostril, or 2 mg by atomizer (1 mg per nostril); IM auto-injector per protocol. Goal is adequate breathing; repeat in 2-3 min as needed"}, {"front": "Activated charcoal (only where protocol allows)", "back": "Adsorbs (binds) some ingested poisons. Removed from many EMT protocols. Not for altered mental status, unable to swallow, acids/alkalis, or hydrocarbons"}, {"front": "Activated charcoal dose (only where protocol allows)", "back": "About 1 g/kg (adult 25-50 g; child 12.5-25 g); shake well. Only where local protocol and medical direction/poison control still allow it"}, {"front": "Pediatric medication dosing principle", "back": "Doses are weight-based; use a length-based tape or known weight, never guess; use only protocol-approved pediatric doses and devices"}, {"front": "Medications EMTs may assist a patient with", "back": "Patient-prescribed epinephrine auto-injector, nitroglycerin, and metered-dose inhaler (albuterol); others per local protocol and medical direction"}, {"front": "Side effect vs adverse reaction", "back": "Side effect = unintended, often predictable effect; adverse reaction = harmful unintended response"}]}, {"name": "NREMT · Legal & Ethical", "domain": "Foundations", "cards": [{"front": "Expressed consent", "back": "Patient verbally or in writing agrees to care (competent adult, informed)"}, {"front": "Implied consent", "back": "Presumed consent for life-threatening emergency when patient unresponsive or unable to decide"}, {"front": "Informed consent", "back": "Patient understands risks, benefits, and alternatives before agreeing"}, {"front": "Minor consent", "back": "Parent/guardian consents; emergency treatment proceeds under implied consent if none available"}, {"front": "Emancipated minor", "back": "Minor legally treated as an adult (e.g., married, in the military, court order; in some states pregnant or a parent); can consent. Criteria vary by state"}, {"front": "Involuntary consent", "back": "Court- or law-enforcement-ordered treatment, e.g., for prisoners or dangerous patients"}, {"front": "Right to refuse care", "back": "Competent adult can refuse; ensure informed refusal, document thoroughly, get signature, witness, advise, per protocol"}, {"front": "Abandonment", "back": "Ending care without the patient's consent and without ensuring continued care by a provider of equal or higher level"}, {"front": "Negligence: four elements", "back": "Duty to act, breach of duty, harm/injury, causation (proximate cause)"}, {"front": "Duty to act", "back": "Obligation to respond when on duty or called; may arise from policy, contract, or statute"}, {"front": "Standard of care", "back": "How a reasonably prudent, similarly trained provider would act under similar circumstances"}, {"front": "Scope of practice", "back": "Care an EMT is legally allowed to provide, defined by state law and medical direction"}, {"front": "Assault vs battery", "back": "Assault = threat of unwanted contact; battery = actual unlawful touching without consent"}, {"front": "False imprisonment", "back": "Unlawfully restraining a person without consent or legal authority"}, {"front": "Libel vs slander", "back": "Libel = false written statement; slander = false spoken statement"}, {"front": "Good Samaritan law", "back": "Protects those who give care in good faith without compensation, outside duty; not for gross negligence"}, {"front": "HIPAA purpose", "back": "Protects the privacy of patient health information; PHI may be released for treatment, payment, operations, or as required by law"}, {"front": "Protected health information (PHI)", "back": "Any identifiable info about a patient's health, care, or payment"}, {"front": "Mandatory reporting: common categories", "back": "Child abuse/neglect; elder or vulnerable adult abuse; in many states gunshot/stab wounds, sexual assault, animal bites, some communicable diseases. Varies by state"}, {"front": "DNR order", "back": "Written order to withhold CPR/resuscitation; must be valid per state law and local protocol. DNR does not mean do not treat: still give comfort care"}, {"front": "POLST / MOLST", "back": "Portable medical orders for seriously ill patients detailing limits of treatment; follow per protocol"}, {"front": "Advance directive / living will", "back": "Patient's written wishes about future care if incapacitated"}, {"front": "Durable power of attorney for health care", "back": "Person authorized to make medical decisions when the patient cannot"}, {"front": "Medical direction: online vs off-line", "back": "Online = real-time contact with a physician; off-line = standing orders and protocols"}, {"front": "Crime scene responsibilities", "back": "Ensure scene safety, treat the patient, avoid disturbing evidence, document and report observations"}, {"front": "Signs of obvious death", "back": "Decapitation, rigor mortis, dependent lividity, decomposition, incineration (per protocol)"}, {"front": "Documentation rule for refusals", "back": "Record capacity assessment, risks explained, patient statements, witness, and signature"}, {"front": "Organ donor consideration", "back": "Provide care; do not delay resuscitation; follow local protocol, notify hospital of donor status"}, {"front": "Patient restraint", "back": "Use only reasonable force, per protocol and with law enforcement as needed; document why"}, {"front": "Res ipsa loquitur", "back": "Latin: 'the thing speaks for itself'; negligence apparent from the circumstances"}]}, {"name": "NREMT · EMS Operations: Safety & Moving", "domain": "Operations", "cards": [{"front": "Phases of an ambulance call", "back": "Preparation, dispatch, en route, arrival at scene, patient contact, transport, transfer of care at hospital, post-run"}, {"front": "Information dispatch should provide", "back": "Nature of call, location, patient count, name/callback number, safety concerns"}, {"front": "Lights and sirens use", "back": "Only when appropriate per local protocol and state law; drive with due regard for safety of others"}, {"front": "Safe following distance for ambulance", "back": "Commonly taught as at least 4 seconds (some sources 3); more in bad weather, at speed, or with a heavy vehicle. Follow agency policy and state law"}, {"front": "Types of ambulance", "back": "Type I (truck chassis), Type II (van), Type III (cutaway van chassis)"}, {"front": "Standard precautions", "back": "Treat all body fluids as potentially infectious; PPE includes gloves, eye protection, mask, gown"}, {"front": "PPE for airborne diseases", "back": "Fit-tested N95 (or higher) respirator for the provider when TB or other airborne illness is suspected; surgical mask on the patient if tolerated"}, {"front": "Hand hygiene", "back": "Wash after every patient contact; alcohol-based rub if soap unavailable and hands not visibly soiled"}, {"front": "Sharps safety", "back": "Never recap needles; dispose in puncture-resistant sharps container immediately"}, {"front": "Exposure to infectious disease", "back": "Report immediately, wash exposed area, document, follow agency exposure control plan"}, {"front": "Cleaning vs disinfection vs sterilization", "back": "Cleaning removes dirt; disinfection kills most organisms; sterilization kills all microorganisms"}, {"front": "Body mechanics: power lift", "back": "Feet shoulder-width apart, back straight, lift with legs, weight close to body, no twisting"}, {"front": "Power grip", "back": "Palms up, hands at least 10 inches apart, fully contact the object with all fingers"}, {"front": "Emergency move: when used", "back": "Immediate danger (fire, hazmat, explosives), cannot protect patient, or cannot access others needing care"}, {"front": "Emergency move examples", "back": "Blanket drag, clothing drag, shoulder drag, firefighter's drag"}, {"front": "Urgent move: when used", "back": "Immediate life threat needing rapid transport: altered mental status, inadequate ABCs, shock"}, {"front": "Non-urgent move", "back": "No immediate life threat; take time to stabilize and use proper equipment"}, {"front": "Rapid extrication technique", "back": "Urgent move of a seated patient from a vehicle onto a long board with manual spinal stabilization; for unstable patients, unsafe scenes, or to reach a critical patient"}, {"front": "Stair chair", "back": "Used for carrying a seated patient down stairs; not for spinal injuries"}, {"front": "Scoop stretcher", "back": "Splits and rejoins around patient; minimal movement; helpful for pelvic/spinal precautions"}, {"front": "Long backboard", "back": "Rigid device for moving spinal-risk patients; not a long-term transport surface"}, {"front": "Vehicle extrication steps", "back": "Size-up, hazard control and vehicle stabilization, gain access, emergency care, disentanglement (remove vehicle from around patient), removal and transfer"}, {"front": "Extrication hazards", "back": "Undeployed airbags, leaking fuel, battery/electrical, traffic, broken glass and sharp metal, hybrid/EV high voltage, unstable vehicle"}, {"front": "Air medical landing zone size", "back": "Commonly 100 x 100 ft (some services accept 60 x 60 ft by day); flat, firm, clear of wires, obstacles and loose debris. Follow the flight service/local protocol"}, {"front": "Approaching a helicopter", "back": "Only when signaled by the crew; from the front in the pilot's view, crouched; never near the tail rotor; on a slope approach from the downhill side"}, {"front": "Scene safety for violence", "back": "Stage away until police secure the scene; consider hidden weapons"}, {"front": "Reasons for PCR documentation", "back": "Continuity of care, legal record, billing/administrative, education, research, quality improvement"}, {"front": "PCR correction rule", "back": "Draw one line through the error, initial it, and add correct info; never obliterate"}, {"front": "Radio communication rules", "back": "Clear, brief, plain language, hold mic 2-3 inches away, push key and wait 1 second, no profanity, repeat orders"}, {"front": "Verbal hospital report contents", "back": "Age/sex, chief complaint, history, vitals, assessment findings, treatments given, ETA"}, {"front": "Critical incident stress management", "back": "Peer support and debriefing after traumatic calls; recognize signs of stress, burnout, PTSD"}]}, {"name": "NREMT · Operations: MCI, ICS & Hazmat", "domain": "Operations", "cards": [{"front": "Multiple-casualty incident (MCI)", "back": "Incident whose number or severity of patients strains or exceeds available resources. Some textbooks say 3 or more patients; the threshold is set by the local plan"}, {"front": "NIMS / ICS purpose", "back": "Standardized, scalable command structure and common terminology for managing incidents"}, {"front": "Incident Commander", "back": "Overall responsibility for incident; sets objectives, priorities, and strategy"}, {"front": "Command staff positions", "back": "Public Information Officer, Safety Officer, Liaison Officer"}, {"front": "General staff sections", "back": "Operations, Planning, Logistics, Finance/Administration (NIMS also allows an optional Intelligence/Investigations function)"}, {"front": "Unified command", "back": "Multiple agencies share command with agreed-upon objectives"}, {"front": "Span of control", "back": "Number of people one supervisor can manage: NIMS optimum is 1 supervisor to 5 subordinates; textbooks commonly give a range of 3-7"}, {"front": "Staging area", "back": "Location where resources wait until assigned"}, {"front": "MCI functional areas (EMS branch)", "back": "Triage, treatment, transport, staging; also extrication/rescue, morgue, rehab and supply as needed (ICS calls these groups, divisions or units)"}, {"front": "Triage purpose", "back": "Sort patients by urgency to do the greatest good for the most; reassess continually"}, {"front": "START: first step", "back": "Direct walking wounded to a safe area; they are tagged green (minor)"}, {"front": "START: respirations", "back": "Not breathing after airway opened = black; starts breathing after airway opened = red; rate over 30/min = red; under 30 = go on to check perfusion"}, {"front": "START: perfusion", "back": "No radial pulse or capillary refill >2 seconds = red; control severe bleeding; if pulse present/refill normal, check mental status"}, {"front": "START: mental status", "back": "Cannot follow simple commands = red; can follow commands = yellow"}, {"front": "START tag colors", "back": "Red = immediate; yellow = delayed; green = minor; black = deceased/expectant"}, {"front": "JumpSTART age range", "back": "Pediatric MCI triage for about ages 1-8 (if the patient looks like a child use JumpSTART; like a young adult use START). Infants are assessed with the non-ambulatory steps"}, {"front": "JumpSTART: ambulatory", "back": "Children able to walk are tagged green (minor) and sent for secondary triage; infants and children who cannot normally walk are assessed with the full algorithm"}, {"front": "JumpSTART: apnea", "back": "Open airway. Breathing starts = red. Still apneic: check pulse. No pulse = black. Pulse present: give 5 rescue breaths; breathing = red, still apneic = black"}, {"front": "JumpSTART: respirations", "back": "Rate under 15 or over 45/min, or irregular = red; rate 15-45 = go on to assess perfusion"}, {"front": "JumpSTART: perfusion & mental status", "back": "No palpable pulse = red. AVPU: P with inappropriate response (posturing) or U = red; A, V, or P with appropriate response (localizes pain) = yellow"}, {"front": "JumpSTART: black criteria", "back": "Apneic with no palpable pulse after airway opening, OR pulse present but still apneic after 5 rescue breaths = black (deceased/expectant)"}, {"front": "Hot zone", "back": "Contaminated area; only trained hazmat personnel in proper PPE enter; also called exclusion (red) zone"}, {"front": "Warm zone", "back": "Contamination reduction zone between hot and cold; decontamination corridor is here; entry needs proper PPE and training"}, {"front": "Cold zone", "back": "Safe support zone (uphill/upwind): command post, staging, and EMS triage/treatment of decontaminated patients"}, {"front": "ERG: yellow pages", "back": "Index of materials in order of 4-digit UN/NA ID number; gives the guide number. Highlighted entries: go to green pages"}, {"front": "ERG: blue pages", "back": "Index of materials alphabetically by name; gives ID number and guide number. Highlighted entries: go to green pages"}, {"front": "ERG: orange pages", "back": "The numbered guides: potential hazards, public safety (isolation, PPE, evacuation), and emergency response (fire, spill, first aid)"}, {"front": "ERG: green pages", "back": "Tables of initial isolation and protective action distances for toxic-inhalation-hazard and water-reactive materials (highlighted in yellow/blue pages)"}, {"front": "Hazmat placard color: red / orange", "back": "Red = flammable; orange = explosive"}, {"front": "Hazmat placard color: green / yellow / blue", "back": "Green = nonflammable gas; yellow = oxidizer; blue = dangerous when wet. (Yellow over white = radioactive)"}, {"front": "Hazmat placard color: white", "back": "White = poison/toxic or infectious substance; white top with black bottom = corrosive; red and white stripes = flammable solid"}, {"front": "NFPA 704 diamond colors", "back": "Blue = health, red = flammability, yellow = instability (reactivity), white = special hazards (e.g., W = no water, OX); each rated 0-4, 4 = worst"}, {"front": "Approach to hazmat scene", "back": "Approach from uphill and upwind (upstream); stay at a safe distance; identify with binoculars; isolate and deny entry; do not enter without training/PPE"}, {"front": "Resources for hazmat identification", "back": "Placards, shipping papers, safety data sheets, ERG, CHEMTREC, poison control"}]}, {"name": "NREMT · Radio Systems & What to Say", "domain": "Communication", "cards": [{"front": "Simplex radio", "back": "Transmit OR receive, one at a time, on one frequency. Push to talk, release to listen. You can't be interrupted while keyed up."}, {"front": "Duplex radio", "back": "Transmit and receive at the same time using two frequencies, like a phone call. Either side can interrupt."}, {"front": "Multiplex radio", "back": "Sends two or more signals at once on the same channel, such as voice plus ECG/telemetry data."}, {"front": "Trunking system", "back": "A computer assigns the next open frequency from a shared pool to each transmission, so many agencies share few channels."}, {"front": "Repeater", "back": "Receives a weak signal (portable or mobile radio) and rebroadcasts it at higher power to extend range."}, {"front": "Base station", "back": "Fixed radio at dispatch or a hospital, high power with a tall antenna. Longest range of the three radio types."}, {"front": "Mobile radio", "back": "Radio mounted in the ambulance. More power and range than a portable, less than a base station."}, {"front": "Portable radio", "back": "Handheld radio you carry on scene. Lowest power and range; may need a repeater to reach dispatch or the hospital."}, {"front": "Telemetry", "back": "Sending data such as an ECG tracing electronically to the hospital or medical control for interpretation."}, {"front": "MDT / MDC", "back": "Mobile data terminal or computer in the rig: shows dispatch info and status buttons, cuts down voice traffic."}, {"front": "Who regulates EMS radio frequencies?", "back": "The FCC (Federal Communications Commission). It licenses frequencies and bans profanity and false info on the air."}, {"front": "Online medical control", "back": "Real-time direction from a physician by radio or phone, such as an order for a medication not covered by standing orders."}, {"front": "Offline (indirect) medical control", "back": "Protocols, standing orders, training and QA set by the medical director. You act without calling first."}, {"front": "Before you speak on the radio", "back": "Listen first to make sure the channel is clear. Press the button, wait about 1 second, then speak."}, {"front": "How to hold and use the mic", "back": "About 2 to 3 inches from your mouth, speak across it at a normal volume, slowly and clearly."}, {"front": "How long should one transmission be?", "back": "Short. Keep each one under about 30 seconds; break long reports up and let the other side acknowledge."}, {"front": "Plain English vs 10-codes", "back": "Use plain English. NIMS recommends plain language, and codes vary between agencies. Avoid slang and jargon."}, {"front": "Yes / no on the radio", "back": "Say \"affirmative\" and \"negative\" (easier to hear than yes and no). Say \"copy\" or \"received\" to acknowledge."}, {"front": "Patient privacy on the radio", "back": "Never say the patient's name or other identifiers. Scanners can hear you (HIPAA). Use age, sex and condition."}, {"front": "What not to say on the radio", "back": "No profanity, no diagnoses you can't confirm, no judgments about the patient, no \"please\" or \"thank you\" chatter."}, {"front": "Echo method", "back": "Repeat a physician's order back word for word (drug, dose, route) before giving it. Confirms it was heard right."}, {"front": "Order that seems wrong or unclear", "back": "Ask the physician to repeat or clarify it. Never carry out an order you think is inappropriate; document it."}, {"front": "Status updates to dispatch", "back": "Call: en route, on scene, patient contact if required, leaving scene/transporting, at hospital, back in service."}, {"front": "Calling dispatch: format", "back": "Call them, then identify yourself: \"Dispatch, Medic 12.\" Wait for \"Medic 12, go ahead,\" then give your message."}, {"front": "Order of the hospital call-in report", "back": "1 Unit ID and level  2 ETA  3 Age and sex  4 Chief complaint  5 HPI  6 Past history  7 Mental status  8 Vitals  9 Exam  10 Care given  11 Response"}, {"front": "Report step 1-2: Unit ID, level, ETA", "back": "\"Mercy General, Medic 12, BLS unit, priority 2, ETA 10 minutes.\""}, {"front": "Report step 3-4: Age, sex, chief complaint", "back": "\"We are transporting a 64-year-old male complaining of chest pain.\""}, {"front": "Report step 5: History of present illness", "back": "\"Onset 30 minutes ago at rest, pressure radiating to the left arm, rated 8 out of 10, with nausea.\""}, {"front": "Report step 6: Pertinent past history", "back": "\"History of hypertension and high cholesterol. Takes lisinopril. No known allergies.\""}, {"front": "Report step 7-8: Mental status and vitals", "back": "\"Alert and oriented times 4. BP 158 over 92, pulse 104 regular, respirations 20, SpO2 95 percent.\""}, {"front": "Report step 9: Pertinent exam findings", "back": "\"Skin pale, cool, diaphoretic. Lungs clear bilaterally. No JVD or edema.\""}, {"front": "Report step 10-11: Care given and response", "back": "\"Gave 324 mg aspirin, assisted with one nitro. Pain now 6 out of 10. Any further orders?\""}, {"front": "Ending a radio report", "back": "Wait for the hospital to acknowledge. Echo any orders, then sign off: \"Medic 12, copy, clear.\""}, {"front": "Verbal report at the hospital (transfer of care)", "back": "Face to face to the nurse or doctor who takes over: name, age, chief complaint, history, findings, care, response and changes en route."}, {"front": "Why give the call-in report?", "back": "It lets the ED prepare the right room, staff and team, such as a stroke or STEMI alert, before you arrive."}]}, {"name": "NREMT · Hospital Types & Destinations", "domain": "Destinations", "cards": [{"front": "Level I trauma center", "back": "Highest level: 24/7 in-house surgeons and all specialists, plus research, teaching and prevention. Handles any injury."}, {"front": "Level II trauma center", "back": "24/7 surgeons and comprehensive trauma care, but without the research and teaching requirements of Level I."}, {"front": "Level III trauma center", "back": "Prompt assessment, resuscitation and emergency surgery; transfers patients who need more to Level I or II."}, {"front": "Level IV trauma center", "back": "Usually rural: advanced trauma life support and stabilization before transfer to a higher-level center."}, {"front": "Level V trauma center (some states)", "back": "Basic ED stabilization and transfer in remote areas. Not every state uses Level V."}, {"front": "Pediatric trauma center", "back": "Verified to care for injured children, with pediatric surgeons and equipment. Many protocols send seriously injured kids here."}, {"front": "Burn center", "back": "Specialized burn care units. Take critical burns, inhalation injury and burns to the face, hands, feet, groin or joints, per protocol."}, {"front": "Comprehensive stroke center", "back": "Highest stroke level: thrombectomy, neurosurgery and neuro ICU 24/7. For large-vessel-occlusion strokes, per protocol."}, {"front": "Thrombectomy-capable stroke center", "back": "Can remove a clot from a large brain artery (endovascular), but has fewer specialty resources than a comprehensive center."}, {"front": "Primary stroke center", "back": "Can diagnose stroke quickly and give clot-busting drugs (thrombolytics); transfers patients needing thrombectomy."}, {"front": "Acute stroke-ready hospital", "back": "Smaller hospital that can assess, give thrombolytics and rapidly transfer. Common in rural areas."}, {"front": "STEMI / PCI center", "back": "Has a 24/7 cardiac cath lab to open blocked coronary arteries. Many systems send STEMI patients straight here."}, {"front": "Perinatal / obstetric center", "back": "Has labor and delivery plus a NICU (levels I to IV). Take high-risk pregnancies or delivering patients here, per protocol."}, {"front": "Hyperbaric center", "back": "Has a hyperbaric oxygen chamber: for diving injuries (decompression sickness, air embolism) and severe CO poisoning."}, {"front": "Critical access hospital", "back": "Small rural hospital (25 beds or fewer) that stabilizes and transfers. May lack specialty services."}, {"front": "Psychiatric / behavioral health facility", "back": "For psychiatric emergencies once the patient is medically cleared. Medical problems usually go to an ED first."}, {"front": "Free-standing emergency department", "back": "ED not attached to a hospital. Limited specialty care and no admission, so check your protocol before transporting there."}, {"front": "Poison Control Center", "back": "Not a hospital: a hotline (US 1-800-222-1222) giving toxicology advice for overdoses and poisonings."}, {"front": "Choosing a destination", "back": "Closest appropriate facility for the patient's condition, using protocol, patient choice, and diversion status."}, {"front": "Hospital diversion", "back": "A hospital temporarily asks EMS to go elsewhere because its ED or a service is full. Unstable patients may still go there, per protocol."}]}];
const FIRE_VIDEOS = [{"id": "fire-01", "topic": "fire", "title": "The Fire Tetrahedron", "creator": "@HoseDaddyHank", "hashtags": ["#firefighter", "#firetetrahedron", "#firescience"], "likes": 48200, "scenes": [{"emoji": "🔺", "heading": "Old triangle, new shape", "text": "The fire triangle had three sides. The fire tetrahedron adds a fourth: the chemical chain reaction."}, {"emoji": "⛽", "heading": "Fuel", "text": "Fuel is anything that burns. Solid, liquid or gas. Remove it, like shutting a gas valve, and the fire starves."}, {"emoji": "🔥", "heading": "Heat", "text": "Heat raises fuel to ignition temperature. Water absorbs heat. Cooling is why a fog or straight stream works."}, {"emoji": "💨", "heading": "Oxygen and chain reaction", "text": "Fire needs oxygen, about 16 percent or more to flame. Break the chain reaction with dry chemical or clean agents."}, {"emoji": "🧠", "heading": "Memory hook", "text": "F-H-O-C: Fuel, Heat, Oxygen, Chain reaction. Pull ANY one leg of the tetrahedron and the fire goes out."}], "quiz": [{"q": "What is the fourth side of the fire tetrahedron?", "choices": ["Pressure", "Chemical chain reaction", "Smoke", "Wind"], "answer": 1, "explain": "The tetrahedron adds an uninhibited chemical chain reaction to fuel, heat and oxygen."}, {"q": "Which method extinguishes fire by removing heat?", "choices": ["Applying water", "Shutting a fuel valve", "Smothering with foam blanket only", "Dry chemical agent"], "answer": 0, "explain": "Water absorbs heat, cooling fuel below ignition temperature."}]}, {"id": "fire-02", "topic": "fire", "title": "Four Stages Before Flashover", "creator": "@FlashoverFran", "hashtags": ["#firefighter", "#flashover", "#firebehavior"], "likes": 63100, "scenes": [{"emoji": "🕯️", "heading": "Incipient", "text": "Stage one: small fire, limited to the first fuel. Best time for an extinguisher or a quick attack."}, {"emoji": "📈", "heading": "Growth", "text": "Fire grows, plume rises, hot gas layer banks down from the ceiling. Te
