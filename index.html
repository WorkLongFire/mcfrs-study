mperatures climb fast."}, {"emoji": "⚡", "heading": "Flashover", "text": "Transition where everything in the room ignites at once. Rollover, heat banking down and rapid temp rise warn you."}, {"emoji": "🌡️", "heading": "Fully developed, then decay", "text": "Flashover leads to fully developed burning. Later, fuel or oxygen runs low and the fire decays."}, {"emoji": "🧠", "heading": "Memory hook", "text": "I-G-F-D: Incipient, Growth, Fully developed, Decay. Flashover is the bridge from growth to fully developed."}], "quiz": [{"q": "Which is a flashover warning sign?", "choices": ["Rollover in the hot gas layer", "Cool walls", "Clear air at the floor only", "Dropping temperatures"], "answer": 0, "explain": "Rollover, heat banking down and rapidly rising temperatures warn of flashover."}, {"q": "Flashover happens between which stages?", "choices": ["Decay and out", "Incipient and growth", "Growth and fully developed", "Fully developed and decay"], "answer": 2, "explain": "Flashover is the transition from growth to fully developed burning."}]}, {"id": "fire-03", "topic": "fire", "title": "Backdraft: Don't Open That Door", "creator": "@SmokeSignalSam", "hashtags": ["#firefighter", "#backdraft", "#ventilation"], "likes": 54700, "scenes": [{"emoji": "🚪", "heading": "What it is", "text": "Backdraft is an explosive ignition when oxygen suddenly enters a hot, oxygen-starved space full of unburned gases."}, {"emoji": "👀", "heading": "Look outside first", "text": "Signs: smoke-stained windows, little visible flame, hot doors and glass. Smoke pushing out then pulling back in."}, {"emoji": "🌬️", "heading": "Pulsing smoke", "text": "Puffing, pulsing smoke at gaps and a whistling sound as air is drawn in are classic indicators."}, {"emoji": "🧯", "heading": "Cool before you open", "text": "Vent vertically at the top first so gases escape. Coordinate with the crew and stay low and out of the door line."}, {"emoji": "🧠", "heading": "Memory hook", "text": "Hot glass, pulsing smoke, little flame, whistle in. If the building is breathing, do NOT swing open the door."}], "quiz": [{"q": "What triggers a backdraft?", "choices": ["Adding oxygen to a starved, superheated space", "Removing fuel", "Cooling the room", "Shutting off power"], "answer": 0, "explain": "Sudden oxygen entry to hot unburned gases causes explosive ignition."}, {"q": "Which is a backdraft sign?", "choices": ["Roaring flames at windows", "Pulsing smoke with air drawn in", "Cold doorknobs", "Clear glass"], "answer": 1, "explain": "Pulsing smoke and air being pulled in indicate a possible backdraft."}]}, {"id": "fire-04", "topic": "fire", "title": "Fire Classes and PASS", "creator": "@ExtinguishErin", "hashtags": ["#firefighter", "#fireclasses", "#extinguisher"], "likes": 39800, "scenes": [{"emoji": "🪵", "heading": "A and B", "text": "Class A: ordinary combustibles like wood and paper. Class B: flammable liquids and gases like gasoline."}, {"emoji": "🔌", "heading": "C and D", "text": "Class C: energized electrical equipment. Class D: combustible metals like magnesium and titanium."}, {"emoji": "🍳", "heading": "Class K", "text": "Class K: cooking oils and fats in commercial kitchens. Wet chemical agents are used for these fires."}, {"emoji": "🧯", "heading": "PASS it", "text": "Pull the pin, Aim at the base, Squeeze the handle, Sweep side to side. Stay a safe distance."}, {"emoji": "🧠", "heading": "Memory hook", "text": "A=Ash, B=Barrel (liquids), C=Current, D=Dangerous metals (magnesium, sodium), K=Kitchen. Then PASS: Pull, Aim, Squeeze, Sweep."}], "quiz": [{"q": "Which class covers cooking oils and fats?", "choices": ["Class B", "Class K", "Class D", "Class C"], "answer": 1, "explain": "Class K fires involve cooking oils and fats."}, {"q": "In PASS, what does the A stand for?", "choices": ["Aim at the base", "Attack the flames", "Activate alarm", "Approach closely"], "answer": 0, "explain": "Aim the extinguisher at the base of the fire."}]}, {"id": "fire-05", "topic": "fire", "title": "SCBA: Own Your Air", "creator": "@AirBossAmir", "hashtags": ["#firefighter", "#SCBA", "#airmanagement"], "likes": 44300, "scenes": [{"emoji": "🎒", "heading": "Check before you go", "text": "Inspect cylinder pressure, regulator, harness and facepiece seal. Do it at shift start, every time."}, {"emoji": "👕", "heading": "Donning methods", "text": "Over-the-head, coat method, seat-mounted. Tighten straps, seal facepiece and check for leaks before entering."}, {"emoji": "⏰", "heading": "Low-air alarm", "text": "The low-air alarm sounds at 33 percent of cylinder capacity (NFPA 1981). Plan to be out before it rings."}, {"emoji": "⚖️", "heading": "Rule of thirds", "text": "Plan air use: one third to go in, one third to get out, one third reserve. Know your consumption."}, {"emoji": "🧠", "heading": "Memory hook", "text": "Alarm at one third, and that third is your reserve. Your air is your lifeline, and nobody else is going to watch your gauge."}], "quiz": [{"q": "At what cylinder level does the low-air alarm activate?", "choices": ["25 percent", "33 percent", "50 percent", "75 percent"], "answer": 1, "explain": "Current NFPA 1981 SCBA alarm at 33 percent. Older units alarmed at 25."}, {"q": "Under the rule of thirds, one third of air is used for what?", "choices": ["Reserve", "Resting", "Overhaul only", "Ventilation"], "answer": 0, "explain": "One third is going in, one third out, one third reserve."}]}, {"id": "fire-06", "topic": "fire", "title": "Mayday LUNAR", "creator": "@MaydayMaya", "hashtags": ["#firefighter", "#mayday", "#LUNAR"], "likes": 71500, "scenes": [{"emoji": "🆘", "heading": "Call it early", "text": "Lost, trapped, out of air or injured? Call Mayday immediately. Delay kills. Say it three times."}, {"emoji": "📻", "heading": "Say it clearly", "text": "Key the radio and say, Mayday, Mayday, Mayday. Command will clear the channel and ask for your info."}, {"emoji": "📍", "heading": "LUNAR report", "text": "Give Location, Unit, Name, Assignment, Resources needed. Short and clear."}, {"emoji": "🔊", "heading": "Make noise", "text": "Activate your PASS device and use a flashlight, tool tapping and voice so rescuers can find you."}, {"emoji": "🧠", "heading": "Memory hook", "text": "LUNAR: Location, Unit, Name, Assignment, Resources. A mayday is no time to be embarrassed, make the call."}], "quiz": [{"q": "What does the R in LUNAR stand for?", "choices": ["Rescue plan", "Resources needed", "Radio channel", "Rank"], "answer": 1, "explain": "LUNAR: Location, Unit, Name, Assignment, Resources needed."}, {"q": "How many times do you say Mayday at first call?", "choices": ["Once", "Twice", "Three times", "Four times"], "answer": 2, "explain": "Say Mayday three times to get priority attention."}]}, {"id": "fire-07", "topic": "fire", "title": "Gear Up: NFPA 1971", "creator": "@TurnoutTerry", "hashtags": ["#firefighter", "#PPE", "#NFPA1971"], "likes": 36900, "scenes": [{"emoji": "🧥", "heading": "The standard", "text": "NFPA 1971 (now part of NFPA 1970) covers structural firefighting ensembles: coat, pants, helmet, gloves, boots and hood."}, {"emoji": "🧅", "heading": "Three layers", "text": "Coat and pants have an outer shell, a moisture barrier and a thermal liner. Layers trap insulating air."}, {"emoji": "🧢", "heading": "No skin showing", "text": "Hood closes the gap between helmet, collar and facepiece. Gloves overlap coat sleeves. Cover everything."}, {"emoji": "🧼", "heading": "Care counts", "text": "Dirty or damaged gear loses protection. NFPA 1851 (now in NFPA 1850) covers inspection, cleaning and repair. Clean after fires."}, {"emoji": "🧠", "heading": "Memory hook", "text": "1971 is for the gear, 1981 is for SCBA. Three layers: shell, barrier, liner. Wear all of it, all the time."}], "quiz": [{"q": "Which NFPA standard covers structural firefighting protective ensembles?", "choices": ["NFPA 1981", "NFPA 1971", "NFPA 1001", "NFPA 704"], "answer": 1, "explain": "NFPA 1971 sets requirements for structural firefighting ensembles. It is now consolidated into NFPA 1970."}, {"q": "Which is a layer of turnout coats?", "choices": ["Moisture barrier", "Rubber core", "Steel mesh", "Foam liner"], "answer": 0, "explain": "Turnout gear has an outer shell, moisture barrier and thermal liner."}]}, {"id": "fire-08", "topic": "fire", "title": "Ladder Angle 75 Degrees", "creator": "@RungsRay", "hashtags": ["#firefighter", "#ladders", "#fireground"], "likes": 28400, "scenes": [{"emoji": "📐", "heading": "The magic angle", "text": "A properly placed ground ladder sits at about 75 degrees. Strong, stable and good for climbing."}, {"emoji": "📏", "heading": "The 4:1 rule", "text": "Place the base out one quarter of the working length: about one foot out for every four feet up."}, {"emoji": "🏠", "heading": "Roof access", "text": "For roof access, extend the ladder tip three to five rungs above the roofline so you can step on and off."}, {"emoji": "🦺", "heading": "Safe footing", "text": "Lock the pawls, tie off the halyard, level the base, check for wires, and always have a firefighter foot the ladder."}, {"emoji": "🧠", "heading": "Memory hook", "text": "75 and 4:1. One foot out per four feet up, and three to five rungs above the roof. Easy."}], "quiz": [{"q": "What is the proper placement angle for a ground ladder?", "choices": ["45 degrees", "60 degrees", "75 degrees", "90 degrees"], "answer": 2, "explain": "Ground ladders are placed at about 75 degrees."}, {"q": "Under the 4:1 rule, how far out for 20 feet of working length?", "choices": ["5 feet", "4 feet", "10 feet", "20 feet"], "answer": 0, "explain": "20 divided by 4 is 5 feet from the wall."}]}, {"id": "fire-09", "topic": "fire", "title": "Hose, Nozzles and GPM", "creator": "@NozzleNate", "hashtags": ["#firefighter", "#hose", "#nozzles"], "likes": 41200, "scenes": [{"emoji": "🧵", "heading": "Hose sizes", "text": "Attack lines are often 1 3/4 inch. Larger handlines are 2 1/2 inch. Large-diameter hose supplies water."}, {"emoji": "💧", "heading": "GPM matters", "text": "Flow is measured in gallons per minute. A 1 3/4 inch line commonly flows roughly 150 to 200 GPM."}, {"emoji": "🎯", "heading": "Smooth bore", "text": "Smooth bore nozzles run around 50 psi at the nozzle for handlines. Reach is solid and penetrating."}, {"emoji": "🌫️", "heading": "Fog nozzle", "text": "Fog nozzles often operate at 100 psi and can adjust pattern from straight stream to wide fog."}, {"emoji": "🧠", "heading": "Memory hook", "text": "Smooth bore: 50 psi. Fog: 100 psi. Big pipe, big GPM, big nozzle reaction. Brace and bleed air first."}], "quiz": [{"q": "What nozzle pressure is typical for a handline smooth bore nozzle?", "choices": ["25 psi", "50 psi", "100 psi", "150 psi"], "answer": 1, "explain": "Handline smooth bore nozzles are commonly operated at 50 psi."}, {"q": "What does GPM measure?", "choices": ["Gallons per minute", "Gauge pressure marker", "Gas pressure meter", "Ground pump mode"], "answer": 0, "explain": "GPM is gallons per minute, the flow rate."}]}, {"id": "fire-10", "topic": "fire", "title": "Building Construction I to V", "creator": "@BlueprintBea", "hashtags": ["#firefighter", "#construction", "#buildings"], "likes": 33500, "scenes": [{"emoji": "🏢", "heading": "Type I", "text": "Type I is fire resistive: concrete and protected steel. Highest resistance to collapse."}, {"emoji": "🏭", "heading": "Type II", "text": "Type II is noncombustible: unprotected metal and masonry. Steel can fail fast in fire."}, {"emoji": "🧱", "heading": "Type III", "text": "Type III is ordinary construction: masonry exterior walls with wood floors and roof. Watch for hidden voids."}, {"emoji": "🪵", "heading": "Type IV and V", "text": "Type IV is heavy timber with large wood members. Type V is wood frame, like most houses."}, {"emoji": "🧠", "heading": "Memory hook", "text": "I Fire-resistive, II Noncombustible, III Ordinary, IV Heavy timber, V Wood frame. Fiery Nachos Offer Hot Wings."}], "quiz": [{"q": "Which type is wood frame construction?", "choices": ["Type II", "Type III", "Type IV", "Type V"], "answer": 3, "explain": "Type V is wood frame, commonly found in houses."}, {"q": "Type III ordinary construction has what feature?", "choices": ["All wood", "Masonry exterior with wood interior", "Reinforced concrete", "Steel only"], "answer": 1, "explain": "Ordinary construction has masonry exterior walls and wood interior elements."}]}, {"id": "fire-11", "topic": "fire", "title": "Ventilation and Flow Path", "creator": "@VentVince", "hashtags": ["#firefighter", "#ventilation", "#flowpath"], "likes": 59200, "scenes": [{"emoji": "🌬️", "heading": "Fire follows air", "text": "Fresh air comes in low at the inlet. Heat and smoke flow out the exhaust. That route is the flow path, and fire travels it."}, {"emoji": "🚪", "heading": "Doors are tools", "text": "Closed doors limit air and slow fire growth. Control doors when you can, and close them behind you."}, {"emoji": "🪟", "heading": "Coordinate vent", "text": "Ventilation without a hoseline ready can make fire grow. Time vent with attack and stay out of the flow path."}, {"emoji": "🌀", "heading": "Vertical or horizontal", "text": "Vertical ventilation uses roof openings. Horizontal uses windows and doors, sometimes with fans like PPV."}, {"emoji": "🧠", "heading": "Memory hook", "text": "Fire follows air. Coordinate, cool, then vent. Never vent without a plan and a hoseline."}], "quiz": [{"q": "What is the flow path?", "choices": ["Route from inlet to exhaust", "Path of the supply hose", "Smoke detector zone", "Ladder route"], "answer": 0, "explain": "Flow path runs from inlet openings to exhaust openings."}, {"q": "Why coordinate ventilation with attack?", "choices": ["Reduce noise", "Vent can feed fire growth", "Save water", "Reduce paperwork"], "answer": 1, "explain": "Adding air can intensify fire, so vent with a hoseline ready."}]}, {"id": "fire-12", "topic": "fire", "title": "Search Smart and RIT", "creator": "@SearchSusie", "hashtags": ["#firefighter", "#search", "#RIT /* NREMT decks → built-in feed clips (4 cards per clip, hook + 4 scenes, 2 quiz questions) */
(function(){
  const EMO={Airway:"🫁",Cardiology:"🫀",Trauma:"🩸",Medical:"💊","OB/Peds":"👶",Operations:"🚑",Foundations:"📘",Communication:"📻",Destinations:"🏥"};
  const HANDLE={Airway:"@nremt.airway",Cardiology:"@nremt.cardio",Trauma:"@nremt.trauma",Medical:"@nremt.medical","OB/Peds":"@nremt.obpeds",Operations:"@nremt.ops",Foundations:"@nremt.basics",Communication:"@nremt.radio",Destinations:"@nremt.destinations"};
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const mix=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const slug=s=>s.toLowerCase().replace(/^nremt\s*·\s*/,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  NREMT_DECKS.forEach((d,di)=>{
    d.id="nremt-"+slug(d.name);d.topic="emt";d.sample=true;
    const short=d.name.replace(/^NREMT\s*·\s*/,"");
    const parts=Math.ceil(d.cards.length/4);
    for(let p=0;p<parts;p++){
      const cards=d.cards.slice(p*4,p*4+4);if(cards.length<2)continue;cards.forEach(c=>c._vid=`${d.id}-${p+1}`);
      const others=d.cards.filter(c=>!cards.includes(c));
      const scenes=[{emoji:EMO[d.domain]||"📋",heading:`${short}${parts>1?` · ${p+1}/${parts}`:""}`,text:`${cards.length} NREMT must-knows. Say each answer out loud before you read it.`}]
        .concat(cards.map(c=>({emoji:EMO[d.domain]||"📋",heading:c.front,text:c.back})));
      const quiz=cards.slice(0,2).map(c=>{
        const pool=(others.length>=3?others:d.cards.filter(x=>x!==c)).map(x=>x.back).filter(b=>b!==c.back);
        const choices=mix([c.back,...mix(pool).slice(0,3)]);
        return {q:/\?$/.test(c.front)?c.front:`Which best matches “${c.front}”?`,choices,answer:choices.indexOf(c.back),explain:`${c.front}: ${c.back}`};
      }).filter(q=>q.choices.length===4);
      EMT_VIDEOS.push({id:`${d.id}-${p+1}`,topic:"emt",nremt:true,title:`NREMT ${short}${parts>1?` (part ${p+1})`:""}`,creator:HANDLE[d.domain]||"@nremt.prep",
        hashtags:["#nremt","#emt","#"+slug(d.domain||"emt").replace(/-/g,"")],
        likes:1200+Math.floor(rnd()*40000),scenes,quiz});
    }
  });
  // round-robin the NREMT clips across decks so the feed mixes topics
  const hand=EMT_VIDEOS.filter(v=>!v.nremt),buckets={};
  EMT_VIDEOS.filter(v=>v.nremt).forEach(v=>{const k=v.id.replace(/-\d+$/,"");(buckets[k]=buckets[k]||[]).push(v)});
  const lists=Object.values(buckets),mixed=[];
  for(let i=0;lists.some(l=>l.length>i);i++)lists.forEach(l=>{if(l[i])mixed.push(l[i])});
  EMT_VIDEOS.length=0;EMT_VIDEOS.push(...hand,...mixed);
})();
</script>
<script>
(function(){
"use strict";
window.SR_STANDALONE=!(window.claude&&window.claude.use); // launched outside claude.ai: use on-device alternatives
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SCENE_MS=4200;
const store={get(k,d){try{const v=localStorage.getItem("sr:"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("sr:"+k,JSON.stringify(v))}catch(e){}}};

const S={
  topic:"emt", view:"feed",
  watched:new Set(),             // this session only: since opening the app
  liked:new Set(store.get("liked",[])),
  sound:store.get("sound",true)!==false, unlocked:false,
  creations:[], localCreations:store.get("localCreations",[]),
  chat:[], comments:[], scores:[],
  me:null, myId:null, names:{}, avatars:{},
  db:null, user:null, tts:null, sample:null, dbState:"loading"
};
const LOCAL_VIDEO={};
const VDB={open(){return this.p||(this.p=new Promise((res,rej)=>{try{const r=indexedDB.open("shift-ready",1);r.onupgradeneeded=()=>r.result.createObjectStore("videos");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))},
  async put(k,b){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("videos","readwrite");t.objectStore("videos").put(b,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  async del(k){const db=await this.open();return new Promise(res=>{const t=db.transaction("videos","readwrite");t.objectStore("videos").delete(k);t.oncomplete=()=>res();t.onerror=()=>res()})},
  async all(){const db=await this.open();return new Promise((res,rej)=>{const out={};const r=db.transaction("videos").objectStore("videos").openCursor();r.onsuccess=()=>{const c=r.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};r.onerror=()=>rej(r.error)})}};
const BUILTIN=[...EMT_VIDEOS,...FIRE_VIDEOS];

function allVideos(){
  const mine=S.localCreations.map(c=>({...c,ugc:true,local:true,videoUrl:LOCAL_VIDEO[c.id]||null}));
  const shared=S.creations.map(c=>({...c,ugc:true}));
  return [...shared,...mine,...ulVideos(),...BUILTIN];
}
function byId(id){return allVideos().find(v=>v.id===id)}
function creatorName(v){ if(v.authorId) return "@"+((S.names[v.authorId]||"crew member").toLowerCase().replace(/\s+/g,"")); return v.creator||"@crew"; }
function fmt(n){n=+n||0;return n>=1000?(n/1000).toFixed(n>=10000?0:1)+"K":String(n)}
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return"now";if(s<3600)return Math.floor(s/60)+"m";if(s<86400)return Math.floor(s/3600)+"h";return Math.floor(s/86400)+"d"}
const COLORS=["#3d8bff","#ff5a1f","#9b5cff","#2fd28a","#ffb020","#ff4d9a","#1fc8db"];
function colorFor(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))|0;return COLORS[Math.abs(h)%COLORS.length]}
function avatarHTML(id,cls="av"){const n=S.names[id]||"?";const a=S.avatars[id];return `<div class="${cls}" style="background:${colorFor(id)}">${a?`<img src="${esc(a)}" alt="">`:esc(n.trim().charAt(0).toUpperCase()||"?")}</div>`}

let toastT;
function toast(msg){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");$("#app").appendChild(t)}t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2400)}

/* ---------- topic + nav ---------- */
function setTopic(t){
  S.feedFilter=null;
  S.topic=t;document.documentElement.dataset.topic=t;
  $("#tEmt").setAttribute("aria-pressed",t==="emt");$("#tFire").setAttribute("aria-pressed",t==="fire");
  store.set("topic",t);
  if(S.view==="feed")renderFeed(); else renderView(S.view);
}
$("#modeBtn").onclick=openFocusSheet;$("#focusPill").onclick=openFocusSheet;
$("#tEmt").onclick=()=>setTopic("emt");$("#tFire").onclick=()=>setTopic("fire");
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>show(b.dataset.view));
function show(v){
  S.view=v;
  document.querySelectorAll("nav.tabs button").forEach(b=>{if(b.dataset.view===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  ["feed","search","create","learn","quiz","squad"].forEach(id=>$("#"+id).hidden=id!==v);
  $("#topbar").hidden=!(v==="feed");
  if(v!=="feed")stopPlayer();
  if(v!=="create"){stopScriptPlay();clearInterval(prevTimer)}
  if(v==="feed"){ if(!$("#feed").children.length)renderFeed(); else resumeVisible(); }
  else renderView(v);
}
function renderView(v){({search:renderSearch,create:renderCreate,quiz:renderQuiz,squad:renderSquad,learn:renderLearn,feed:renderFeed})[v]()}

/* ---------- sound ---------- */
$("#soundBtn").onclick=()=>{S.sound=!S.sound;S.unlocked=true;$("#unmute")?.remove();store.set("sound",S.sound);{const vd=P.el&&P.el.querySelector("video.vbg");if(vd)vd.muted=!S.sound}$("#soundBtn").textContent=S.sound?"🔊 Sound":"🔇 Sound";$("#soundBtn").setAttribute("aria-pressed",S.sound);if(!S.sound)hush();playerSoundChanged()};
function say(text,force){
  if(!S.sound&&!force)return Promise.resolve();
  hush(); // one voice at a time
  if(S.tts) return S.tts.speak(text,{rate:1.08}).catch(()=>{});
  try{ if("speechSynthesis" in window){ return new Promise(res=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=1.05;u.onend=res;u.onerror=res;speechSynthesis.speak(u);setTimeout(res,12000)}) } }catch(e){}
  return Promise.resolve();
}
function hush(){try{S.tts&&S.tts.stop()}catch(e){}try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}}

/* ---------- clip rendering ---------- */
function bgDecor(topic){
  if(topic==="emt") return `<svg class="ecg" viewBox="0 0 600 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0 50 H170 L185 50 L195 20 L205 70 L215 8 L228 62 L238 50 H360 L372 44 L384 50 H600"/></svg>`;
  let s="";for(let i=0;i<9;i++)s+=`<span class="ember" style="left:${8+i*10.5}%;animation-delay:${(i*0.47).toFixed(2)}s;animation-duration:${3.2+(i%4)*0.6}s"></span>`;return s;
}
function clipHTML(v,opts={}){
  const liked=S.liked.has(v.id);
  const cCount=S.comments.filter(c=>c.videoId===v.id).length;
  const base=v.likes||0;
  return `<article class="clip${v.videoUrl?" has-video":""}" data-id="${esc(v.id)}" data-topic="${esc(v.topic)}">
    <div class="bg">${v.videoUrl?`<video class="vbg" src="${esc(v.videoUrl)}" muted playsinline loop preload="metadata"></video>`:bgDecor(v.topic)}</div>
    ${opts.preview?`<div class="bars">${v.scenes.map(()=>`<span><i></i></span>`).join("")}</div>`:`<div class="tl" role="slider" tabindex="0" aria-label="Seek video" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="tl-track"><i class="tl-fill"></i><b class="tl-knob"></b></div></div><span class="tl-time">0:00 / ${fmtTime(v.scenes.reduce((a,sc)=>a+sceneDur(sc),0))}</span>`}
    ${progressChip(v.id)}
    <div class="stage"></div>
    <div class="paused-badge">▶</div>
    <div class="meta">
      <div class="who">${esc(creatorName(v))} <span class="tag">${v.topic==="emt"?"EMT":v.topic==="fire"?"FIRE":esc(String(v.topicLabel||"Topic").toUpperCase())}${v.nremt?" · NREMT":""}${v.ulSet||v.ulFix?" · YOUR UPLOAD":""}${v.ugc?" · CREW MADE":""}</span></div>
      <div class="ttl">${esc(v.title)}</div>
      <div class="hs">${(v.hashtags||[]).map(esc).join(" ")}</div>
    </div>
    ${opts.preview?"":`<div class="rail">
      <div class="avatar" style="background:${colorFor(v.authorId||v.creator)}" aria-hidden="true">${esc((creatorName(v).replace("@","")[0]||"?").toUpperCase())}</div>
      <button data-act="like" class="${liked?"on":""}" aria-label="Like"><span class="ic">❤️</span>${fmt(base+(liked?1:0))}</button>
      <button data-act="comments" aria-label="Comments"><span class="ic">💬</span>${cCount}</button>
      <button data-act="share" aria-label="Share with squad"><span class="ic">↗️</span>Share</button>
      <button data-act="quizme" aria-label="Quiz me on this"><span class="ic">🧠</span>Quiz</button>
      <button data-act="tune" aria-label="More, less, already know, review later"><span class="ic">${(PR[v.id]||{}).later?"🔖":"⋯"}</span>Tune</button>
      ${v.ulSet||v.ulFix?`<button data-act="source" aria-label="Show source"><span class="ic">📎</span>Source</button>`:""}
    </div>`}
  </article>`;
}

/* ---------- player: each clip plays as one continuous video ---------- */
const P={el:null,v:null,idx:-1,paused:false,token:0,raf:0,elapsed:0,last:0,durs:[],starts:[],total:1,seen:new Set(),speaking:false,seeking:false};
function sceneDur(sc){
  const w=String(sc.text||"").split(/\s+/).filter(Boolean).length,h=String(sc.heading||"").split(/\s+/).filter(Boolean).length;
  return S.sound&&!(P.el&&P.el.querySelector("video.vbg"))?Math.max(3500,Math.min(15000,(w+h)*390+900)):Math.max(SCENE_MS,Math.min(9000,w*230+1200));
}
function planClip(){
  P.durs=P.v.scenes.map(sceneDur);P.starts=[];let t=0;P.durs.forEach(d=>{P.starts.push(t);t+=d});P.total=t||1;
  const tt=P.el.querySelector(".tl-time");if(tt)tt.dataset.total=fmtTime(P.total);
}
const fmtTime=ms=>{const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const sceneAt=ms=>{let i=0;while(i<P.starts.length-1&&ms>=P.starts[i+1])i++;return i};
function sceneMarkup(v,i){
  const sc=v.scenes[i];
  return `<div class="scene-emoji" aria-hidden="true">${esc(sc.emoji)}</div><div class="scene-tag">${i===0?"🎯 GOAL · "+esc(trunc(v.objective||v.title,44)):v.ulSet||v.ulFix?"FROM YOUR UPLOAD":v.topic==="emt"?"PATIENT CARE":v.topic==="fire"?"FIREGROUND":"STUDY"}</div><h2 class="scene-head${String(sc.heading).length>30?" long":""}">${esc(sc.heading)}</h2><p class="scene-text">${esc(sc.text)}</p>${sc.img&&/^data:image\//.test(sc.img)?`<img class="scene-img" src="${esc(sc.img)}" alt="Your uploaded source">`:""}`;
}
function renderScene(i,instant){
  const {el,v}=P;const stage=el.querySelector(".stage");
  stage.querySelectorAll(".layer").forEach(l=>{if(instant){l.remove();return}l.classList.remove("in");l.classList.add("out");setTimeout(()=>l.remove(),450)});
  const L=document.createElement("div");L.className="layer"+(instant?"":" in");L.innerHTML=sceneMarkup(v,i);stage.appendChild(L);
}
function speakScene(i){
  P.speaking=false;
  if(!S.sound||P.el.querySelector("video.vbg"))return;
  const sc=P.v.scenes[i],tok=++P.token;P.speaking=true;

function relatedBuiltins(sets){
  const words=new Set();sets.forEach(s=>ulEligible(s).forEach(c=>ulTok(c.front+" "+c.back).forEach(w=>words.add(w))));
  if(!words.size)return [];
  if(!relDocs){relDocs=BUILTIN.map(v=>({v,t:new Set(ulTok(v.title+" "+(v.hashtags||[]).join(" ")+" "+v.scenes.map(s=>s.heading+" "+s.text).join(" ")))}));relDocs.df={};relDocs.forEach(d=>d.t.forEach(w=>relDocs.df[w]=(relDocs.df[w]||0)+1))}
  const lim=Math.max(3,relDocs.length*0.08); // ignore words common to many clips ("patient", "signs")
  return relDocs.map(d=>{let s=0;d.t.forEach(w=>{if(words.has(w)&&relDocs.df[w]<=lim)s++});return{v:d.v,s}}).filter(x=>x.s>=3).sort((a,b)=>b.s-a.s).slice(0,25).map(x=>x.v);
}
function feedRank(list){
  const GEN=/^#(emt|nremt|firefighter|fire|uploadlearn|studytok)$/;
  const tagsOf=v=>(v.hashtags||[]).map(h=>h.toLowerCase()).filter(t=>!GEN.test(t));
  const more=new Set(),less=new Set();
  for(const id in PR){const p=PR[id];if(p.pref!=="more"&&p.pref!=="less")continue;const v=byId(id);if(v)tagsOf(v).forEach(t=>(p.pref==="more"?more:less).add(t))}
  const day=new Date().toDateString();
  const jit=id=>{let h=0;for(const c of id+day)h=(h*31+c.charCodeAt(0))|0;return (Math.abs(h)%1000)/1000}; // stable per day, so re-renders don't reshuffle
  return list.filter(v=>(PR[v.id]||{}).pref!=="known").map(v=>{const p=PR[v.id]||{};let s=jit(v.id);
    if(!p.done)s+=3;else if(prUnderstood(v.id))s-=3;else s+=0.5;
    if(p.last==="wrong")s+=4;if(p.later)s+=3.5;if(p.pref==="more")s+=1;if(p.pref==="less")s-=4;if(v.ulSet)s+=1;
    tagsOf(v).forEach(t=>{if(more.has(t))s+=1.5;if(less.has(t))s-=1.5});
    return{v,s}}).sort((a,b)=>b.s-a.s).map(x=>x.v);
}

/* parse "front<sep>back" lines: tab, |, ;, " - ", " – ", ":" or the first comma */
function parseCards(txt){
  const out=[];
  String(txt).split(/\r?\n/).forEach(line=>{
    line=line.trim();if(!line||/^front\s*[,\t;|]\s*back$/i.test(line))return;
    let m=null;
    for(const sep of ["\t"," | ","|",";"," - "," – "," — ",": ",","]){const i=line.indexOf(sep);if(i>0){m=[line.slice(0,i),line.slice(i+sep.length)];break}}
    if(!m)return;
    const clean=s=>s.trim().replace(/^"(.*)"$/,"$1").trim();
    const f=clean(m[0]),b=clean(m[1]);if(f&&b)out.push({front:f.slice(0,120),back:b.slice(0,200)});
  });
  return out.slice(0,40);
}

async function scriptPlay(){

  const el=$("#create");

  if(!ST||ST.deckId!==selDeck)ST=d?{deckId:d.id,order:d.cards.map((_,i)=>i),i:0,flip:false,known:0,again:[]}:null;
  const done=ST&&ST.i>=ST.order.length;
  const c=d&&!done?d.cards[ST.order[ST.i]]:null;
  el.innerHTML=`<h1 class="vh">Study cards</h1>${createSeg()}
   <div class="chips" id="deckChips">${decks.map(x=>`<button class="chip" data-d="${esc(x.id)}" aria-pressed="${x.id===selDeck}">${x.topic==="emt"?"🚑":x.topic==="fire"?"🚒":"📥"} ${esc(x.name)}</button>`).join("")}</div>
   ${!d?`<div class="empty"><div class="big">🗂️</div>No decks yet. Import cards in “From flashcards”.</div>`:
   done?`<div class="card stack" style="margin-top:14px;text-align:center"><div class="score">${ST.known}/${ST.order.length}</div><p class="sub" style="margin:0">known on the first try</p>
      ${ST.again.length?`<button class="btn" id="stAgain">Review ${ST.again.length} missed</button>`:""}<button class="btn ghost" id="stRestart">Restart deck</button><button class="btn ghost" id="stVideo">Turn this deck into a video</button></div>`:
   `<div class="qprog" style="margin-top:14px"><span>CARD ${ST.i+1}/${ST.order.length}</span><span>KNOWN ${ST.known}</span></div>
    <button class="fcard ${ST.flip?"flipped":""}" id="fcard" aria-label="Flip card"><span class="side-l">${ST.flip?"BACK":"FRONT"}</span><span class="fc-text">${esc(ST.flip?c.back:c.front)}</span><span class="note">${ST.flip?"":"Tap to flip"}</span></button>
    <div class="row2">${ST.flip?`<button class="btn ghost" id="stMiss">↺ Again</button><button class="btn" id="stGot">✓ Got it</button>`:`<button class="btn ghost" id="stShuffle">Shuffle</button><button class="btn" id="stFlip">Flip</button>`}</div>`}`;
  bindSeg();

  const on=(id,f)=>{const b=$("#"+id);if(b)b.onclick=f};
  const flip=()=>{ST.flip=!ST.flip;renderStudy()};
  on("fcard",flip);on("stFlip",flip);
  on("stShuffle",()=>{ST.order=shuffle(ST.order);ST.i=0;ST.known=0;ST.again=[];renderStudy();toast("Shuffled")});
  on("stGot",()=>{ST.known++;ST.i++;ST.flip=false;renderStudy()});
  on("stMiss",()=>{ST.again.push(ST.order[ST.i]);ST.i++;ST.flip=false;renderStudy()});
  on("stAgain",()=>{ST={...ST,order:ST.again,i:0,flip:false,known:0,again:[]};renderStudy()});
  on("stRestart",()=>{ST=null;renderStudy()});
  on("stVideo",()=>{cMode="cards";store.set("cMode",cMode);renderCreate()});
}

    if(b.exists){let rs={};try{rs=JSON.parse((b.data()||{}).stats||"{}")}catch(e){}

/* Quizlet / text parser: one card per line, term<sep>definition */
function ulParse(text){
  let rows=String(text||"").replace(/\r/g,"").split("\n");
  if(rows.filter(r=>r.trim()).length<=1&&/;/.test(text))rows=String(text).split(";");
  const cards=[],left=[];
  rows.forEach((raw,ln)=>{const line=raw.trim();if(!line)return;if(/^(term|front)\s*[\t,;|]\s*(definition|back)$/i.test(line))return;
    let m=null;for(const sep of ["\t"," | ","|"," - "," – "," — ",": ",";",","]){const i=line.indexOf(sep);if(i>0&&i<line.length-sep.length){m=[line.slice(0,i),line.slice(i+sep.length)];break}}
    const clean=s=>s.trim().replace(/^"(.*)"$/,"$1").replace(/""/g,'"').trim();
    if(m&&clean(m[0])&&clean(m[1]))cards.push({front:clean(m[0]).slice(0,160),back:clean(m[1]).slice(0,400),line:ln});else left.push(line);
  });
  return {cards:cards.slice(0,300),left};
}

/* builtin facts to compare numbers against (flags only; never auto-changes the upload) */
let ulBuiltinMap=null;
function ulBuiltin(topic){
  if(!ulBuiltinMap){ulBuiltinMap={emt:new Map(),fire:new Map()};
    [...NREMT_DECKS,...SAMPLE_DECKS].forEach(d=>(d.cards||[]).forEach(c=>{const m=ulBuiltinMap[d.topic==="fire"?"fire":"emt"];m.set(ulNorm(c.front),{back:c.back,deck:d.name})}));}
  return ulBuiltinMap[topic]||new Map();
}
function ulFlag(set){
  const byFront={};set.cards.forEach(c=>{const k=ulNorm(c.front);(byFront[k]=byFront[k]||[]).push(c)});
  const src=Object.fromEntries((set.sources||[]).map(s=>[s.id,s.text||""]));
  const bi=ulBuiltin(set.topic);
  set.cards.forEach(c=>{
    const f=[];
    if(/\[\?\]|\?\?|\uFFFD/.test(c.front+c.back))f.push({kind:"unclear",msg:"Has unreadable text marked [?]"});
    if(!c.front.trim()||c.back.trim().length<2)f.push({kind:"unclear",msg:"Missing a term or a definition"});
    else if(ulNorm(c.front)===ulNorm(c.back))f.push({kind:"unclear",msg:"Term and definition are the same"});
    const twins=(byFront[ulNorm(c.front)]||[]).filter(o=>o!==c&&ulNorm(o.back)!==ulNorm(c.back));
    if(twins.length)f.push({kind:"conflict",msg:`Your upload defines this ${twins.length+1} different ways`});
    if(c.origin==="claude"&&src[c.sourceId]!=null&&ulGrounding(c,src[c.sourceId])<0.85)f.push({kind:"unsupported",msg:"Some words aren't in your upload. Check it against the source"});
    if(c.aiFlag)f.push({kind:"unclear",msg:"Claude flagged: "+String(c.aiFlag).slice(0,80)});
    const b=bi.get(ulNorm(c.front));
    if(b){const a=ulNums(c.back),n=ulNums(b.back);if(a.length&&n.length&&!a.some(x=>n.includes(x)))f.push({kind:"conflict",msg:`Numbers differ from the built-in “${b.deck.replace(/^NREMT · /,"")}” deck: ${b.back}`})}
    c.flags=f;
  });
  set.updatedAt=Date.now();
}
const ulEligible=set=>set.cards.filter(c=>!c.excluded&&(!(c.flags||[]).length||c.reviewed));
const ulNeedsReview=set=>set.cards.filter(c=>!c.excluded&&(c.flags||[]).length&&!c.reviewed);

function ulQuestion(set,c,pool,dir){

    explain:`From your upload (${set.name}, card ${idx}): ${c.front}: ${c.back}`,src:{set:set.id,card:c.id},topicLabel:ulTopicLabel(set),ulq:true};
}

async function ulBuildCards(){

    catch(e){toast(e&&e.code==="rate_limited"?"Claude is busy. Edit the leftover lines by hand.":"Couldn't split the leftover lines. Add a dash between term and definition.")}

}

   <div class="card stack" style="margin-top:12px">
     <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="lbl" style="margin:0">${ok} cards ready${nr?` · <span class="warn">⚠️ ${nr} need review</span>`:""}</span>
       <div class="chips"><button class="chip" data-show="all" aria-pressed="${ulShowFilter==="all"}">All ${W.cards.length}</button><button class="chip" data-show="flag" aria-pressed="${ulShowFilter==="flag"}">Needs review ${nr}</button></div></div>
     ${W.splitting?`<p class="note">✨ Claude is splitting ${W.left.reduce((a,l)=>a+l.lines.length,0)} leftover lines into cards using only your words…</p>`:""}
     ${W.left.length&&!W.splitting?`<div class="note warn">These lines didn't become cards. Go back and put a dash between term and definition:<br>${W.left.flatMap(l=>l.lines).slice(0,8).map(x=>"• "+esc(trunc(x,90))).join("<br>")}</div>`:""}
     <p class="note">⚠️ cards are left out of clips and quizzes until you edit them or tap “Looks right”. Nothing is added beyond your text.</p>
     <div class="stack" id="ulCards">${list.map(({c,i})=>`<div class="ulc ${(c.flags||[]).length&&!c.reviewed?"flag":""} ${c.excluded?"off":""}" data-i="${i}">
        <div class="ulc-top"><span class="lbl" style="margin:0">Card ${i+1} · ${esc(srcName(c.sourceId))}${c.origin==="claude"?" · split by Claude":""}</span><span><button class="chip" data-src-i="${i}" aria-label="Show source">📎</button> <button class="chip" data-x="${i}">${c.excluded?"Include":"Exclude"}</button></span></div>
        <input data-f="front" maxlength="160" value="${esc(c.front)}" aria-label="Card ${i+1} term">
        <textarea data-f="back" maxlength="400" rows="2" aria-label="Card ${i+1} definition">${esc(c.back)}</textarea>
        ${(c.flags||[]).length?`<div class="ulflag">${c.flags.map(f=>`⚠️ ${esc(f.msg)}`).join("<br>")} ${c.reviewed?`<span class="okc">✓ reviewed</span>`:`<button class="chip" data-ok="${i}">Looks right</button>`}</div>`:""}
      </div>`).join("")||`<p class="note">Nothing to show here.</p>`}</div>
     <button class="btn ghost" id="ulAddCard">+ Add card</button>
   </div>
   <div class="row2" style="margin-top:12px"><button class="btn ghost" id="ulBack3">${W.editSet?"Cancel":"Back"}</button><button class="btn" id="ulCreate" ${ok&&!W.splitting?"":"disabled"}>${W.editSet?"Save changes":"Create clips & quiz"}</button></div>`;
  $("#ulTopic").value=W.topic;
  $("#ulName").oninput=e=>W.name=e.target.value;
  $("#ulTopic").onchange=e=>{W.topic=e.target.value;$("#ulTopicWrap").hidden=W.topic!=="custom";ulFlag(W);renderLearn()};
  const tl=$("#ulTopicLabel");if(tl)tl.oninput=e=>W.topicLabel=e.target.value;
  const dk=$("#ulDeck");if(dk)dk.onchange=e=>W.addDeck=e.target.checked;
  const fk=$("#ulFocus");if(fk)fk.onchange=e=>W.focus=e.target.checked;
  el.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{ulShowFilter=b.dataset.show;renderLearn()});
  const box=$("#ulCards");
  box.oninput=e=>{const row=e.target.closest(".ulc");if(!row||!e.target.dataset.f)return;const c=W.cards[+row.dataset.i];c[e.target.dataset.f]=e.target.value;c.edited=true};
  box.onchange=e=>{const row=e.target.closest(".ulc");if(!row||!e.target.dataset.f)return;const c=W.cards[+row.dataset.i];c.reviewed=false;if(c.origin==="claude")c.origin="edited";c.aiFlag="";ulFlag(W);renderLearn()};
  box.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.ok!=null){W.cards[+b.dataset.ok].reviewed=true;renderLearn()}
    if(b.dataset.x!=null){const c=W.cards[+b.dataset.x];c.excluded=!c.excluded;renderLearn()}
    if(b.dataset.srcI!=null){const c=W.cards[+b.dataset.srcI];const s=(W.sources||[]).find(x=>x.id===c.sourceId)||{};
      sheet(`<h3>Source</h3><div class="card stack"><span class="lbl">${esc(s.name||"source")}</span>${s.thumb||ulThumb(s.id)?`<img class="src-img" src="${esc(s.thumb||ulThumb(s.id))}" alt="Your photo">`:""}<div class="excerpt">${ulExcerpt(s.text||"",c.front)}</div></div><button class="btn ghost" data-close>Close</button>`)}
  };
  $("#ulAddCard").onclick=()=>{W.cards.push({id:ulId(),front:"",back:"",sourceId:(W.sources||[{}])[0].id,origin:"typed"});ulFlag(W);ulShowFilter="all";renderLearn();const ins=el.querySelectorAll('#ulCards input[data-f="front"]');ins[ins.length-1].focus()};
  $("#ulBack3").onclick=()=>{if(W.editSet){W=null;renderLearn()}else{W.step=2;renderLearn()}};
  $("#ulCreate").onclick=()=>{
    if(W.topic==="custom"&&!W.topicLabel.trim()){toast("Name your topic first");$("#ulTopicLabel").focus();return}
    W.cards=W.cards.filter(c=>c.front.trim()||c.back.trim());
    let set;
    if(W.editSet){set=ulSet(W.editSet);Object.assign(set,{name:W.name.trim()||set.name,topic:W.topic,topicLabel:W.topicLabel.trim(),cards:W.cards})}
    else{set={id:"s"+Date.now().toString(36),name:W.name.trim()||"My upload",topic:W.topic,topicLabel:W.topicLabel.trim(),createdAt:Date.now(),
      sources:W.sources.map(s=>{if(s.thumb)store.set("ul:thumb:"+s.id,s.thumb);return{id:s.id,kind:s.kind,name:s.name,text:s.text}}),cards:W.cards};UL.push(set)}
    set.cards.forEach(c=>delete c.edited);ulFlag(set);ulSave();
    if(W.addDeck&&!W.editSet){const cards=ulEligible(set).map(c=>({front:c.front.slice(0,120),back:c.back.slice(0,200)}));if(cards.length>=2){decks.unshift({id:"deck-ul-"+set.id,name:set.name.slice(0,50),topic:set.topic,cards});saveDecks()}}
    const clips=ulVideos().filter(v=>v.ulSet===set.id),qs=clips.reduce((a,v)=>a+v.quiz.length,0),wasEdit=!!W.editSet,focused=!wasEdit&&W.focus!==false;
    if(focused){FOCUS.sets=[...new Set([...(S.feedMode==="focused"?FOCUS.sets:[]),set.id])];S.feedMode="focused";S.feedFilter=null;saveFocus();$("#feed").innerHTML=""}
    W=null;
    if(S.view==="feed"||$("#feed").children.length)renderFeed();
    renderLearn();
    const nr2=ulNeedsReview(set).length;
    sheet(`<h3>${wasEdit?"Saved":"Ready to learn"}</h3><p class="sub" style="margin:0">${clips.length} clips and ${qs} quiz questions from ${ulEligible(set).length} cards in “${esc(set.name)}”.${nr2?` ${nr2} cards still need review and were left out.`:""}</p>
      ${focused?`<p class="note">🎯 <b>Your For You feed now shows only this upload</b>${FOCUS.related?" plus app clips that match it":""}. Tap 🎯 Focused on Home to change it.</p>`:""}<p class="note">Turn on 🔊 Sound in Home for narration. Finish a clip and its questions unlock in Quiz.</p>
      <button class="btn" id="ulGo">▶ Play now</button><button class="btn ghost" data-close>Later</button>`,s=>{s.querySelector("#ulGo").onclick=()=>{s.remove();if(focused)show("feed");else ulPlay(clips.map(v=>v.id),set.name)}});
  };
}

/* ---------- squad ---------- */
let sqTab="chat";
function renderSquad(){
  const el=$("#squad");
  if(window.SR_STANDALONE&&!S.db){const h=store.get("qhist",[]),tot=h.reduce((a,x)=>a+x.total,0),cor=h.reduce((a,x)=>a+x.score,0),pct=tot?Math.round(cor/tot*100):0,me=store.get("myName","");
    const crew=store.get("crew",{}),rows=Object.values(crew).concat(me&&tot?[{n:me+" (you)",c:cor,t:tot,at:Date.now(),me:true}]:[]).sort((a,b)=>b.c/b.t-a.c/a.t||b.c-a.c);
    el.innerHTML=`<h1 class="vh">Squad</h1><p class="sub">Race your crew without accounts: send your score link, they open it and send theirs back. Everyone's board updates on their own phone.</p>
    <div class="card stack"><label class="lbl" for="sqName" style="margin:0">Your name on the board</label><input id="sqName" maxlength="30" placeholder="e.g. Sam" value="${esc(me)}">
      <div class="row2"><div><div class="score" style="font-size:40px">${h.length}</div><div class="note">quizzes taken</div></div><div><div class="score" style="font-size:40px">${pct}%</div><div class="note">${cor}/${tot} correct</div></div></div>
      <button class="btn" id="sqChallenge">🏆 Send my score to the crew</button></div>
    <div class="card stack" style="margin-top:12px"><span class="lbl" style="margin:0">Crew leaderboard</span>
      ${rows.length?`<ul class="board">${rows.map((r,i)=>`<li><span>${i+1}. ${esc(r.n)}${r.me?"":` <span class="note">· ${ago(r.at)}</span>`}</span><span class="pts">${Math.round(r.c/r.t*100)}% · ${r.c}/${r.t}</span></li>`).join("")}</ul>`:`<p class="note" style="margin:0">Empty so far. Send your score link; when a friend opens theirs, they join your board.</p>`}</div>
    <div class="card stack" style="margin-top:12px"><span class="lbl" style="margin:0">Crew chat</span><p class="note" style="margin:0">Chat in the group text you already use. Tap below to send a message with the app link.</p>
      <button class="btn ghost" id="sqMsg">💬 Message my crew</button></div>
    <div class="card stack" style="margin-top:12px"><span class="lbl" style="margin:0">Share study material</span>
      <p class="note" style="margin:0">• ↗️ Share on any clip sends it.<br>• In Learn, “Send to a friend” on an upload makes a file they open in Learn → Import file.<br>• 💬 on a clip keeps your own notes.</p></div>`;
    $("#sqName").onchange=e=>{store.set("myName",e.target.value.trim().slice(0,30));renderSquad()};
    $("#sqChallenge").onclick=()=>{const n=($("#sqName").value||"").trim().slice(0,30);if(!n){toast("Add your name first");$("#sqName").focus();return}store.set("myName",n);
      if(!tot){toast("Take a quiz first so you have a score");return}
      const link=location.origin+location.pathname+"#ch="+encodeURIComponent(JSON.stringify({n,c:cor,t:tot,at:Date.now()}));
      shareText("Shift Ready challenge",`${n} has ${cor}/${tot} (${pct}%) on Shift Ready. Open this to add me to your board, then send yours back: ${link}`)};
    $("#sqMsg").onclick=()=>shareText("Shift Ready","Studying on Shift Ready, join me: "+location.origin+location.pathname);
    return}
  const people=new Set([...S.chat.map(m=>m.author),...S.creations.map(c=>c.authorId),...S.scores.map(s=>s.id),...S.comments.map(c=>c.author)].filter(Boolean));
  if(S.myId)people.delete(S.myId);
  el.innerHTML=`<h1 class="vh">Squad</h1><p class="sub">Everyone who opens this app link studies together here: chat, share clips, and race the leaderboard.</p>
    ${!S.db?`<div class="card"><b>${S.dbState==="loading"?"Connecting…":"Squad is offline"}</b><p class="note">${S.dbState==="loading"?"Loading your crew.":(window.SR_STANDALONE?"Chat, sharing and the leaderboard work in the claude.ai version of Shift Ready. Everything else works here.":"Sign in to claude.ai and open the shared link to chat with friends. Everything else works on this device.")}</p></div>`:""}
    <span class="lbl" style="margin-top:6px">Crew (${people.size+(S.myId?1:0)})</span>
    <div class="friends">${S.myId?`<div class="friend">${avatarHTML(S.myId)}<span>You</span></div>`:""}${[...people].map(id=>`<div class="friend">${avatarHTML(id)}<span>${esc((S.names[id]||"Crew").split(" ")[0])}</span></div>`).join("")}
      ${!people.size?`<div class="friend" style="min-width:160px;text-align:left;justify-items:start"><span class="note">Share this page's link with friends to fill your crew.</span></div>`:""}</div>
    <div class="seg" style="margin-top:12px"><button data-s="chat" aria-pressed="${sqTab==="chat"}">Chat</button><button data-s="board" aria-pressed="${sqTab==="board"}">Leaderboard</button><button data-s="posts" aria-pressed="${sqTab==="posts"}">Crew clips</button></div>
    <div id="sqBody"></div>`;
  el.querySelector(".seg").onclick=e=>{const b=e.target.closest("[data-s]");if(b){sqTab=b.dataset.s;renderSquad()}};
  const body=$("#sqBody");
  if(sqTab==="chat"){
    const msgs=S.chat.slice().sort((a,b)=>a.createdAt-b.createdAt);
    body.innerHTML=`<div class="msgs">${msgs.length?msgs.map(m=>{const v=m.videoId&&byId(m.videoId);return`<div class="msg">${avatarHTML(m.author)}<div class="body"><div class="name">${esc(m.author===S.myId?"You":(S.names[m.author]||"Crew member"))}<span>${ago(m.createdAt)}</span></div>${m.text?`<div class="txt">${esc(m.text)}</div>`:""}${v?`<button class="mini" data-id="${esc(v.id)}"><span class="e">${esc(v.scenes[0].emoji)}</span><div><div class="t">${esc(v.title)}</div><div class="s">${v.topic.toUpperCase()} · tap to watch</div></div></button>`:""}</div></div>`}).join(""):`<div class="empty"><div class="big">📻</div>Channel is quiet. Say hi or share a clip from Home with ↗️.</div>`}</div>
      <form class="composer" id="chatForm"><input id="chatText" maxlength="300" placeholder="Message your squad…" aria-label="Message"><button class="btn" type="submit">Send</button></form>`;
    body.onclick=e=>{const m=e.target.closest(".mini");if(m)openVideo(m.dataset.id)};
    $("#chatForm").onsubmit=async e=>{e.preventDefault();const t=$("#chatText").value.trim();if(!t||!needDb())return;
      try{await S.db.collection("chat").add({author:S.myId,text:t,createdAt:Date.now()});$("#chatText").value=""}catch(err){toast("Message didn't send. You may have view-only access.")}};
    const v=$("#squad");v.scrollTop=v.scrollHeight;
  } else if(sqTab==="board"){
    const rows=S.scores.slice().sort((a,b)=>(b.correct||0)-(a.correct||0));
    body.innerHTML=rows.length?`<ul class="board">${rows.map((r,i)=>`<li><span>${i+1}. ${esc(r.id===S.myId?"You":(S.names[r.id]||"Crew member"))}</span><span class="pts">${r.correct||0} correct · ${r.answered?Math.round(r.correct/r.answered*100):0}%</span></li>`).join("")}</ul>`:`<div class="empty"><div class="big">🏆</div>Finish a quiz to post the first score.</div>`;
  } else {
    body.innerHTML=S.creations.length?`<div class="grid">${S.creations.map(v=>`<button class="tile" data-topic="${esc(v.topic)}" data-id="${esc(v.id)}"><span class="e">${esc(v.scenes[0].emoji)}</span><span><span class="t">${esc(v.title)}</span><div class="c">${esc(creatorName(v))}</div></span></button>`).join("")}</div>`:`<div class="empty"><div class="big">🎬</div>No crew clips yet. Be first in Create.</div>`;
    body.onclick=e=>{const t=e.target.closest(".tile");if(t)openVideo(t.dataset.id)};
  }
}

/* ---------- shared data ---------- */
async function resolveNames(){
  if(!S.user)return;
  const ids=[...new Set([S.myId,...S.chat.map(m=>m.author),...S.creations.map(c=>c.authorId),...S.scores.map(s=>s.id),...S.comments.map(c=>c.author)].filter(Boolean))];
  if(!ids.length)return;
  try{const ps=await S.user.profiles(ids);ids.forEach(id=>{const p=ps[id];if(p){S.names[id]=p.name||"Crew member";if(p.avatarUrl)S.avatars[id]=p.avatarUrl}})}catch(e){}
}
function rerenderSoft(){
  updateCounts();
  if(S.view==="squad"){const active=document.activeElement&&document.activeElement.id;const val=$("#chatText")&&$("#chatText").value;renderSquad();if(val&&$("#chatText"))$("#chatText").value=val;if(active==="chatText")$("#chatText")&&$("#chatText").focus()}
  if(S.view==="search")drawResults();
  if(S._commentSheet&&S._commentSheet.s.isConnected)S._commentSheet.draw(S._commentSheet.s);
}
function subscribe(){
  const db=S.db;let first=0;
  const loadT=setTimeout(()=>{if(S.dbState==="loading"){S.dbState="slow";rerenderSoft()}},10000);
  const done=()=>{clearTimeout(loadT);S.dbState="ready"};
  const onErr=()=>{done();};
  db.collection("chat").orderBy("createdAt","desc").limit(150).onSnapshot(snap=>{done();S.chat=snap.docs.map(d=>({id:d.id,...d.data()}));resolveNames().then(rerenderSoft)},onErr);
  db.collection("comments").orderBy("createdAt","desc").limit(500).onSnapshot(snap=>{done();S.comments=snap.docs.map(d=>({id:d.id,...d.data()}));resolveNames().then(rerenderSoft)},onErr);
  db.collection("scores").onSnapshot(snap=>{done();S.scores=snap.docs.map(d=>({id:d.id,...d.data()}));resolveNames().then(rerenderSoft)},onErr);
  db.collection("creations").orderBy("createdAt","desc").limit(200).onSnapshot(snap=>{done();
    const before=S.creations.length;
    S.creations=snap.docs.map(d=>{const x=d.data();return{...x,id:"c-"+d.id,ugc:true,title:String(x.title||"Untitled"),videoUrl:(typeof x.videoId==="string"&&/^[0-9a-f]{32}$/.test(x.videoId))?"/_blob/"+x.videoId:((typeof x.videoUrl==="string"&&/^(\/_blob\/|https:\/\/)/.test(x.videoUrl))?x.videoUrl:null),scenes:Array.isArray(x.scenes)&&x.scenes.length?x.scenes.slice(0,6).map(s=>({emoji:String(s&&s.emoji||"📌"),heading:String(s&&s.heading||""),text:String(s&&s.text||"")})):[{emoji:"🎬",heading:"Clip",text:""}],quiz:Array.isArray(x.quiz)?x.quiz:[],hashtags:Array.isArray(x.hashtags)?x.hashtags:[]}}).filter(c=>c.topic==="emt"||c.topic==="fire");
    resolveNames().then(()=>{rerenderSoft();if(S.view==="create")renderCreate();if(S.view==="feed"&&S.creations.length!==before&&$("#feed").scrollTop<10)renderFeed()});
  },onErr);
}

/* ---------- boot ---------- */
function boot(){
  VDB.all().then(m=>{let n=0;for(const k in m){if(S.localCreations.some(c=>c.id===k)&&!LOCAL_VIDEO[k]){LOCAL_VIDEO[k]=URL.createObjectURL(m[k]);n++}}if(n&&S.view==="feed"&&$("#feed").scrollTop<10)renderFeed()}).catch(()=>{});
  const t=store.get("topic","emt");S.topic=t;document.documentElement.dataset.topic=t;$("#tEmt").setAttribute("aria-pressed",t==="emt");$("#tFire").setAttribute("aria-pressed",t==="fire");
  $("#soundBtn").textContent=S.sound?"🔊 Sound":"🔇 Sound";$("#soundBtn").setAttribute("aria-pressed",S.sound);
  if(S.sound){const u=document.createElement("button");u.id="unmute";u.className="pill";u.textContent="🔊 Tap to start sound";u.style.cssText="position:absolute;z-index:30;top:50%;left:50%;transform:translate(-50%,-50%);font-size:15px;padding:12px 18px";
    u.onclick=()=>{S.unlocked=true;u.remove();if(P.el&&!P.paused)speakScene(P.idx)};$("main").appendChild(u);document.addEventListener("keydown",()=>{S.unlocked=true;u.remove()},{once:true})}
  renderFeed();updateCounts();
  {const m=location.hash.match(/^#ch=(.+)$/);if(m){try{const o=JSON.parse(decodeURIComponent(m[1]));const n=String(o.n||"").trim().slice(0,30),c=Math.floor(+o.c),t=Math.floor(+o.t),at=Math.min(Date.now(),+o.at||Date.now());
    if(n&&t>0&&t<=100000&&c>=0&&c<=t){const crew=store.get("crew",{});crew[n.toLowerCase()]={n,c,t,at};store.set("crew",crew);setTimeout(()=>{show("squad");toast(`Added ${n} to your crew board`)},300)}}catch(e){}history.replaceState(null,"",location.pathname+location.search)}}
  const h=location.hash.match(/^#v-([\w-]+)$/);if(h&&byId(h[1]))openVideo(h[1]);
  if(window.SR_STANDALONE){S.names.me="You";S.comments=store.get("localComments",[]).filter(c=>c&&c.videoId&&c.text)}
  if(window.claude&&window.claude.use){
    claude.use("user").then(async u=>{S.user=u;if(u){try{S.myId=await u.id()}catch(e){}ulRemote();await resolveNames();rerenderSoft()}}).catch(()=>{});
    claude.use("db").then(db=>{S.db=db;if(db){subscribe();ulRemote()}else{S.dbState="off"}rerenderSoft();if(S.view==="create")renderCreate()}).catch(()=>{S.dbState="off";rerenderSoft()});
    claude.use("tts").then(t=>{S.tts=t}).catch(()=>{});
    claude.use("sample").then(s=>{S.sample=s;if(s)s.limits().then(c=>{S.ulImgCaps=c&&c.images||null;if(S.view==="learn")renderLearn()}).catch(()=>{});if(S.view==="learn")renderLearn();if(S.view==="create")renderCreate()}).catch(()=>{});
  } else {S.dbState="off"}
}
boot();
})();
</script>

<button id="updateBar" hidden>Update ready · tap to reload</button>
<script>
(function(){
  var bar=document.getElementById("updateBar");
  bar.onclick=function(){location.reload()};
  function check(){
    if(!navigator.onLine)return;
    fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(v){
      if(v&&v.build&&v.build!==window.SR_BUILD)bar.hidden=false;
    }).catch(function(){});
  }
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").then(function(reg){reg.update().catch(function(){})}).catch(function(){});
  }
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")check()});
  setTimeout(check,3000);setInterval(check,30*60*1000);
})();
</script>
